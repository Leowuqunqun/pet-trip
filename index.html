<script>
(function(){
"use strict";

/* ───────── 词表 ───────── */
var KIND_LABEL = {
  campground:"营地", lodging:"住宿", park:"公园", water:"水域",
  village:"古村", scenic:"景区", transit:"交通", food:"餐饮", other:"其他"
};
/* 类别色：2026-11-20 从 9 个高饱和色换成"同一明度带去饱和"的一族。
   原来一屏里橙/绿/蓝/紫/棕/红全上，列表像色块墙；现在靠色相区分，但都不刺眼。 */
var KIND_COLOR = {
  campground:"#2F5945", lodging:"#4A6B7A", park:"#8A7A3E", water:"#3D748C",
  village:"#8A5F52", scenic:"#6B6288", transit:"#6E7264", food:"#96683F", other:"#8A8F8D"
};
var KIND_ICON = {
  campground:"营", lodging:"宿", park:"园", water:"水",
  village:"村", scenic:"景", transit:"交", food:"食", other:"·"
};
var NIGHT_LABEL = {
  official_camp:["可扎营","g"], lodging:["可住店","s"], allowed_wild:["可野营","g"],
  gray:["灰色地带","a"], forbidden:["禁过夜","r"], unknown:["过夜未核实","n"]
};
var DOG_LABEL = {
  allowed:["可带狗","g"], leash:["需牵绳","a"], fee:["收费","a"],
  forbidden:["禁入","r"], restricted:["部分区域受限","a"], unknown:["犬政策未核实","n"]
};
/* 犬档依据（2026-11-25）：explicit=原文点名可带、default=没查到禁令按默认放行、
   restricted=部分不让、veto=整体不让、unknown=未核实。
   这几档的可信度完全不同，详情页必须把"依据等级"说出来——
   否则"可带狗"三个字会被当成同样可靠，而实测 explicit 里约三分之一站不住（见 dog-evidence-gold.json）。 */
var DOG_BASIS = {
  explicit:["原文点名可带（有原话）","g"],
  default:["没查到禁令，按默认放行（未点名）","a"],
  restricted:["部分区域/设施不让","a"],
  veto:["明确不让带","r"],
  unknown:["未核实","n"]
};

var DATA=null, MAP=null, CLUSTER=null, STATE={hours:null, night:false, dog:false, kinds:{}, scenes:{}, season:{}, dogTier:{}, provinces:{}, camp:false, q:"", active:null, trip:[], been:[], provExpanded:false, autoFit:false, fitHours:null, fitCenter:null, sortMode:"drive"};

/* ───────── 工具 ───────── */
function el(id){return document.getElementById(id);}
/* 在线图挂了不显示破图图标，改成"图没加载出来"的虚线占位 */
window.__imgFail = function(img){
  img.classList.add("broken");
  img.removeAttribute("src");
  var fig = img.parentNode.querySelector("figcaption");
  if(fig && !fig.dataset.warn){
    fig.dataset.warn = "1";
    fig.innerHTML += ' · <span style="color:var(--ink-3)">图未加载</span>';
  }
};

function srcLabel(s){
  // 车程来自哪家服务商是**技术细节**，看的人不需要知道，更不该看到「高德」。
  // 底图版权那一行保留高德是图源 ToS 要求，与数据来源无关。
  if(!s) return '';
  return /真实路网/.test(s) ? '真实路网驾车路径规划' : s;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function hm(h){var t=Math.round(h*60);return Math.floor(t/60)+"h"+(t%60?String(t%60).padStart(2,"0"):"");}
/* 卡片上的车程用中文读法：0h27 是机器写法，27 分 才是人话 */
function hmCN(h){
  var t = Math.round(h * 60), hh = Math.floor(t / 60), mm = t % 60;
  if(hh && mm) return hh + " 小时 " + mm + " 分";
  if(hh) return hh + " 小时";
  return mm + " 分";
}
function tag(txt,cls){return '<span class="tag '+cls+'">'+esc(txt)+'</span>';}
/* 卡片上的「加入行程」按钮：整行右侧、垂直居中（2026-11-20 owner 要求） */
function tripBtnHTML(id){
  var on = inTrip(id);
  return '<button class="card-trip' + (on ? " on" : "") + '" data-trip="' + esc(id) + '"' +
         ' title="' + (on ? "从行程移除" : "加入行程") + '"' +
         ' aria-label="' + (on ? "从行程移除" : "加入行程") + '">' +
         (on ? "✓" : "＋") + '</button>';
}
/* 数据里的值必须落在词表内，否则 NIGHT_LABEL[k] 是 undefined，
   [0] 取标签时整页渲染直接抛异常、列表变成"数据加载失败"（实测踩过）。
   这里兜一层：认不出来的值退化成"未核实"，不让一个数据笔误毁掉整个页面。 */
function nightKey(s){
  var k = (s.overnight && s.overnight.status) || "unknown";
  return NIGHT_LABEL[k] ? k : "unknown";
}
function dogKey(s){
  var k = (s.dog && s.dog.policy) || "unknown";
  return DOG_LABEL[k] ? k : "unknown";
}
function isNight(s){var k=nightKey(s);return k==="official_camp"||k==="lodging"||k==="allowed_wild"||k==="gray";}

/* ───────── 筛选 ───────── */
/* 筛选项有两种粒度：chip 是"桶"（公园/水域合一个），图例是"具体类型"。
   两者都写进 STATE.kinds，判定时统一展开，避免两套逻辑各说各话。 */
/* 不再合并桶。以前 village+scenic 合成一个桶、park+water 合成一个桶，
   点「古村」会把景区一起带出来——用户抱怨"筛选不精细"有一半来自这里。
   现在 kind 有真实来源（高德 POI 类型 + 名字规则），可以精确筛。 */
function selectedKinds(){
  return Object.keys(STATE.kinds).filter(function(k){ return STATE.kinds[k]; });
}
function kindActive(kind){
  var sel = selectedKinds();
  if(!sel.length) return true;
  return sel.indexOf(kind) >= 0;
}
/* 场景是"想干什么"，与设施类型正交：一个水库既是水域，也是玩水点、可能还能露营。 */
function selectedScenes(){
  return Object.keys(STATE.scenes).filter(function(k){ return STATE.scenes[k]; });
}
/* 「能露营」= 允许扎营：过夜状态是官方营地/野外露营，或者类型就是营地，
   或者笔记里明确提到露营。三个来源取并集，因为"这里能不能搭帐篷"正是它们合起来回答的问题。 */
function canCamp(s){
  var st = (s.overnight || {}).status;
  if(st === "official_camp" || st === "allowed_wild") return true;
  if(s.kind === "campground") return true;
  return (s.scenes || []).indexOf("露营") >= 0;
}

/* 玩法组的"或"：勾中的场景 + 能过夜 + 能露营，命中任意一个就算。
   「能过夜」「能露营」在界面上和别的玩法摆在一起，用户读到的规则就是"任一项对上就算"，
   所以它们必须是 OR 的一员——先写成独立 AND，等于"玩水 且 能露营"，
   与抽屉里那行说明自相矛盾（实测 玩水338 + 能露营277 只剩 101 个）。 */
function sceneOrActive(s){
  var sel = selectedScenes() || [];
  var hit = false;
  if(sel.length) hit = hit || sel.some(function(k){ return (s.scenes || []).indexOf(k) >= 0; });
  if(STATE.camp) hit = hit || canCamp(s);
  if(STATE.night) hit = hit || isNight(s);
  var any = sel.length > 0 || STATE.camp || STATE.night;
  return any ? hit : true;
}

function sceneActive(list){
  var sel = selectedScenes();
  if(!sel.length) return true;
  list = list || [];
  return sel.some(function(k){ return list.indexOf(k) >= 0; });
}
/* chip 的按下状态 = 这个桶被选中；图例的按下状态 = 这个具体类型被选中 */
/* 面板收起后，已选的筛选必须以 chip 形式留在第一排——
   否则用户看到"52 个点"却看不到原因，只会以为数据丢了。点一下就能取消。 */
function syncSummary(){
  var out = [];
  Object.keys(STATE.season).forEach(function(k){
    if(STATE.season[k]) out.push('<button class="fsum" data-clear-season="'+esc(k)+'">'+esc(k)+'<span class="x">✕</span></button>');
  });
  Object.keys(STATE.scenes).forEach(function(k){
    if(STATE.scenes[k]) out.push('<button class="fsum" data-clear-scene="'+esc(k)+'">'+esc(k)+'<span class="x">✕</span></button>');
  });
  Object.keys(STATE.dogTier).forEach(function(k){
    if(STATE.dogTier[k]){
      var lb = k === "explicit" ? "明确友好" : "默认允许";
      out.push('<button class="fsum" data-clear-dog="'+esc(k)+'">'+lb+'<span class="x">✕</span></button>');
    }
  });
  Object.keys(STATE.provinces).forEach(function(k){
    if(STATE.provinces[k]) out.push('<button class="fsum" data-clear-province="'+esc(k)+'">'+esc(k)+'<span class="x">✕</span></button>');
  });
  if(STATE.night) out.push('<button class="fsum" data-clear-night="1">能过夜<span class="x">✕</span></button>');
  if(STATE.camp) out.push('<button class="fsum" data-clear-camp="1">能露营<span class="x">✕</span></button>');
  Object.keys(STATE.kinds).forEach(function(k){
    if(STATE.kinds[k]) out.push('<button class="fsum" data-clear-kind="'+esc(k)+'">'+esc(KIND_LABEL[k]||k)+'<span class="x">✕</span></button>');
  });
  var n = out.length;
  if(n) out.push('<button class="fsum fsum-clear" data-clear-all="1">清空</button>');
  el("fsum").innerHTML = out.join("");
  el("fpanel-n").textContent = n ? String(n) : "";
  /* 按钮有没有"已启用"状态：原来只把数字塞进去，颜色不变，
     关掉抽屉之后完全看不出自己还带着条件（2026-11-21 实测 aria-pressed 一直是 false）。 */
  /* 只改视觉状态，不碰 aria-pressed——那个属性被"抽屉是否展开"占着，
     两边都写会互相覆盖（实测 class 是 on、aria-pressed 却是 false，自相矛盾）。 */
  var tg = el("fpanel-toggle");
  if(tg) tg.classList.toggle("on", n > 0);
}

function syncFilterUI(){
  syncSummary();
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-f]"), function(b){
    var f = b.getAttribute("data-f");
    if(f === "night"){ b.setAttribute("aria-pressed", STATE.night ? "true" : "false"); return; }
    if(f === "camp"){ b.setAttribute("aria-pressed", STATE.camp ? "true" : "false"); return; }
    b.setAttribute("aria-pressed", STATE.kinds[f] ? "true" : "false");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-scene]"), function(b){
    b.setAttribute("aria-pressed", STATE.scenes[b.getAttribute("data-scene")] ? "true" : "false");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-sort]"), function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-sort") === (STATE.sortMode||"drive") ? "true" : "false");
  });
  var st = el("sheet-title");
  if(st) st.textContent = SORT_LABEL[STATE.sortMode||"drive"] || SORT_LABEL.drive;
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-dog]"), function(b){
    b.setAttribute("aria-pressed", STATE.dogTier[b.getAttribute("data-dog")] ? "true" : "false");
  });
  document.querySelectorAll(".chip[data-season]").forEach(function(b){
    b.setAttribute("aria-pressed", STATE.season[b.getAttribute("data-season")] ? "true" : "false");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-province]"), function(b){
    b.setAttribute("aria-pressed", STATE.provinces[b.getAttribute("data-province")] ? "true" : "false");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".legend [data-kind]"), function(b){
    b.setAttribute("aria-pressed", kindActive(b.getAttribute("data-kind")) ? "true" : "false");
  });
}

function match(s){
  var dr = driveInfo(s);
  if(dr && STATE.hours != null && dr.hours_oneway > STATE.hours) return false;
  if(!dr) return false;

  var dt = Object.keys(STATE.dogTier).filter(function(k){ return STATE.dogTier[k]; });
  if(dt.length){
    var tier = s.dog_tier || "unknown";
    /* 主人的规则是「没明确说不让带，就按能带来算」——所以"犬政策未核实"必须算进
       「默认允许」，否则勾了这一档就会把这 124 个点整批藏掉，跟规则相反。
       "未核实"在卡片上仍如实标注，只是不因为没查到就把它排除。 */
    var hit = dt.indexOf(tier) >= 0 ||
              (tier === "unknown" && dt.indexOf("default") >= 0);
    if(!hit) return false;
  }
  var pv = Object.keys(STATE.provinces).filter(function(k){ return STATE.provinces[k]; });
  if(pv.length && pv.indexOf(s.province || "") < 0) return false;
  if(!sceneOrActive(s)) return false;
  if(!kindActive(s.kind)) return false;
  if(!seasonActive(s)) return false;
  if(!matchQuery(s, STATE.q)) return false;
  return true;
}

/* 季节筛选（2026-11-21 owner：「你要增加筛选即可」）——
   推荐那边不再按季节收窄候选，改由用户自己筛。
   「当季最佳」= 只看当前季节档位 3；具体季节 = 该季档位 ≥2（值得去）。 */
/* 地点搜索（2026-11-21）：名字 / 城市 / 省份 / 上级 POI 名，子串匹配，不区分大小写。
   不做拼音：库里没有拼音字段，硬编一个近似表反而会给出"看起来搜到了其实不对"的结果。 */
function matchQuery(s, q){
  if(!q) return true;
  q = q.toLowerCase();
  /* aliases：合并重复点时被并掉的那个名字（「东钱湖」并入「东钱湖风景名胜区」之后，
     搜「东钱湖」还得能找出来）。不带上这一条，合并就等于把一个搜索入口丢了。 */
  var hay = [s.name, s.city, s.province, s.poi_name,
             (s.tags||[]).join(" "), (s.aliases||[]).join(" ")].join(" ").toLowerCase();
  return hay.indexOf(q) >= 0;
}
function selectedSeasons(){
  return Object.keys(STATE.season).filter(function(k){ return STATE.season[k]; });
}
function seasonActive(s){
  var sel = selectedSeasons();
  if(!sel.length) return true;
  var cur = seasonOf(new Date());
  return sel.some(function(k){
    if(k === "当季最佳") return seasonTier(s, cur) === 3;
    return seasonTier(s, k) >= 2;
  });
}

/* ───────── 渲染列表 ───────── */
/* 有没有勾任何筛选条件（不含搜索与车程滑块，那两个各自有独立入口） */
function hasFilters(){
  function any(o){ return o && Object.keys(o).some(function(k){ return o[k]; }); }
  return any(STATE.scenes) || any(STATE.kinds) || any(STATE.dogTier) ||
         any(STATE.provinces) || any(STATE.season) || !!STATE.night || !!STATE.camp;
}

/* 一键清空所有筛选（2026-11-24 抽出来）：
   以前这段逻辑只挂在抽屉/筛选条上的 .fsum 按钮里，而空状态里的"清空筛选看全部"
   长在列表容器里——点下去毫无反应，等于给了一个假按钮。现在两边共用同一段。 */
function clearAllFilters(){
  STATE.night = false; STATE.camp = false; STATE.hours = null;
  var rr = el("range"); if(rr) rr.value = "13";
  var ro2 = el("range-out"); if(ro2) ro2.textContent = "不限";
  ["season","scenes","dogTier","provinces","kinds"].forEach(function(k){
    Object.keys(STATE[k] || {}).forEach(function(x){ STATE[k][x] = false; });
  });
}

/* 空状态不要只会说"清空"（2026-11-24）：用户勾了四五个条件仍然想找"附近能带狗的地方"，
   一刀切清空等于把他选的东西全扔了。这里算一下"**只放松这一个条件**能救回多少个点"，
   按救回多少排序给前三个——点一下只放掉那一个，其余保留。
   为什么不是"每个都试"：按钮一多就成了第二个筛选面板，反而更难选。 */
function relaxOptions(){
  var opts = [];
  function dimOn(k){ return Object.keys(STATE[k] || {}).some(function(x){ return STATE[k][x]; }); }
  function tryOff(key, label){
    var saved;
    if(key === "hours"){ saved = STATE.hours; STATE.hours = null; }
    else if(key === "q"){ saved = STATE.q; STATE.q = ""; }
    else { saved = STATE[key]; STATE[key] = {}; }
    var n = 0;
    try{ n = sortedFiltered().length; }catch(e){ n = 0; }
    if(key === "hours") STATE.hours = saved;
    else if(key === "q") STATE.q = saved;
    else STATE[key] = saved;
    if(n > 0) opts.push({key: key, label: label, n: n});
  }
  if(dimOn("season")) tryOff("season", "不限季节");
  if(selectedScenes().length) tryOff("scenes", "取消场景");
  if(selectedKinds().length) tryOff("kinds", "取消类型");
  if(dimOn("dogTier")) tryOff("dogTier", "放宽犬政策");
  if(dimOn("provinces")) tryOff("provinces", "不限省份");
  if(STATE.hours != null) tryOff("hours", "不限车程");
  if(STATE.q) tryOff("q", "清掉搜索");
  opts.sort(function(a, b){ return b.n - a.n; });
  return opts.slice(0, 3);
}

function applyRelax(key){
  if(key === "hours"){
    STATE.hours = null;
    var rr = el("range"); if(rr) rr.value = "13";
    var ro = el("range-out"); if(ro) ro.textContent = "不限";
    return;
  }
  if(key === "q"){
    STATE.q = "";
    var qi = el("q"); if(qi) qi.value = "";
    return;
  }
  Object.keys(STATE[key] || {}).forEach(function(x){ STATE[key][x] = false; });
}

var SORT_LABEL = {drive:"按车程排序", heat:"按热度排序", dog:"按犬友好排序"};
var DOG_RANK = {explicit:3, default:2, restricted:1, unknown:0, veto:-1};

function spotHeat(s){
  var h = s.heat || s.pop || {};
  return { notes: (h.notes||0), likes: (h.likes||0) };
}
function hoursOf(s){ return ((driveInfo(s)||{}).hours_oneway||99); }

function sortedFiltered(){
  var mode = STATE.sortMode || "drive";
  return DATA.spots.filter(match).slice().sort(function(a,b){
    if(mode === "heat"){
      /* 热度＝小红书上这段时间有多少人在发（owner 定义）。条数为主，点赞为辅。 */
      var ha = spotHeat(a), hb = spotHeat(b);
      if(hb.notes !== ha.notes) return hb.notes - ha.notes;
      if(hb.likes !== ha.likes) return hb.likes - ha.likes;
      return hoursOf(a) - hoursOf(b);
    }
    if(mode === "dog"){
      /* 犬友好档位：明确友好 > 默认允许 > 部分受限 > 未核实 > 禁入；同档再看车程 */
      var ra = DOG_RANK[a.dog_tier] != null ? DOG_RANK[a.dog_tier] : 0;
      var rb = DOG_RANK[b.dog_tier] != null ? DOG_RANK[b.dog_tier] : 0;
      if(ra !== rb) return rb - ra;
      return hoursOf(a) - hoursOf(b);
    }
    /* 默认：单程车程由近到远 */
    return hoursOf(a) - hoursOf(b);
  });
}

/* 列表跟地图视口走：用户把地图移到哪片，左边就列哪片。
   注意标记**不能**跟着视口走——标记一删，平移走再回来就空了。
   所以 render() 重建标记用全部筛选结果，renderNear() 只重排卡片。 */
/* 地图不可见（手机推荐页 display:none）时容器是 0×0，getBounds() 退化成空范围，
   那样会把所有点判成"不在视口内"，列表直接空掉。必须先确认地图有尺寸。 */
function mapUsable(){
  if(!MAP) return false;
  var sz = MAP.getSize();
  return !!(sz && sz.x > 40 && sz.y > 40);
}
function inView(s){
  if(!mapUsable()) return true;
  return MAP.getBounds().contains([s.gcj[1], s.gcj[0]]);
}

function render(){
  var all = sortedFiltered();
  syncMarkers(all);
  renderCards(all);
  /* 有地图就按视野列卡片：这样提示行才说得清"地图范围内 N 个"，
     而不是把筛选总数再说一遍（顶部圆片已经在说总数了）。 */
  if(mapUsable()) renderNear();
  saveFilters();     /* 每次渲染顺手记住条件；内部按签名比对，不变就不写盘 */
}

var LIST_SHOWN = 120, LAST_LIST = null, LAST_LIST_SIG = null;

function renderNear(){
  if(!mapUsable()) return;
  var all = sortedFiltered();
  renderCards(all.filter(inView), all.length);
}

function renderCards(list, totalAll){
  var scoped = (totalAll != null && totalAll !== list.length);
  /* 2026-11-20 owner 定调：**总数是静态的，地图内的数量才是动态的**。
     原来正好反了 —— 顶部圆片跟着地图缩放变，左侧面板反而写死"共 N 个"，
     两个数字一静一动摆反了位置，看的人会以为全国的点位在缩水。 */
  /* 顶部这个数 = **筛选后**的总数，但**不跟地图视野变**（owner 2026-11-20 裁决：
     "总的数量不跟随地图而动态减少，左侧面板上的才应该是动态的"）。
     所以传的是 totalAll（已过滤、与视野无关），不是 list（视野内）；视野内的数在提示行。 */
  el("count").textContent = (totalAll != null ? totalAll : list.length) + " 个点";
  var hint = el("list-hint");
  /* 原来只分了"视野内/全量"两种说法，于是勾了筛选之后顶部写着 116 个点、
     提示行还写"全部点位"——两句话自相矛盾（2026-11-21 实测）。 */
  hint.textContent = scoped
    ? (STATE.q ? "搜到 " + list.length + " 个" : "地图范围内 " + list.length + " 个")
    : (STATE.q ? "搜到 " + list.length + " 个"
       : (hasFilters() ? "筛选后 " + list.length + " 个"
          : (STATE.hours == null ? "全部点位" : "单程 ≤" + STATE.hours.toFixed(1) + "h 内")));

  var box = el("list");
  if(!list.length){
    if(scoped){
      /* 这一片没点 ≠ 筛得太狠，别让用户去改筛选条件 */
      box.innerHTML = '<div class="empty">地图上这一片没有点。<br>' +
                      '把地图缩小一点，或拖回长三角看看。</div>';
      return;
    }
    /* 换了出发地之后一个点都没有：大概率不是筛选问题，是那个城市周边还没采。
       这种时候让用户去拉滑块是骗人——全国的点还在采集中。 */
    if(ORIGIN && ORIGIN.custom){
      var total = sortedFiltered().length;
      if(!total){
        box.innerHTML = '<div class="empty">' + esc(ORIGIN.name) + '出发' +
          (STATE.hours == null ? '周边' : ' ' + STATE.hours.toFixed(1) + ' 小时内') + '还没有点位。<br>全国的点还在采集中，先把单程上限拉大看看，' +
          '或者点左上角换回上海。</div>';
        return;
      }
    }
    /* 选了省份却一个点都没有：几乎一定是车程上限比这些省份的最近点还短
       （福建/山东/江西 的最近点都在 5h 以外）。只写一句"把单程时长拉长"等于
       让用户自己去拖滑块——实测点"福建"就是这么得到 0 个点的，入口形同虚设。
       这里直接给一个"放宽到能看见第一个点"的按钮。 */
    var pvSel = Object.keys(STATE.provinces).filter(function(k){ return STATE.provinces[k]; });
    if(pvSel.length){
      var need = null;
      (DATA.spots||[]).forEach(function(s){
        if(pvSel.indexOf(s.province||"") < 0) return;
        var dr0 = driveInfo(s); if(!dr0) return;
        if(need === null || dr0.hours_oneway < need) need = dr0.hours_oneway;
      });
      if(STATE.hours != null && need !== null && need > STATE.hours){
        var fixed = Math.min(13, Math.ceil(need*2)/2);
        box.innerHTML = '<div class="empty">' + esc(pvSel.join("、")) + ' 的点都在 ' +
          STATE.hours.toFixed(1) + ' 小时以外（最近的约 ' + need.toFixed(1) + 'h）。<br>' +
          '<button class="fsum" data-fix-hours="' + fixed.toFixed(1) + '" style="margin-top:8px">' +
          '把单程放宽到 ' + fixed.toFixed(1) + 'h</button></div>';
        return;
      }
    }
    /* 空状态要说人话（2026-11-24）：以前不管什么原因都写"试试把单程时长拉长"，
       可搜"qzwx"搜不到时，车程根本没关系——等于把人指去拖一个不相干的滑块。
       现在按真正在起作用的那个条件说，并给一个一键解决它的按钮。 */
    if(STATE.q){
      box.innerHTML = '<div class="empty">没搜到带「' + esc(STATE.q) + '」的点。' +
        '<br>换个词试试，或者把搜索清掉看全部。<br>' +
        '<button class="fsum" data-clear-q="1" style="margin-top:8px">清掉搜索</button></div>';
      return;
    }
    var hints = [];
    /* 季节也要说（2026-11-24）：冬天「最佳」的点全国只有 5 个，勾了「冬」很容易一下清空，
       而以前的提示里根本没有季节这一条 —— 用户只能猜是不是自己点错了。顺手给一个一键清空。 */
    if(Object.keys(STATE.season).some(function(k){ return STATE.season[k]; })) hints.push("不限季节");
    if(selectedScenes().length) hints.push("取消场景筛选");
    if(selectedKinds().length) hints.push("取消类型筛选");
    if(Object.keys(STATE.dogTier).some(function(k){ return STATE.dogTier[k]; })) hints.push("放宽犬政策要求");
    hints.push("把单程时长拉长");
    var anyFilter = hasFilters() || (STATE.hours != null);
    /* 2026-11-24：先给"只放松一个条件"的按钮（按救回多少排序），再给一刀切清空。
       原来只有清空 → 用户要么全丢、要么自己猜该取消哪个。 */
    var relax = anyFilter ? relaxOptions() : [];
    var relaxHtml = relax.map(function(o){
      return '<button class="fsum" data-relax="' + o.key + '" style="margin-top:6px;display:block;width:100%">' +
             o.label + ' → 还有 ' + o.n + ' 个</button>';
    }).join("");
    box.innerHTML = '<div class="empty">这个条件下没有点。<br>试试' +
                    (relax.length ? '只放松一个条件：' :
                      (hints.length > 1 ? hints.slice(0,-1).join("、") + "，或" : "") + hints[hints.length-1] + "。") +
                    relaxHtml +
                    (anyFilter ? '<br><button class="fsum" data-clear-all="1" style="margin-top:8px">清空筛选看全部</button>' : '') +
                    '</div>';
    /* 这些按钮不在 #filters / #fpanel 里，委托监听收不到点击 —— 得自己绑。 */
    Array.prototype.forEach.call(box.querySelectorAll("[data-relax]"), function(btn){
      btn.onclick = function(ev){
        ev.stopPropagation();
        applyRelax(btn.getAttribute("data-relax"));
        PLAN.dirty = true; syncFilterUI(); render();
      };
    });
    var cbAll = box.querySelector("[data-clear-all]");
    if(cbAll) cbAll.onclick = function(ev){
      ev.stopPropagation();
      clearAllFilters(); PLAN.dirty = true; syncFilterUI(); render();
    };
    return;
  }
  /* 分页（2026-11-23）：原来固定只画前 120 张，底下只留一句"还有 N 个没列出来，
     缩小范围看"——等于让人自己去猜怎么缩小。现在给一个"再看一批"，
     想翻就翻，不想翻也不占地方。列表一变（换筛选/换视野）就退回第一批。 */
  var TOTAL = list.length, PAGE = 120;
  var sig = TOTAL + "|" + ((list[0] && list[0].id) || "") + "|" + ((list[TOTAL-1] && list[TOTAL-1].id) || "");
  if(sig !== LAST_LIST_SIG){ LAST_LIST_SIG = sig; LIST_SHOWN = PAGE; }
  var pageList = list.slice(0, LIST_SHOWN);
  LAST_LIST = list;
  box.innerHTML = pageList.map(function(s){
    var k = s.kind, col = KIND_COLOR[k]||"#9C8A76";
    var nk = nightKey(s), dk = dogKey(s);
    /* 未知值不挂徽章：新增的 1300 多个点全是"未核实"，
       每张卡都挂两个一样的灰标等于没传递任何信息。
       详情页仍完整显示"未核实"，筛选器「已确认可带狗」是唯一的确认口径。 */
    /* 厕所直接上卡片：到了地方没厕所比没水更劝退，浏览时就该看得见。
       只有笔记里写明了才显示，没查到的不挂灰标——一排「未核实」等于没信息。 */
    /* 卡片只留三个"扫一眼就能判断去不去"的事实：犬政策、能不能睡、去干什么。
       厕所/收费/水源挪进详情——一屏六七个胶囊，等于没有重点。 */
    var facts = [];
    /* 犬徽章按分档写，不再笼统写「可带狗」：
       明确友好（232）= 笔记/园区明说可以带；默认允许（67）= 只是现场没禁止标识。
       两者风险不同，卡片上就该看出来。 */
    var tier = s.dog_tier || "unknown";
    var dogTxt = tier==="explicit"   ? ["明确友好","g"]
               : tier==="default"    ? ["默认允许","a"]
               : tier==="veto"       ? ["禁入","r"]
               : tier==="restricted" ? ["部分受限","a"]
               : (dk==="unknown" ? null : [DOG_LABEL[dk][0], DOG_LABEL[dk][1] || "n"]);
    if(dogTxt) facts.push('<span class="fact dog '+dogTxt[1]+'">'+esc(dogTxt[0])+'</span>');
    /* 109 个点的笔记里根本没提能不能带狗（2026-11-24）。
       以前卡片上一个字都不显示 —— 看着"默认没事"，其实是什么都不知道。
       按主人的口径它算能用，但"能用"和"确知"是两回事，得在卡上留个记号。 */
    else if(dk === "unknown") facts.push('<span class="fact" style="color:var(--ink-3)">犬政策没写</span>');
    if(inBeen(s.id)) facts.push('<span class="fact" style="color:var(--ink-3)">去过了</span>');
    if(nk !== "unknown") facts.push('<span class="fact">'+esc(NIGHT_LABEL[nk][0])+'</span>');
    /* 季节标签：现在是"适合/最佳"就点明，明确不建议的也点明（避免白跑一趟） */
    (function(){
      var t = seasonTier(s, seasonOf(new Date()));
      if(t === 3) facts.push('<span class="fact" style="color:var(--terra-2)">'+seasonOf(new Date())+'季最佳</span>');
      else if(t === 0) facts.push('<span class="fact" style="color:var(--rose)">'+seasonOf(new Date())+'季不建议</span>');
    })();
    (s.scenes||[]).slice(0,2).forEach(function(x){
      facts.push('<span class="fact">'+esc(x)+'</span>');
    });
    var ph = s.photos && s.photos.length ? s.photos : null;
    /* 列表缩略图挑"看得出这是哪儿"的那张：
       小红书首图常是带大字封面的拼图或自拍，做缩略图很糟；
       高德商户图通常是地点本身。都没有才退回小红书第 2 张（跳过封面）。 */
    var thumbSrc = pickThumb(s);
    /* 2026-11-20 修：＋号原来写在 card-thumb 里面，绝对定位就以缩略图为参照，
       所以 right:2px 只是"图片右边缘"，怎么调都压在图上。移到 card 这一层才真正靠整行右侧。 */
    var thumb = '<span class="card-thumb">' +
        '<span class="fb" style="background:'+col+'">'+svgFor(k)+'</span>' +
        (thumbSrc ? '<img src="'+esc(thumbSrc)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' +
              (ph.length>1 ? '<span class="cnt">'+ph.length+'</span>' : '') : '') +
      '</span>';
    /* 卡片从 <button> 改成 <div role=button>：链接不能嵌在 button 里，嵌了点了不跳。
       来源链接是主人明确要的：每张卡都要能点到原始出处。 */
    return '<div class="card'+(STATE.active===s.id?" active":"")+'" role="button" tabindex="0" data-id="'+esc(s.id)+'">' +
      thumb +
      '<span class="card-body">' +
        '<span class="card-name">'+esc(s.name)+'</span>' +
        '<span class="card-meta">' +
          (function(d){ return '<b class="drive">'+(d.est?'约 ':'单程 ')+hmCN(d.hours_oneway)+'</b>' +
          '<span>'+Math.round(d.km)+' km</span>'; })(driveInfo(s)) +
          '<span>'+esc(s.city||"")+'</span>' +
        '</span>' +
        '<span class="card-facts">' + facts.join("") + '</span>' +
        /* 2026-11-23 owner：排行程的入口原来只在详情页里，得先点开卡片才看得见。
           现在直接放在卡片上——看到"想去这儿"就能立刻以它为中心排一版。 */
        (spotCoord(s) ? '<button class="card-anchor" data-anchor="' + esc(s.id) + '"'
           + ' title="以这里为中心安排两天/三天">以这里为中心排行程</button>' : '') +
      '</span>' + tripBtnHTML(s.id) + '</div>';
  }).join("") + (TOTAL > pageList.length
      ? '<div class="more-note">先列了 ' + pageList.length + ' 个，还有 ' +
        (TOTAL - pageList.length) + ' 个。<br>' +
        '<button class="more-btn" data-more="1">再看 ' +
        Math.min(PAGE, TOTAL - pageList.length) + ' 个</button> ' +
        '<span class="more-hint">或者缩小一下地图范围</span></div>'
      : "");
}

/* ───────── 出发点 ───────── */
/* 库里 drive 字段的真实路网车程，只对「上海人民广场」算过。
   换出发地时用直线距离换算，系数是实测标定出来的：
   408 个点上 车程(小时)/直线(km) 中位 0.0169，四分位 0.0152~0.0207 ——
   即误差约 ±15%，所以换地方后界面一律写「约」。 */
var EST_H_PER_KM = 0.0169, EST_ROAD = 1.215;
var ORIGIN = null, ORIGIN_MARKER = null;
var ORIGIN_PRESETS = [
  ["上海人民广场", [121.473701, 31.230416], false],
  ["北京", [116.4074, 39.9042], true],
  ["成都", [104.0665, 30.5723], true],
  ["广州", [113.2644, 23.1291], true],
  ["深圳", [114.0579, 22.5431], true],
  ["杭州", [120.1551, 30.2741], true],
  ["南京", [118.7969, 32.0603], true],
  ["武汉", [114.3055, 30.5928], true],
  ["西安", [108.9398, 34.3416], true]
];
function havKm(a, b){
  var R = 6371, p1 = a[1]*Math.PI/180, p2 = b[1]*Math.PI/180;
  var dp = p2-p1, dl = (b[0]-a[0])*Math.PI/180;
  var h = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
}
function initOrigin(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem("pp-origin-v1") || "null"); }catch(e){}
  ORIGIN = (saved && saved.gcj && saved.gcj.length === 2)
    ? {name: saved.name, gcj: saved.gcj, custom: !!saved.custom}
    : {name: DATA.meta.origin.name, gcj: DATA.meta.origin.gcj.slice(), custom: false};
  paintOrigin();
}

/* ───────── 定位（2026-11-22） ─────────
   手机端最没用的东西就是"从上海出发"——人在路上，车程还是按上海算的。
   所以定位不是"把地图挪到我这儿"，而是**把出发点换成我当前站的位置**，
   这样单程时间、排序、3 小时取景全都跟着变对。
   两个坑必须在代码里解决，不能靠注释提醒：
   ① 浏览器给的是 WGS84，高德底图和库里所有点位是 GCJ-02，不转换会偏几百米；
   ② 换出发点后车程只能用直线估算（没有路网数据），必须让用户看得见这个"约"。 */
function wgs2gcj(lat, lng){
  var a = 6378245.0, ee = 0.00669342162296594323;
  function outOfChina(la, ln){ return ln < 72.004 || ln > 137.8347 || la < 0.8293 || la > 55.8271; }
  function tLat(x, y){
    var r = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI))*2.0/3.0;
    r += (20.0*Math.sin(y*Math.PI) + 40.0*Math.sin(y/3.0*Math.PI))*2.0/3.0;
    r += (160.0*Math.sin(y/12.0*Math.PI) + 320*Math.sin(y*Math.PI/30.0))*2.0/3.0;
    return r;
  }
  function tLng(x, y){
    var r = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI))*2.0/3.0;
    r += (20.0*Math.sin(x*Math.PI) + 40.0*Math.sin(x/3.0*Math.PI))*2.0/3.0;
    r += (150.0*Math.sin(x/12.0*Math.PI) + 300.0*Math.sin(x/30.0*Math.PI))*2.0/3.0;
    return r;
  }
  if(outOfChina(lat, lng)) return {lat: lat, lng: lng};
  var dLat = tLat(lng - 105.0, lat - 35.0), dLng = tLng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * Math.PI;
  var magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return {lat: lat + dLat, lng: lng + dLng};
}

function locateMe(opt){
  opt = opt || {};
  var quiet = !!opt.silent;
  var btn = el("locate");
  if(!navigator.geolocation){
    if(!quiet) toast("这个浏览器不支持定位，换个浏览器试试");
    return;
  }
  /* 非 https 下浏览器会直接拒绝，而且很多人说不清原因，所以先把话说在前面 */
  var secure = (location.protocol === "https:") ||
               /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if(!secure){
    if(!quiet) toast("定位要 https 才给用（现在是 " + location.protocol + "），线上站点可以");
    return;
  }
  if(btn){ btn.classList.add("busy"); btn.textContent = "定位中…"; }
  navigator.geolocation.getCurrentPosition(function(pos){
    if(btn){ btn.classList.remove("busy"); btn.textContent = "定位"; }
    var g = wgs2gcj(pos.coords.latitude, pos.coords.longitude);
    var acc = Math.round(pos.coords.accuracy || 0);
    setOrigin("我的位置", [g.lng, g.lat], true);
    closeOriginPanel();
    /* 换到新位置之后：刚从上海那套视野里跳出来时，3 小时圈还是"半个华东"，
       看不出"我就在这儿"。先框 1.5 小时圈；周边点少就直接站在我这儿看。 */
    /* 定位后**固定站在我这儿看**（zoom 9 ≈ 半径 60 公里）：
       用包围盒去拟合"我周围有点的地方"实测会把视野推到北边的安徽江苏去——
       那些点把框撑大了，我反而不在框中央。人在现场时，"我在这儿"比"框住所有点"重要。 */
    if(mapUsable()){
      MAP.setView([g.lat, g.lng], 9);
      STATE.autoFit = true;
    }else if(!STATE.autoFit){
      STATE.fitCenter = [g.lat, g.lng];   /* 地图还没露脸：等它出来再站过去 */
    }
    render();
    refreshOriginPanel();
    if(!quiet) toast("已换成当前位置出发" + (acc ? "（精度约 " + acc + " 米）" : "") + " · 车程按直线估算");
  }, function(err){
    if(btn){ btn.classList.remove("busy"); btn.textContent = "定位"; }
    var why = {
      1: "你拒绝了定位授权，可以在浏览器地址栏那把权限打开",
      2: "定位不可用：设备没有定位服务",
      3: "定位超时，信号弱时换个地方再试"
    }[err && err.code] || "定位失败，原因不明";
    /* 静默失败（开机那次）不弹提示：会变成每次打开都挨一句抱怨。
       点「定位」这种主动动作才把原因说清楚。 */
    if(!quiet) toast(why);
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}


/* 开机先去拿当前位置（owner 2026-11-22）：默认就该是"我现在在哪儿"，
   让用户先看见上海再自己去点定位，是多余的中间步骤。
   唯一例外：用户主动改回过上海基准，就尊重这个选择，不再每次打开都去打扰权限。 */
function autoLocate(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem("pp-origin-v1") || "null"); }catch(e){}
  if(saved && saved.name !== "我的位置") return;
  locateMe({silent:true});
}

function paintOrigin(){
  /* 头部一行放不下「从上海人民广场出发」，只留城市；全名在面板和地图气泡里 */
  var shortName = ORIGIN.name.replace("人民广场", "");
  el("origin-line").textContent = "从" + shortName + "出发" + (ORIGIN.custom ? " · 估算" : "");
}
/* 每个点的有效车程：默认上海用真实路网，其他出发地按直线换算 */
function driveInfo(s){
  if(!ORIGIN || !ORIGIN.custom || !s.gcj) return s.drive || null;
  var straight = havKm(ORIGIN.gcj, s.gcj);
  return {hours_oneway: straight * EST_H_PER_KM, km: straight * EST_ROAD, est: true};
}
function setOrigin(name, gcj, custom){
  ORIGIN = {name: name, gcj: gcj.slice(), custom: !!custom};
  try{ localStorage.setItem("pp-origin-v1", JSON.stringify(ORIGIN)); }catch(e){}
  paintOrigin();
  if(MAP) MAP.setView([gcj[1], gcj[0]], MAP.getZoom());
  if(ORIGIN_MARKER){
    ORIGIN_MARKER.setLatLng([gcj[1], gcj[0]]);
    /* 定位来的出发点画成实心蓝点：用户得能一眼确认"系统认为我在哪儿"，
       和原来那个空心米色点区分开，免得把上海那个点当成自己。 */
    var isMe = (name === "我的位置");
    ORIGIN_MARKER.setStyle(isMe
      ? {radius:8, color:"#ffffff", weight:3, fillColor:"#2F6FED", fillOpacity:1}
      : {radius:7, color:"#B85C38", weight:2.5, fillColor:"#F4F7F4", fillOpacity:1});
    ORIGIN_MARKER.setPopupContent('<div class="pop-t">'+(isMe ? "我在这儿" : "出发点")+'</div>'+
      '<div class="pop-row">'+esc(isMe ? "当前位置 · 车程按直线估算" : name)+'</div>');
  }
  closeOriginPanel();
  render();
  toast(custom ? "已换成" + name + "出发 · 车程按直线估算" : "已回到" + name + "出发 · 真实路网车程");
}
function openOriginPanel(){
  refreshOriginPanel();
  el("origin-panel").classList.add("open");
}
/* 面板只在初始化时建一次，选中态必须每次打开时重算——
   否则定位换过出发点之后，面板里"上海"还亮着，用户会以为自己还在用上海。 */
function refreshOriginPanel(){
  var grid = el("origin-grid"); if(!grid) return;
  var me = (ORIGIN.name === "我的位置");
  var h = grid.querySelector("#origin-here"), b = grid.querySelector("#origin-shanghai");
  if(h) h.setAttribute("aria-pressed", me ? "true" : "false");
  if(b) b.setAttribute("aria-pressed", me ? "false" : "true");
}
function closeOriginPanel(){ el("origin-panel").classList.remove("open"); }
function buildOriginPanel(){
  var box = document.createElement("div");
  box.className = "origin-panel"; box.id = "origin-panel";
  box.innerHTML = '<button class="origin-close" id="origin-close" aria-label="关闭">×</button>' +
    '<h4>从哪儿出发</h4>' +
    '<div class="origin-grid" id="origin-grid"></div>' +
    '<div class="origin-note">默认用你手机的位置当出发点，所有单程时间都从这儿算。' +
    '只有上海基准是按真实路网算的；其他位置按直线距离换算，实测误差约 ±15%，所以写「约」。</div>';
  document.body.appendChild(box);
  /* 不再列城市（owner 2026-11-22）：默认就用当前位置，选城市是多余的中间步骤。
     现在只剩两件事——重新定位，或改回上海基准（唯一有真实路网车程的出发点）。 */
  var grid = box.querySelector("#origin-grid");
  var here = document.createElement("button");
  here.id = "origin-here";
  here.className = "origin-here";
  here.textContent = "重新定位我的位置";
  here.onclick = function(){ locateMe(); };
  grid.appendChild(here);
  var back = document.createElement("button");
  back.id = "origin-shanghai";
  back.className = "origin-back";
  back.textContent = "改回上海基准（真实路网）";
  back.onclick = function(){
    setOrigin(DATA.meta.origin.name, DATA.meta.origin.gcj, false);
    closeOriginPanel();
    toast("已回到上海基准 · 车程用真实路网");
  };
  grid.appendChild(back);
  box.querySelector("#origin-close").onclick = closeOriginPanel;
  box.onclick = function(e){ if(e.target === box) closeOriginPanel(); };
}

/* ───────── 地图 ───────── */
function initMap(){
  MAP = L.map("map", {zoomControl:true, attributionControl:true, preferCanvas:false})
        .setView(ORIGIN.gcj.slice().reverse(), 7);
  var tileURL = "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}";
  var tiles = L.tileLayer(tileURL, {
    subdomains:["1","2","3","4"], maxZoom:18, minZoom:5,
    attribution:'底图 &copy; 高德地图 · 数据自建'
  }).addTo(MAP);
  /* 底图挂了要有话说。2026-11-10 用 CDP 拦掉 *.is.autonavi.com 实测：
     瓦片全失败、只剩 2 个气泡、背景是一片米色，而页面照样写着"616 个点"，
     一句提示都没有——用户会以为地图坏了或数据没了。
     点位数据本身没丢（在 data/图例里都还在），所以提示要讲清"只是底图没出来"。 */
  var tileWarned = false;
  tiles.on("tileerror", function(){
    if(tileWarned) return;
    tileWarned = true;
    var box = document.getElementById("map");
    if(!box) return;
    var d = document.createElement("div");
    d.className = "tile-warn";
    d.innerHTML = '<b>底图没加载出来</b>（网络或瓦片服务不通）。点位数据都在，'+
                  '点气泡仍能看详情；也可以先把上面筛选收窄再找。';
    box.appendChild(d);
  });

  ORIGIN_MARKER = L.circleMarker([ORIGIN.gcj[1], ORIGIN.gcj[0]], {
    radius:7, color:"#B85C38", weight:2.5, fillColor:"#F4F7F4", fillOpacity:1
  }).addTo(MAP).bindPopup('<div class="pop-t">出发点</div><div class="pop-row">'+esc(ORIGIN.name)+'</div>');

  /* 平移/缩放后重排左侧列表。防抖 180ms：拖动过程中每帧都算一遍会卡。 */
  MAP.on("moveend zoomend", function(){
    clearTimeout(STATE._nearT);
    STATE._nearT = setTimeout(renderNear, 180);
  });

  CLUSTER = L.markerClusterGroup({
    showCoverageOnHover:false, spiderfyOnMaxZoom:true, zoomToBoundsOnClick:true,
    maxClusterRadius:46, disableClusteringAtZoom:13, chunkedLoading:true,
    spiderfyDistanceMultiplier:1.5
  });
  MAP.addLayer(CLUSTER);
}

/* 一张地图上放所有点，靠**形状**分类型——光靠颜色在缩略图上分不出来。
   帐篷=能睡的营地，树=公园，水波=水域，房子=古村，山=景区，床=住宿。 */
var KIND_GLYPH = {
  campground:'<path d="M12 5 20.5 20H3.5z"/><path d="M9.2 20 12 13.2 14.8 20"/>',
  lodging:'<path d="M3 19v-8h18v8"/><path d="M3 11V6.5"/><path d="M7 11V8.5h5V11"/>',
  park:'<path d="M12 20v-5"/><path d="M12 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/>',
  water:'<path d="M3 9.5c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M3 15.5c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/>',
  village:'<path d="M4 11 12 5l8 6"/><path d="M6 11v9h12v-9"/>',
  scenic:'<path d="M3 19.5l6.5-9.5 4 6 2-3 6 6.5z"/><circle cx="18" cy="6" r="2.4"/>',
  transit:'<rect x="5" y="4" width="14" height="11" rx="2.5"/><path d="M5 15v3M19 15v3M5 9.5h14"/>',
  food:'<path d="M7 4v7M5 4v6.5a2 2 0 0 0 4 0V4"/><path d="M15 4c2 0 3 1.6 3 4.2s-1 4.2-3 4.2V20"/>',
  other:'<circle cx="12" cy="12" r="3.2"/>'
};
function glyphOf(kind){
  return KIND_GLYPH[kind] || KIND_GLYPH.other;
}
function svgFor(kind){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" '+
         'stroke-linecap="round" stroke-linejoin="round">'+glyphOf(kind)+'</svg>';
}
function pinIcon(s){
  var col = KIND_COLOR[s.kind]||"#9C8A76";
  /* 营地放大一圈：它是"今晚睡哪"的答案，不该和普通点一样大 */
  var lg = s.kind === "campground";
  var sz = lg ? 32 : 26;
  return L.divIcon({
    className:"", iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-sz/2],
    html:'<div class="pin'+(lg?' pin-lg':'')+'" style="background:'+col+'">'+svgFor(s.kind)+'</div>'
  });
}

/* 图例从同一套字形生成，保证"图上看到的"和"图例写的"永远一致 */
/* 横滑行：滑到头就把渐隐去掉，避免"右边被裁掉"的错觉 */
function scrollFade(row){
  if(!row) return;
  row.classList.add("scrollfade");
  function upd(){
    var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;
    row.classList.toggle("at-end", atEnd);
  }
  row.addEventListener("scroll", upd, {passive:true});
  window.addEventListener("resize", upd);
  upd();
}

/* 场景筛选条。规则：覆盖不足 20 个点的场景**不进筛选条**（只在卡片上显示），
   一个点不动就筛出 3 个结果的按钮，等于把"精细"做成了"难用"。
   「过夜」已经是一排的硬条件，这里不重复。 */
var SCENE_ORDER = ["草坪遛弯","玩水","溯溪","露营","古村古镇","山野徒步","人文古迹"];
var SCENE_MIN = 20;
function renderSceneBar(){
  var counts = {};
  (DATA.spots||[]).forEach(function(s){
    (s.scenes||[]).forEach(function(x){ counts[x] = (counts[x]||0) + 1; });
  });
  var html = SCENE_ORDER.filter(function(k){
    /* 「露营」（玩法）与上面派生的「能露营」是同一批点（实测都是 277），
       两个都摆出来等于把"住宿 54 vs 过夜 326"的重复换了个地方犯一遍。留「能露营」。 */
    return (counts[k]||0) >= SCENE_MIN && k !== "过夜" && k !== "露营";
  }).map(function(k){
    return '<button class="chip" data-scene="'+esc(k)+'" aria-pressed="false">'+
             esc(k)+' <b style="font-weight:600;opacity:.6">'+(counts[k]||0)+'</b></button>';
  }).join("");
  el("fpanel-scenes").innerHTML = html;

  /* 派生条件：能过夜 / 能露营。数量现算，不写死。
     「能过夜」用的是和卡片上"可过夜"完全同一个判定（isNight），
     所以不会出现"筛选 326、卡片上写不能过夜"这种两套标准。 */
  var nNight = DATA.spots.filter(isNight).length;
  var nCamp = DATA.spots.filter(canCamp).length;
  el("fpanel-derived").innerHTML =
    '<button class="chip" data-f="night" aria-pressed="false">能过夜 ' +
      '<b style="font-weight:600;opacity:.6">' + nNight + '</b></button>' +
    '<button class="chip" data-f="camp" aria-pressed="false">能露营 ' +
      '<b style="font-weight:600;opacity:.6">' + nCamp + '</b></button>';
}

/* 省份筛选条。与场景条不同，这里**不设 20 条门槛**：门槛的作用是避免"筛出 3 个结果"
   的按钮，但省份正是"让人看见新扩的地区"用的，江西只有 4 个点也必须能点到。
   排序按点位数由多到少，浙江/江苏/安徽/上海 在前，福建/山东/江西 在后。 */
function renderProvinceBar(){
  var counts = {};
  (DATA.spots||[]).forEach(function(s){
    var pv = s.province; if(!pv) return;
    counts[pv] = (counts[pv]||0) + 1;
  });
  var order = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
  /* 30 个省一次铺开要滚 600px，把玩法区挤到屏幕外（2026-11-21 实测）。
     默认只露前 10 个（已覆盖江浙沪皖闽赣鲁豫湘鄂），其余折起来；
     已经选中的省不管排第几都露出来，否则找不到自己勾了什么。 */
  var LIMIT = 10, expanded = !!STATE.provExpanded;
  var shown = expanded ? order : order.slice(0, LIMIT);
  if(!expanded){
    order.slice(LIMIT).forEach(function(k){
      if(STATE.provinces[k] && shown.indexOf(k) < 0) shown.push(k);
    });
  }
  var html = shown.map(function(k){
    return '<button class="chip" data-province="'+esc(k)+'" aria-pressed="false">'+
             esc(k)+' <b style="font-weight:600;opacity:.6">'+counts[k]+'</b></button>';
  }).join("");
  if(order.length > LIMIT){
    html += '<button class="chip chip-more" data-prov-more="1">'
          + (expanded ? "收起" : "更多省份（还差 " + (order.length - LIMIT) + " 个）") + '</button>';
  }
  el("fpanel-provinces").innerHTML = html;
}

function renderLegend(){
  var box = el("legend"); if(!box) return;
  /* 营地/住宿不再放在这一排（2026-11-22 owner 裁决）：
     它们是"类型"，而用户想的是"能不能露营/能不能过夜"，跟玩法组同一件事。
     两个入口给两个数量（住宿 54 vs 过夜 326），只会让人以为住宿点很少。
     现在它们以「能露营」「能过夜」出现在抽屉的玩法组里，这一排只留没有歧义的。 */
  box.innerHTML = Object.keys(KIND_LABEL).filter(function(k){
    return k !== "other" && k !== "food" && k !== "campground" && k !== "lodging" && k !== "transit";
  }).map(function(k){
    return '<span class="lg" data-kind="'+esc(k)+'" role="button" tabindex="0" aria-pressed="true">'+
           '<i style="background:'+(KIND_COLOR[k]||"#9C8A76")+'">'+svgFor(k)+'</i>'+
           esc(KIND_LABEL[k])+'</span>';
  }).join("");
  scrollFade(box);
}

function syncMarkers(list){
  CLUSTER.clearLayers();
  window.__dbg = {list: list.length, total: DATA.spots.length};
  var layers = list.map(function(s){
    var mk = L.marker([s.gcj[1], s.gcj[0]], {icon:pinIcon(s), riseOnHover:true});
    var nk=nightKey(s), dk=dogKey(s);
    var ph0 = (s.photos && s.photos[0])
      ? '<img src="'+esc(s.photos[0].url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" ' +
        'style="width:100%;height:92px;object-fit:cover;border-radius:8px;margin-bottom:7px;display:block">'
      : '';
    mk.bindPopup(
      ph0 +
      '<div class="pop-t">'+esc(s.name)+'</div>' +
      '<div class="pop-row">'+(function(d){return (d.est?'约 ':'单程 ')+hm(d.hours_oneway)+' · '+Math.round(d.km)+' km';})(driveInfo(s)||{hours_oneway:0,km:0})+' · '+esc(KIND_LABEL[s.kind]||"其他")+'</div>' +
      '<div class="pop-row">'+esc(NIGHT_LABEL[nk][0])+' · '+esc(DOG_LABEL[dk][0])+'</div>'
    );
    mk.on("click", function(){ openDetail(s.id); });
    return mk;
  });
  CLUSTER.addLayers(layers);
  drawTripLine();          /* 图层清空重加之后连线得补回来 */
  window.__dbg.layers = CLUSTER.getLayers().length;
  window.__dbg.km = MAP.getZoom();
  /* 筛选后要不要重新取景（2026-11-21 改）：
     原来无条件 fitAll(结果)，于是勾一个"玩水"（338 个点遍布全国）就把地图从长三角
     拽到云贵川——用户正在看的地方被自己的一次筛选弄丢了。
     现在的规则：**当前视野里还有结果就原地不动**；一个都没有才重取景。
     搜索例外：搜索就是"我要去那儿"，直接飞过去才对。 */
  /* 地图没露脸时一律不取景：容器 0×0 上 fitBounds 会算出一个横跨半个中国、
     zoom 11 落在宁夏的视野，然后列表就变成"地图范围内 0 个"。
     这种时刻该做的事是等 setView("map") 里的 scheduleAutoFit。 */
  if(list.length && !STATE.active && mapUsable()){
    var stillVisible = list.some(inView);
    if(!stillVisible || STATE.q) fitAll(list);
  }
}

/* 首屏视野：只看"周末开得到"的范围（单程 ≤3h）。点数太少才退回全部，
   免得在东部沿海以外的地方一打开就是空白地图。 */

/* 等地图容器尺寸稳定后再取景。轮询而不是猜一个延时：
   CSS 过渡的时长每个浏览器、每台机器都不一样，猜早了就是上面说的事故。 */
function scheduleAutoFit(){
  var tries = 0;
  function tick(){
    if(!MAP) return;
    tries++;
    MAP.invalidateSize();
    var sz = MAP.getSize();
    if(sz && sz.x > 200 && sz.y > 200){
      if(STATE.fitCenter){
        MAP.setView(STATE.fitCenter, 9);
        STATE.fitCenter = null;
      }else{
        fitNear(DATA.spots, STATE.fitHours || 3);
        STATE.fitHours = null;
      }
      STATE.autoFit = true;
      renderNear();
      return;
    }
    if(tries < 15) setTimeout(tick, 120);
  }
  tick();
}

function fitNear(list, maxHours){
  var hrs = (maxHours == null) ? 3 : maxHours;
  var near = list.filter(function(s){
    var dr = driveInfo(s);
    return dr && typeof dr.hours_oneway === "number" && dr.hours_oneway <= hrs;
  });
  /* 圈里点太少时**不要退回全库**：那等于又把视野拉成半个中国，
     和"看我现在开得到哪儿"正好相反。改成取最近的 40 个，视野跟着我走。 */
  var use = near;
  if(near.length < 20){
    use = list.slice().sort(function(a, b){
      var da = driveInfo(a), db = driveInfo(b);
      var ha = (da && da.hours_oneway != null) ? da.hours_oneway : 999;
      var hb = (db && db.hours_oneway != null) ? db.hours_oneway : 999;
      return ha - hb;
    }).slice(0, 40);
  }
  if(!MAP || !use.length) return;
  MAP.invalidateSize();
  var sz = MAP.getSize();
  if(!sz || sz.x < 40 || sz.y < 40) return;   /* 容器还是 0×0：算出来的一定是错的 */
  var pts = use.map(function(s){ return [s.gcj[1], s.gcj[0]]; })
               .filter(function(pt){ return pt[0] != null && pt[1] != null; });
  if(!pts.length) return;
  MAP.fitBounds(pts, {padding:[30,30], maxZoom:9});
}

function fitAll(list){
  if(!MAP || !list.length) return;
  MAP.invalidateSize();                       /* 容器尺寸刚定下来时 fitBounds 会算偏，先刷一次 */
  var szAll = MAP.getSize();
  if(!szAll || szAll.x < 40 || szAll.y < 40) return;   /* 容器还没尺寸：算了也是错的 */
  var pts = list.map(function(s){return [s.gcj[1], s.gcj[0]];});
  pts.push(DATA.meta.origin.gcj.slice().reverse());
  MAP.fitBounds(pts, {padding:[30,30], maxZoom:11});
}

/* ───────── 详情 ───────── */
function findSpot(id){ return DATA.spots.filter(function(s){return s.id===id;})[0]; }

/* ---------------- 来源按需加载 ---------------- */
var LAZY_SRC = { state: "idle", map: null };

function lazyPaintSources(id){
  var box = document.getElementById("d-src-v");
  if(!box || STATE.active !== id) return;          /* 已经换了点，别动别人的框 */
  var t = findSpot(id);
  if(!t) return;
  var arr = t.sources || (LAZY_SRC.map && LAZY_SRC.map[id] && LAZY_SRC.map[id].sources) || [];
  t.sources = arr;                                  /* 记下来，下次点开不再请求 */
  box.innerHTML = arr.map(function(x){
    var nm = x.platform === "xhs" ? ("小红书" + (x.why ? ' · ' + x.why : '')) : "高德地图";
    var tt = (x.title && x.platform !== "amap") ? '：' + esc(String(x.title).slice(0, 26)) : '';
    var who = x.author ? ' <span style="color:var(--ink-3)">@' + esc(x.author) + '</span>' : '';
    return '<div style="margin-top:4px"><a class="src-link" href="' + esc(x.url) +
           '" target="_blank" rel="noopener noreferrer">' + esc(nm) + '</a>' + tt + who + '</div>';
  }).join("");
}

function lazyFetchSources(id){
  if(LAZY_SRC.state === "ok"){ lazyPaintSources(id); return; }
  if(LAZY_SRC.state !== "idle") return;
  LAZY_SRC.state = "loading";
  fetch("spots-detail.json", {cache:"no-cache"}).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(m){
    LAZY_SRC.map = m || {};
    LAZY_SRC.state = "ok";
    lazyPaintSources(id);
  }).catch(function(){
    /* 失败不能是永久状态：山里断网点开一次，到有信号的地方再点开应该能重试。 */
    LAZY_SRC.state = "idle";
    var box = document.getElementById("d-src-v");
    if(box && STATE.active === id) box.textContent = "来源暂时没取到（换个地方再点开重试）";
  });
}

function openDetail(id){
  var s = findSpot(id); if(!s) return;
  STATE.active = id;
  var boxes = document.querySelectorAll(".card");
  for(var i=0;i<boxes.length;i++)
    boxes[i].classList.toggle("active", boxes[i].getAttribute("data-id")===id);

  el("d-title").textContent = s.name;
  el("d-loc").textContent = [s.province, s.city, KIND_LABEL[s.kind]||"其他"].filter(Boolean).join(" · ");

  var nk=nightKey(s), dk=dogKey(s), d=driveInfo(s)||{};
  var o = s.overnight||{}, dg = s.dog||{};

  var html = "";
  if(STATE.detailFromPlan){
    html += '<button class="d-back" id="d-back">'
         +  '<span aria-hidden="true">‹</span> 返回本周推荐</button>';
  }

  /* 加入行程放在最上面：先决定"去不去"，再看细节 */
  var inT = inTrip(s.id);
  html += '<div class="sec" style="margin-top:2px"><button class="tripbtn' + (inT ? " on" : "") +
          '" data-trip="' + esc(s.id) + '">' + (inT ? "✓ 已在行程 · 点击移除" : "＋ 加入行程") + '</button>' +
          (spotCoord(s) ? '<button class="anchorbtn" data-anchor="' + esc(s.id) + '">'
             + '以这里为中心排行程 ›</button>' : '') +
          '</div>' +
          '<div class="sec" style="margin-top:6px"><button class="beenbtn' +
          (inBeen(s.id) ? ' on' : '') + '" data-been="' + esc(s.id) + '">' +
          (inBeen(s.id) ? '✓ 去过了 · 不再推荐' : '标记为去过（之后不再推荐）') + '</button></div>';

  /* 照片：先看图，再看结论——"长啥样"比指标更直觉 */
  if(s.photos && s.photos.length){
    html += '<div class="sec" style="margin-top:4px"><div class="gallery">' +
      s.photos.map(function(p){
        var isXhs = p.src === "小红书";
        var line = isXhs
          ? '<b>@'+esc(p.author || "小红书作者")+'</b>' +
            (p.title ? ' · '+esc(p.title.slice(0, 16)) : '')
          : esc(p.poi_name || s.name);
        return '<figure>' +
               '<img src="'+esc(p.url)+'" alt="'+esc(s.name)+'" loading="lazy" ' +
               'referrerpolicy="no-referrer" onerror="__imgFail(this)">' +
               '<span class="src-tag'+(isXhs ? " xhs" : "")+'">' +
                 (isXhs ? "小红书实拍" : "实拍") + '</span>' +
               '<figcaption>'+line+'</figcaption></figure>';
      }).join("") + '</div></div>';
  } else {
    html += '<div class="sec" style="margin-top:4px"><div class="nophoto">' +
      '这个点还没有实拍图 —— 不是加载失败，是确实没找到。<br>' +
      '<span style="color:var(--ink-2)">去之前建议先搜一眼实拍，别只信名字。</span></div></div>';
  }

  /* 核心答案条：这地方能不能今晚睡 */
  /* 犬政策（2026-11-23 提到最前）：这是一款"带狗去哪儿"的应用，
    能不能带狗是决定去不去的第一个问题，却排在车程和季节后面，手机上要滑两屏才看到。
     现在放在照片之后的第一个位置——看完"长啥样"，立刻回答"我能不能带它进去"。 */
  html += '<div class="sec"><div class="sec-t">带狗政策</div><div class="panel">' +
    '<div class="kv"><div class="k">结论</div><div class="v">'+tag(DOG_LABEL[dk][0],DOG_LABEL[dk][1])+'</div></div>' +
    (function(){
      var b = DOG_BASIS[s.dog_tier] || null;
      if(!b) return "";
      return '<div class="kv"><div class="k">依据</div><div class="v">'+tag(b[0], b[1])+'</div></div>';
    })() +
    /* 没写 ≠ 不行（2026-11-24）：按主人定的口径，只有明确说不行才排除，
       所以这里要讲清"为什么它还在推荐里"，否则看着像漏标了。 */
    (dk === "unknown"
      ? '<div class="quote">笔记里没提能不能带狗。按"没明确禁就算友好"的口径，这里当作可以带；' +
        '真要去，进门问一句最稳。</div>'
      : '') +
    /* 空引文别渲染成空括号「」——有些点挂着 C 级来源却没有原话，
       数据里就写着「…：「」」，直接印出来等于给别人看一个空引号（2026-11-24）。 */
    (tidyEv(dg.evidence)
      ? '<div class="quote cite">'+esc(tidyEv(dg.evidence))+'</div>' : '') +
    (dg.risk_hint ? '<div class="quote warn">⚠ '+esc(dg.risk_hint)+'</div>' : '') +
    '</div></div>';

  html += '<div class="sec"><div class="panel" style="border-left:3px solid '+
    (isNight(s)?"var(--green)":"var(--rose)")+'">' +
    '<div class="kv"><div class="k">今晚睡哪</div><div class="v"><b>'+esc(NIGHT_LABEL[nk][0])+'</b>'+
    (o.modes&&o.modes.length?' · '+o.modes.map(function(m){return {tent:"帐篷",car:"车中泊",cabin:"住店"}[m]||m;}).join("/"):"")+
    '</div></div>' +
    (function(){
      var f0 = o.facilities||{};
      /* 卫生间单独拎出来问：到了地方发现没厕所，比没水更劝退 */
      var t = f0.toilet;
      var lbl = t===true ? '<b style="color:var(--green)">有</b>'
              : t===false ? '<b style="color:var(--rose)">没有</b>'
              : '<span style="color:var(--ink-3)">未核实</span>';
      return '<div class="kv" style="margin-top:8px"><div class="k">卫生间</div><div class="v">'+lbl+'</div></div>';
    })() +
    (o.note?'<div class="note-txt" style="margin-top:6px">'+esc(o.note)+'</div>':'') +
    /* 有结论但一条原话都没有时，必须说清楚这是人工判断而不是笔记依据，
       否则"可扎营"看起来和"有人拿原话证明过"一样可信 */
    ((nk!=="unknown" && !(o.evidence||[]).length)
      ? '<div class="note-txt" style="margin-top:6px;color:var(--amber-ink)">这条没有笔记原话，是人工判断，出发前建议先打电话确认。</div>' : '') +
    (function(){
      var ev = o.evidence||[];
      if(!ev.length) return "";
      /* 结论下面是原话：别人到底怎么说的，读的人自己判断。
         没有原话的结论等于二手转述，这个项目不这么干。 */
      return '<div style="margin-top:8px">' + ev.slice(0,3).map(function(e){
        return '<div class="quote cite" style="margin-top:6px">'+esc(e.quote||"")+
               '<span style="color:var(--ink-3)"> —— @'+esc(e.author||"小红书")+'</span></div>';
      }).join("") + '</div>';
    })() +
    '</div></div>';

  /* 车程 */
  html += '<div class="sec"><div class="sec-t">从出发点</div><div class="panel">' +
    '<div class="kv"><div class="k">单程</div><div class="v">'+hm(d.hours_oneway)+' · '+Math.round(d.km)+' km</div></div>' +
    '<div class="kv"><div class="k">来回</div><div class="v">约 '+hm(d.hours_oneway*2)+'</div></div>' +
    '<div class="kv"><div class="k">依据</div><div class="v" style="color:var(--ink-3);font-size:12px">'+esc(srcLabel(d.source))+'</div></div>' +
    '</div></div>';

  /* 季节：哪几个月值得去，依据是原文还是推断必须写清楚 */
  (function(){
    var se = s.season;
    if(!se) return;
    var rows = ["春","夏","秋","冬"].map(function(k){
      var t = (se.scores||{})[k];
      var lab = SEASON_LABEL[t] || "—";
      var color = t===3 ? "var(--terra-2)" : t===0 ? "var(--rose)" : "var(--ink-2)";
      return '<div class="kv"><div class="k">'+k+'</div><div class="v" style="color:'+color+'">'+lab+'</div></div>';
    }).join("");
    var srcTxt = se.src === "原文" ? "笔记原文" : (se.src === "推断" ? "类型推断（非事实）" : "没有依据");
    html += '<div class="sec"><div class="sec-t">什么季节去</div><div class="panel">' +
      rows +
      (se.evidence ? '<div class="quote cite">'+esc(se.evidence)+'</div>' : '') +
      (se.src === "原文" ? '<div class="kv"><div class="k">依据</div><div class="v" style="color:var(--ink-3);font-size:12px">'+esc(srcTxt)+'</div></div>' : '') +
      '</div></div>';
  })();

  /* 设施 */
  var f = o.facilities||{};
  var fmap = {toilet:"厕所",water:"水源",power:"电",signal:"信号"};
  var fparts = Object.keys(fmap).filter(function(k){return f[k]!=null;})
    .map(function(k){return fmap[k]+(f[k]?"✓":"✗");});
  if(fparts.length){
    html += '<div class="sec"><div class="sec-t">设施</div><div class="panel"><div class="note-txt">'+
      esc(fparts.join(" · "))+'</div></div></div>';
  }

  /* 子点位 */
  if(s.sub_pois && s.sub_pois.length>1){
    html += '<div class="sec"><div class="sec-t">这一片包含 '+s.sub_pois.length+' 个点</div><div class="panel">' +
      s.sub_pois.map(function(p){
        return '<div class="subpoi"><i></i><div>'+esc(p.name)+'</div></div>';
      }).join("") + '</div></div>';
  }

  /* 出处 */
  /* 出处只说「这条线索从哪来」。查看的人不关心底图/坐标是哪家，
     所以这里只显示渠道（小红书带狗笔记 / 抖音带狗行程），不出现地图厂商。 */
  var src = [];
  if(s.origin) src.push(s.origin);
  var tripNames = (s.trips || []).filter(function(t){
    return t.indexOf("高德POI") !== 0 && t.indexOf("小红书-") !== 0; });
  if(tripNames.length) src.push("出自：" + tripNames.join("、"));
  if(s.raw_note) src.push("说明：" + s.raw_note);
  if(src.length){
    html += '<div class="sec"><div class="sec-t">出处</div><div class="panel"><div class="note-txt" style="font-size:12.5px;color:var(--ink-2)">'+
      src.map(esc).join("<br>")+'</div></div></div>';
  }

  /* 来源：卡片上只放能点的链接，详情里把每条出处摊开——
     "凭哪句话得出这个结论"比"有九个赞"重要得多。 */
  /* 坐标可疑：先说清楚，别让人照着图钉开过去 */
  if(s.geo_suspect){
    html += '<div class="sec"><div class="kv"><div class="k">坐标</div>' +
            '<div class="v" style="color:#b0742a">位置待核（可能不准，别按它导航）</div></div></div>';
  }

  /* 来源按需加载（2026-11-24 夜）：主包不带 sources，点开详情才拉 spots-detail.json
     （首屏 512KB → 391KB gzip）。这里只放占位节点，取到后**只重画这个节点**，
     绝不重进 openDetail——上一版就是在这里递归重画，映射没命中就转圈把浏览器打死。 */
  var srcs = s.sources;
  if(srcs === undefined){
    html += '<div class="sec"><div class="kv"><div class="k">来源</div>' +
            '<div class="v" id="d-src-v">加载中…</div></div></div>';
  }
  if(srcs && srcs.length){
    html += '<div class="sec"><div class="kv"><div class="k">来源</div><div class="v">' +
      srcs.map(function(x){
        var name = x.platform === "xhs"
          ? ("小红书" + (x.why ? ' · ' + x.why : ''))
          : "高德地图";
        /* 高德那条的 title 本来就是"在高德地图查看位置"，再拼一次会重复 */
        var t = (x.title && x.platform !== "amap") ? '：' + esc(String(x.title).slice(0, 26)) : '';
        var who = x.author ? ' <span style="color:var(--ink-3)">@' + esc(x.author) + '</span>' : '';
        return '<div style="margin-top:4px"><a class="src-link" href="' + esc(x.url) +
               '" target="_blank" rel="noopener noreferrer">' + esc(name) + '</a>' + t + who + '</div>';
      }).join("") + '</div></div></div>';
  }

  /* 动作 */
  var nav = "https://uri.amap.com/marker?position=" + s.gcj[0] + "," + s.gcj[1] +
            "&name=" + encodeURIComponent(s.name) + "&src=pet-trip&coordinate=gaode&callnative=1";
  html += '<div class="actions">' +
    '<a class="btn" href="'+nav+'" target="_blank" rel="noopener">' +
      '<svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>导航</a>' +
    '<button class="btn ghost" id="d-fly">在地图上定位</button>' +
    '</div>' +
    '<div class="actions" style="margin-top:9px">' +
    '<button class="btn ghost" id="d-copy" style="min-height:40px;height:40px;font-size:13.5px;font-weight:500">复制链接</button>' +
    '<a class="btn ghost" href="trips.html" style="min-height:40px;height:40px;font-size:13.5px;font-weight:500">行程攻略</a>' +
    '</div>';

  el("d-body").innerHTML = html;
  if(s.sources === undefined) lazyFetchSources(s.id);   /* 只补这一块，不重进 openDetail */
  el("detail").classList.add("open");
  if(decodeURIComponent(location.hash.slice(1)) !== id)
    history.replaceState(null, "", "#" + encodeURIComponent(id));

  el("d-fly").addEventListener("click", function(){
    el("detail").classList.remove("open");
    MAP.flyTo([s.gcj[1], s.gcj[0]], 13, {duration:.6});
  });
  var cp = el("d-copy");
  if(cp) cp.addEventListener("click", function(){
    var url = location.origin + location.pathname + "#" + encodeURIComponent(s.id);
    var done = function(){ cp.textContent = "已复制"; setTimeout(function(){ cp.textContent = "复制链接"; }, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ window.prompt("复制这个链接：", url); });
    } else { window.prompt("复制这个链接：", url); }
  });
}

/* ───────── 事件 ───────── */
function bind(){
  el("range").addEventListener("input", function(e){
    var v = parseFloat(e.target.value);
    /* 拉到最右 = 不限（默认状态）；中间任一档才是真在按车程筛 */
    STATE.hours = (v >= parseFloat(el("range").max)) ? null : v;
    el("range-out").textContent = STATE.hours == null ? "不限" : STATE.hours.toFixed(1) + "h";
    PLAN.dirty = true;
    render();
  });
  /* 筛选条有两条（硬条件 + 玩法场景），监听必须挂在两条上。
     只挂第一条时，场景 chip 点了毫无反应——实测抓到的第三个"看起来做了其实没做"。 */
  function onChipClick(e){
    var ub = e.target.closest("[data-unbeen]");
    if(ub){
      e.preventDefault();
      toggleBeen(ub.getAttribute("data-unbeen"));
      renderBeenPanel();
      toast("已撤掉这条「去过」记录");
      return;
    }
    /* 已选摘要 chip：点一下取消那一条 */
    var sum = e.target.closest(".fsum");
    if(sum){
      if(sum.hasAttribute("data-clear-season")) STATE.season[sum.getAttribute("data-clear-season")] = false;
      if(sum.hasAttribute("data-clear-scene")) STATE.scenes[sum.getAttribute("data-clear-scene")] = false;
      if(sum.hasAttribute("data-clear-dog")) STATE.dogTier[sum.getAttribute("data-clear-dog")] = false;
      if(sum.hasAttribute("data-clear-province")) STATE.provinces[sum.getAttribute("data-clear-province")] = false;
      if(sum.hasAttribute("data-clear-kind")) STATE.kinds[sum.getAttribute("data-clear-kind")] = false;
      if(sum.hasAttribute("data-clear-night")) STATE.night = false;
      if(sum.hasAttribute("data-clear-camp")) STATE.camp = false;
      if(sum.hasAttribute("data-clear-all")){ clearAllFilters(); }
      PLAN.dirty = true; syncFilterUI(); render(); return;
    }
    var lc = e.target.closest("#locate");
    if(lc){ locateMe(); return; }
    var pm = e.target.closest("[data-prov-more]");
    if(pm){ STATE.provExpanded = !STATE.provExpanded; renderProvinceBar(); syncFilterUI(); return; }
    var tg = e.target.closest("#fpanel-toggle");
    if(tg){ togglePanel(); return; }
    var sd = e.target.closest("#search-toggle");
    if(sd){
      var open2 = el("searchbar").classList.toggle("open");
      sd.setAttribute("aria-pressed", open2 ? "true" : "false");
      if(open2){ var qi = el("q"); if(qi){ qi.focus(); } }
      else { el("q").value = ""; STATE.q = ""; PLAN.dirty = true; render(); }
      return;
    }
    /* 排序是单选，不能走下面那个"按一下翻转"的通用逻辑 */
    var sb = e.target.closest(".chip[data-sort]");
    if(sb){
      STATE.sortMode = sb.getAttribute("data-sort");
      PLAN.dirty = true;
      syncFilterUI(); render();
      return;
    }
    var b = e.target.closest(".chip"); if(!b) return;
    var on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", on ? "false" : "true");
    if(b.hasAttribute("data-scene")){
      STATE.scenes[b.getAttribute("data-scene")] = !on;
    } else if(b.hasAttribute("data-dog")){
      STATE.dogTier[b.getAttribute("data-dog")] = !on;
    } else if(b.hasAttribute("data-province")){
      STATE.provinces[b.getAttribute("data-province")] = !on;
    } else if(b.hasAttribute("data-season")){
      STATE.season[b.getAttribute("data-season")] = !on;
    } else {
      var f = b.getAttribute("data-f");
      if(f==="night") STATE.night = !on;
      else if(f==="camp") STATE.camp = !on;
      else STATE.kinds[f] = !on;
    }
    PLAN.dirty = true;
    syncFilterUI();
    render();
  }
  /* 抽屉开合只走这一个入口，保证遮罩、按钮状态、焦点三处不会各自跑偏 */
  function togglePanel(force){
    var fp = el("fpanel"), sc = el("fscrim"), tg = el("fpanel-toggle");
    var open = (force == null) ? !fp.classList.contains("open") : !!force;
    fp.classList.toggle("open", open);
    if(open) renderBeenPanel();          /* 每次打开都按最新的「去过」重画 */
    if(sc) sc.classList.toggle("open", open);
    if(tg){
      tg.setAttribute("aria-expanded", open ? "true" : "false");
      tg.setAttribute("aria-pressed", open ? "true" : "false");
    }
    return open;
  }
  window.__togglePanel = togglePanel;
  if(el("fscrim")) el("fscrim").addEventListener("click", function(){ togglePanel(false); });
  if(el("fpanel-done")) el("fpanel-done").addEventListener("click", function(){ togglePanel(false); });

  /* 搜索输入：即时过滤（数据在本地，1021 个点，直接同步过滤即可） */
  (function(){
    var qi = el("q"); if(!qi) return;
    qi.addEventListener("input", function(){
      STATE.q = qi.value.trim();
      PLAN.dirty = true;
      render();
    });
    var cl = el("q-clear");
    if(cl) cl.addEventListener("click", function(){
      qi.value = ""; STATE.q = ""; PLAN.dirty = true; render(); qi.focus();
    });
  })();

  /* 以某点为中心排行程 */
  el("detail").addEventListener("click", function(e){
    var ab = e.target.closest("[data-anchor]");
    if(ab){ openAnchor(ab.getAttribute("data-anchor")); }
  });
  if(el("atrip-close")) el("atrip-close").addEventListener("click", closeAnchor);
  el("atrip").addEventListener("click", function(e){
    if(e.target === el("atrip")) { closeAnchor(); return; }
    var d = e.target.closest("[data-days]");
    if(d){ ATRIP.days = parseInt(d.getAttribute("data-days"), 10) || 2; renderAnchor(); return; }
    var sd = e.target.closest("[data-aseason]");
    if(sd){ ATRIP.season = sd.getAttribute("data-aseason") || null; renderAnchor(); return; }
    var add = e.target.closest("[data-atrip-add]");
    if(add){
      var c = findSpot(ATRIP.centerId);
      var t = c ? buildAnchorTrip(c, ATRIP.days, ATTRIP_SEASON()) : null;
      if(t){
        t.dayList.forEach(function(dd){ dd.stops.forEach(function(x){ if(!inTrip(x.s.id)) toggleTrip(x.s.id); }); });
        add.textContent = "✓ 已加入行程";
        add.classList.add("on");
      }
    }
  });

  el("filters").addEventListener("click", onChipClick);
  el("fpanel").addEventListener("click", onChipClick);
  el("list").addEventListener("click", function(e){
    /* 「再看一批」：把后面 120 个接上去，不动当前卡片（不然滚动位置全丢） */
    var more = e.target.closest("[data-more]");
    if(more && LAST_LIST){
      e.preventDefault();
      var keep = window.scrollY;
      LIST_SHOWN = Math.min(LAST_LIST.length, LIST_SHOWN + 120);
      renderCards(LAST_LIST);
      window.scrollTo(0, keep);
      return;
    }
    /* 空状态里的一键清掉搜索 */
    var cq = e.target.closest("[data-clear-q]");
    if(cq){
      STATE.q = "";
      var qi0 = el("q"); if(qi0) qi0.value = "";
      PLAN.dirty = true; render(); toast("搜索已清掉"); return;
    }
    /* 空状态里的一键放宽车程 */
    var fx = e.target.closest("[data-fix-hours]");
    if(fx){
      STATE.hours = parseFloat(fx.getAttribute("data-fix-hours"));
      var rg = el("range"); if(rg) rg.value = String(STATE.hours);
      el("range-out").textContent = STATE.hours == null ? "不限" : STATE.hours.toFixed(1) + "h";
      PLAN.dirty = true; render(); return;
    }
    /* 三层分流：行程按钮 → 来源链接 → 卡片本体。
       顺序不能反，否则点"＋ 行程"会顺带弹详情。 */
    var ab = e.target.closest("[data-anchor]");
    if(ab){ e.preventDefault(); openAnchor(ab.getAttribute("data-anchor")); return; }
    var tb = e.target.closest("[data-trip]");
    if(tb){
      e.preventDefault();
      var id = tb.getAttribute("data-trip");
      toggleTrip(id);
      var now = inTrip(id);
      tb.classList.toggle("on", now);
      tb.textContent = now ? "✓" : "＋";
      tb.setAttribute("title", now ? "从行程移除" : "加入行程");
      tb.setAttribute("aria-label", now ? "从行程移除" : "加入行程");
      return;
    }
    if(e.target.closest("a")) return;        /* 点来源链接就跳链接，别顺手弹详情 */
    var c = e.target.closest(".card"); if(!c) return;
    STATE.detailFromPlan = false;
    openDetail(c.getAttribute("data-id"));
  });
  el("detail-close").addEventListener("click", function(){
    STATE.detailFromPlan = false;
    el("detail").classList.remove("open");
    history.replaceState(null, "", location.pathname + location.search);
  });
  el("detail").addEventListener("click", function(e){
    if(e.target === el("detail")){
      STATE.detailFromPlan = false;
      el("detail").classList.remove("open");
      history.replaceState(null, "", location.pathname + location.search);
    }
  });
  el("grab").addEventListener("click", function(){
    el("sheet").classList.toggle("expanded");
  });
  /* 画廊点图 → 大图 */
  el("d-body").addEventListener("click", function(e){
    if(e.target.closest && e.target.closest("#d-back")){
      STATE.detailFromPlan = false;
      el("detail").classList.remove("open");
      history.replaceState(null, "", location.pathname + location.search);
      openPlan();
      return;
    }
    var tb = e.target.closest("[data-trip]");
    if(tb){ e.preventDefault(); toggleTrip(tb.getAttribute("data-trip")); return; }
    var bb = e.target.closest("[data-been]");
    if(bb){
      e.preventDefault();
      var bid = bb.getAttribute("data-been");
      toggleBeen(bid);
      /* 就地换标签，不重开详情：重开会把用户刚滚到的位置甩回顶部 */
      var on = inBeen(bid);
      bb.classList.toggle("on", on);
      bb.textContent = on ? "✓ 去过了 · 不再推荐" : "标记为去过（之后不再推荐）";
      toast(on ? "记下了：去过的地方不再占用推荐位" : "已从「去过」里移除");
      return;
    }
    var img = e.target.closest(".gallery img");
    if(!img || img.classList.contains("broken") || !img.getAttribute("src")) return;
    el("lb-img").src = img.src;
    el("lightbox").classList.add("open");
  });
  el("lb-close").addEventListener("click", function(){
    el("lightbox").classList.remove("open");
  });
  el("lightbox").addEventListener("click", function(e){
    if(e.target === el("lightbox")) el("lightbox").classList.remove("open");
  });
  document.addEventListener("keydown", function(e){
    /* 卡片标着 role="button" tabindex="0"，那就必须能用键盘打开（2026-11-23）。
       以前 tab 到卡片上按回车/空格毫无反应——"看起来是按钮、其实是死按钮"，
       读屏用户会以为这页打不开任何点。 */
    if((e.key === "Enter" || e.key === " " || e.key === "Spacebar")){
      var t = e.target;
      if(t && t.classList && t.classList.contains("card")){
        e.preventDefault();
        var cid = t.getAttribute("data-id");
        if(cid) openDetail(cid);
        return;
      }
    }
    if(e.key === "Escape"){
      el("lightbox").classList.remove("open");
      el("detail").classList.remove("open");
      history.replaceState(null, "", location.pathname + location.search);
    }
  });
}

/* ───────── 行程 ───────── */
var TRIP_KEY = "pp-trip-v1";
function loadTrip(){
  try{
    var a = JSON.parse(localStorage.getItem(TRIP_KEY) || "[]");
    if(!Array.isArray(a)) return [];
    // 点位会随数据更新出现/消失，加载时把已经不存在的 id 滤掉
    return a.filter(function(id){ return !!findSpot(id); });
  }catch(e){ return []; }
}
function saveTrip(){ try{ localStorage.setItem(TRIP_KEY, JSON.stringify(STATE.trip)); }catch(e){} }

/* ───────── 去过了（2026-11-24） ─────────
   「每周带狗去哪玩」这个每周会重复发生的需求，最怕的就是**反复推同一个地方**——
   去过的地方不是不能再去，而是不该再占推荐位。所以这里只记"去过"，不记别的。 */
var BEEN_KEY = "pp-been-v1";
function saveBeen(){ try{ localStorage.setItem(BEEN_KEY, JSON.stringify(STATE.been)); }catch(e){} }
function loadBeen(){
  try{
    var a = JSON.parse(localStorage.getItem(BEEN_KEY) || "[]");
    if(a instanceof Array) STATE.been = a.filter(function(x){ return typeof x === "string"; });
  }catch(e){}
}
function inBeen(id){ return STATE.been.indexOf(id) >= 0; }
function toggleBeen(id){
  var i = STATE.been.indexOf(id);
  if(i >= 0) STATE.been.splice(i, 1); else STATE.been.unshift(id);
  saveBeen(); render(); PLAN.dirty = true;
  if(typeof renderBeenPanel === "function") renderBeenPanel();
}

/* 把「去过」列出来：既能看见自己标过哪些，也能一条条撤掉 */
function renderBeenPanel(){
var box = el("fpanel-been"); if(!box) return;
var list = (STATE.been || []).map(function(id){ return findSpot(id); }).filter(Boolean);
if(!list.length){

box.innerHTML = '<div class="fp-title">去过的 ' + list.length + ' 个<small class="fp-hint">点 × 可以撤掉</small></div>' +
