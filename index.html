/* 打开筛选面板时重画一次（面板是常驻 DOM，不重画就会显示旧数据） */

/* ───────── 筛选条件的记忆（2026-11-23）─────────
   主人的用法是"周末想找能露营+玩水的"，点完关掉，下次打开又得重新点一遍。
   筛选是**人的偏好**，不是一次性动作，所以存起来。
   不存的东西：搜索词（一次性的）、起点（另有 pp-origin-v1 管）、当前打开的详情。 */
var FILTER_KEY = "pp-filters-v1";
var FILTER_DIMS = ["night","dog","camp"];
var FILTER_MAPS  = ["kinds","scenes","season","dogTier","provinces"];

function filtersSignature(){
  var o = {h: STATE.hours, q: STATE.q, s: STATE.sortMode || "drive"};
  FILTER_DIMS.forEach(function(k){ o[k] = !!STATE[k]; });
  FILTER_MAPS.forEach(function(k){
    o[k] = Object.keys(STATE[k] || {}).filter(function(x){ return STATE[k][x]; }).sort();
  });
  return JSON.stringify(o);
}
var lastFilterSig = null;

function saveFilters(){
  var sig = filtersSignature();
  if(sig === lastFilterSig) return;        /* 地图平移也会触发 render，别每次都写盘 */
  lastFilterSig = sig;
  try{ localStorage.setItem(FILTER_KEY, sig); }catch(e){}
}

function loadFilters(){
  var raw = null;
  try{ raw = localStorage.getItem(FILTER_KEY); }catch(e){}
  if(!raw) return false;
  var o;
  try{ o = JSON.parse(raw); }catch(e){ return false; }
  if(!o || typeof o !== "object") return false;
  if(o.h != null) STATE.hours = o.h;
  if(o.s && SORT_LABEL[o.s]) STATE.sortMode = o.s;
  FILTER_DIMS.forEach(function(k){ if(o[k] != null) STATE[k] = !!o[k]; });
  FILTER_MAPS.forEach(function(k){
    if(!Array.isArray(o[k])) return;
    STATE[k] = STATE[k] || {};
    o[k].forEach(function(x){ STATE[k][x] = true; });
  });
  lastFilterSig = filtersSignature();      /* 记下来，避免第一次 render 又写一遍 */
  return true;
}

/* 把记住的条件同步到控件上（滑块位置和它的文字标签） */
function paintFilterControls(){
  var rg = el("range");
  if(rg) rg.value = STATE.hours == null ? "13" : String(STATE.hours);
  var ro = el("range-out");
  if(ro) ro.textContent = STATE.hours == null ? "不限" : Number(STATE.hours).toFixed(1) + "h";
}
function inTrip(id){ return STATE.trip.indexOf(id) >= 0; }
function toggleTrip(id){
  var i = STATE.trip.indexOf(id);
  if(i >= 0) STATE.trip.splice(i, 1); else STATE.trip.push(id);
  saveTrip(); renderTrip();
  if(STATE.active) openDetail(STATE.active);
}
function fallbackCopy(t){
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function tripText(){
  var lines = ["带狗出行 · " + STATE.trip.length + " 个点"];
  STATE.trip.forEach(function(id, i){
    var s = findSpot(id); if(!s) return;
    var f = (s.overnight || {}).facilities || {};
    var drv = driveInfo(s) || {};
    var bits = [(drv.est?"约 ":"单程 ") + hm(drv.hours_oneway)];
    bits.push(NIGHT_LABEL[nightKey(s)][0]);
    if(f.toilet === true) bits.push("有厕所");
    else if(f.toilet === false) bits.push("无厕所");
    if(dogKey(s) === "allowed") bits.push("可带狗");
    lines.push((i + 1) + ". " + s.name + "（" + bits.join(" · ") + "）");
  });
  return lines.join("\n");
}
/* 提示条：分享结果、分享链接载入都要给反馈，否则用户不知道点没点上 */
var __toastT;
/* ───────── 加到主屏幕 ───────── */
var INSTALL_KEY = "pp-install-hint-v1", INSTALL_EVT = null, INSTALL_OFF = false;

function installWanted(){
  if(INSTALL_OFF) return false;
  try{ if(localStorage.getItem(INSTALL_KEY) === "no") return false; }catch(e){}
  if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return false;
  if(navigator.standalone) return false;      /* iOS 已装 */
  return true;
}
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent||""); }
function dropInstallBar(){
  var b = el("install"); if(!b) return;
  document.documentElement.classList.remove("has-install-bar");
  b.classList.remove("on");
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 260);
}
function showInstallHint(){
  if(!installWanted() || el("install")) return;
  var canPrompt = !!INSTALL_EVT, manual = !canPrompt && isIOS();
  if(!canPrompt && !manual) return;     /* 既不能装也不是 iOS：别瞎指路 */
  if(el("fpanel").classList.contains("open")) return;   /* 别盖在筛选面板上 */
  var bar = document.createElement("div");
  bar.className = "install-bar"; bar.id = "install";
  bar.innerHTML = '<div class="ib-t"><b>装到主屏幕上</b>' +
    '<span>' + (manual
      ? '点下面的「分享」→「添加到主屏幕」。山里没信号时也能打开。'
      : '营地、山里常没信号。装到主屏，没网也能打开这份地图。') + '</span></div>' +
    (canPrompt ? '<button class="ib-go" id="install-go">装</button>' : '') +
    '<button class="ib-x" id="install-x" aria-label="不再提示">×</button>';
  document.body.appendChild(bar);
  /* 这条提示是 fixed 贴在底部的，会压住列表最下面那一行（比如空状态里的
     「清掉搜索」按钮）。给它让出位置：body 打个标记，列表补一段下边距（2026-11-24）。 */
  document.documentElement.classList.add("has-install-bar");
  requestAnimationFrame(function(){ bar.classList.add("on"); });
  el("install-x").addEventListener("click", function(){
    try{ localStorage.setItem(INSTALL_KEY, "no"); }catch(e){}
    dropInstallBar();
  });
  if(canPrompt) el("install-go").addEventListener("click", function(){
    if(!INSTALL_EVT) return;
    var ev = INSTALL_EVT;
    ev.prompt();
    if(ev.userChoice && ev.userChoice.then) ev.userChoice.then(function(){ INSTALL_EVT = null; dropInstallBar(); }) ;
    else { INSTALL_EVT = null; dropInstallBar(); }
  });
}
function scheduleInstallHint(){
  window.__ppInstallHint = showInstallHint;    /* 测试/调试用 */
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); INSTALL_EVT = e;
    setTimeout(showInstallHint, 8000);         /* 让人先看两屏内容，别一进来就弹 */
  });
  window.addEventListener("appinstalled", function(){
    INSTALL_OFF = true;
    try{ localStorage.setItem(INSTALL_KEY, "no"); }catch(e){}
    dropInstallBar();
  });
  if(isIOS()) setTimeout(showInstallHint, 12000);
}

function toast(msg, opt){
  opt = opt || {};
  var t = el("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = '<span>' + esc(msg) + '</span>';
  if(opt.label){
    var b = document.createElement("button");
    b.textContent = opt.label;
    b.addEventListener("click", function(){
      t.classList.remove("on");
      if(opt.onTap) opt.onTap();
    });
    t.appendChild(b);
  }
  t.classList.add("on");
  clearTimeout(__toastT);
  __toastT = setTimeout(function(){ t.classList.remove("on"); }, opt.stay || 3800);
}

/* 分享的是一条**能打开**的链接，不是一段文字：
   收的人点开就看到同一份行程，而不是自己照着念一遍去搜。 */
/* 点位 id 是「x-中文名」，直接塞进 query 会被百分号转义成 3 倍长
   （10 个点 677 字符，粘到聊天里很难看）。base64url 压到约四成。 */
function b64e(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64d(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while(s.length % 4) s += "=";
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function tripUrl(){
  var base = location.origin + location.pathname;
  return base + "?trip=" + b64e(STATE.trip.join("\n"));
}

function shareTrip(){
  if(!STATE.trip.length){ toast("行程还是空的，先挑几个点"); return; }
  var text = tripText();
  var url = tripUrl();
  var fallback = function(){
    var all = text + "\n" + url;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(all).then(
        function(){ toast("行程链接已复制，粘贴给朋友就行"); },
        function(){ fallbackCopy(all); toast("行程链接已复制"); });
    } else { fallbackCopy(all); toast("行程链接已复制"); }
  };
  if(navigator.share){
    navigator.share({ title: "带狗出行 · " + STATE.trip.length + " 个点", text: text, url: url })
      .catch(function(err){ if(err && err.name === "AbortError") return; fallback(); });
  } else { fallback(); }
}

/* 打开别人分享的链接：不静默覆盖你自己已有的行程 */
function loadSharedTrip(){
  var m = /[?&]trip=([^&]+)/.exec(location.search);
  if(!m) return;
  /* 新格式是 base64url；老格式（逗号分隔、百分号转义）也认，
     免得之前发出去的链接点开是空的。 */
  var raw = m[1], ids = [];
  var tryAdd = function(id){
    if(id && findSpot(id) && ids.indexOf(id) < 0) ids.push(id);
  };
  try {
    b64d(raw).split("\n").forEach(tryAdd);
  } catch(e) { /* 不是 base64，按老格式解析 */ }
  if(!ids.length){
    decodeURIComponent(raw).split(",").forEach(tryAdd);
  }
  if(!ids.length){ toast("这条分享链接里的点位已经不在了"); return; }
  ids = ids.slice(0, 40);          /* 手改链接塞几百个也不至于卡死 */
  var prev = STATE.trip.slice();
  STATE.trip = ids;
  saveTrip(); renderTrip();
  if(prev.length && prev.join(",") !== ids.join(",")){
    toast("已载入分享的行程 · " + ids.length + " 个点", {
      label: "恢复我的", stay: 7000,
      onTap: function(){ STATE.trip = prev; saveTrip(); renderTrip(); renderTripPanel(); toast("已恢复你原来的行程"); }
    });
  } else {
    toast("已载入分享的行程 · " + ids.length + " 个点");
  }
}

function renderTripPanel(){
  var box = el("trip-list"), sub = el("trip-sub");
  if(!STATE.trip.length){
    sub.textContent = "";
    box.innerHTML = '<div style="padding:26px 0;text-align:center;color:var(--ink-3);font-size:13px">还没选地方。<br>点开任意一个点，按「＋ 加入行程」。</div>';
    return;
  }
  /* 只报"最远单程"：把每个点的单程加起来不是真实路线，
     报一个假的总时长不如不报。 */
  var maxH = 0;
  box.innerHTML = STATE.trip.map(function(id, i){
    var sp = findSpot(id); if(!sp) return "";
    var d = driveInfo(sp) || {}, f = (sp.overnight || {}).facilities || {};
    if(d.hours_oneway > maxH) maxH = d.hours_oneway;
    /* 点名字能看详情（2026-11-24）：以前收了 5 个点，想在行程里核对某一站
       还是得关掉面板、回列表里翻出来点开——面板里明明已经有这个名字了。 */
    return '<div class="trip-item"><div class="ti-n" data-tdetail="' + esc(id) + '" role="button" tabindex="0">' +
      '<div class="ti-t">' + (i + 1) + '. ' + esc(sp.name) + '<span class="ti-go">详情 ›</span></div>' +
      '<div class="ti-m">单程 ' + hm(d.hours_oneway) + ' · ' + Math.round(d.km) + ' km · ' +
      esc(NIGHT_LABEL[nightKey(sp)][0]) +
      (f.toilet === true ? ' · 有厕所' : (f.toilet === false ? ' · 无厕所' : '')) +
      '</div></div>' +
      /* 「点之间怎么串由你定」说了很久，可面板里只有一键重排，手动根本调不了顺序（2026-11-24）。 */
      '<div class="ti-ops">' +
        (i > 0 ? '<button class="ti-mv" data-tmove="up" data-ti="' + i + '" aria-label="上移">↑</button>' : '') +
        (i < STATE.trip.length - 1 ? '<button class="ti-mv" data-tmove="down" data-ti="' + i + '" aria-label="下移">↓</button>' : '') +
        '<button class="ti-x" data-rm="' + esc(id) + '" aria-label="移除">×</button>' +
      '</div></div>';
  }).join("");
  sub.textContent = "最远单程 " + hm(maxH) + " · 点之间怎么串由你定";

  /* 过夜提醒（2026-11-24）：出发窗口是"周五 18:00 走、周日晚回"，那是**睡两晚**的行程。
     可行程面板只一条条写"过夜未核实"，从不总结——收满 5 个点看着挺完整，
     到了山里才发现没有一个是确认能睡的。这里在最上面直接说清楚。 */
  var nSleep = STATE.trip.filter(function(id){ var sp = findSpot(id); return sp && isNight(sp); }).length;
  if(STATE.trip.length && nSleep === 0){
    box.insertAdjacentHTML("afterbegin",
      '<div class="trip-warn">这趟 <b>没有确认能过夜的点</b>：周五、周六两晚睡哪儿要先定下来。' +
      '<br>点位上写着"过夜未核实"的，多半是公园/野地，能不能扎营得打电话问。</div>');
  } else if(STATE.trip.length && nSleep === 1 && STATE.trip.length > 1){
    box.insertAdjacentHTML("afterbegin",
      '<div class="trip-warn soft">只有 <b>1 个</b>能过夜的点，两晚住同一处也行，但别指望换个地方睡。</div>');
  }

  /* 顺序这件事以前只写了"由你定"，但不给任何帮助——收了 5 个点之后，
     人其实最想知道"怎么串才不来回跑"（2026-11-23）。 */
  if(STATE.trip.length >= 2){
    var st = tripOrderStats(STATE.trip);
    box.innerHTML += '<div class="trip-order">' +
      '<div class="to-line">按现在的顺序：直线共 <b>' + Math.round(st.km) + ' km</b>' +
      '（去 <b>' + Math.round(st.outKm) + '</b>' + ' ／ 回 <b>' + Math.round(st.backKm) + '</b>）' +
      ' · 约 <b>' + hm(st.hours) + '</b> 车程<span class="to-note">（直线估算，不是路网）</span></div>' +
      '<button class="more-btn" data-trip-opt="1">按最省路排一下</button>' +
      '</div>';
  }
}

/* 一串点的直线里程：出发地 → 1 → 2 → … → 最后 → 回出发地。
   车速用库里标定过的 1km ≈ 0.0169h（直线/车程的中位比），只当估算。 */
var STRAIGHT_H_PER_KM = 0.0169;
function tripOrderStats(ids){
  var from = ORIGIN && ORIGIN.gcj ? ORIGIN.gcj : null;
  var pts = ids.map(function(id){ var sp = findSpot(id); return sp ? spotCoord(sp) : null; })
               .filter(function(c){ return c; });
  if(!from || pts.length < 2) return {km:0, outKm:0, backKm:0, hours:0};
  var outKm = 0, prev = from;
  pts.forEach(function(c){ outKm += havKm(prev, c); prev = c; });
  /* 回程：最后一站直接回出发地。前面算的是"一路往前"，所以回程单独算。 */
  var backKm = havKm(prev, from);
  var km = outKm + backKm;
  return {km: km, outKm: outKm, backKm: backKm, hours: km * STRAIGHT_H_PER_KM};
}

/* 最近邻 + 2-opt：点位数不超过 40，够用且必然收敛。
   出发点固定不动，返回排好的 id 列表。 */
function optimizeTripOrder(ids){
  var from = ORIGIN && ORIGIN.gcj ? ORIGIN.gcj : null;
  var items = ids.map(function(id){ var sp = findSpot(id); return {id:id, c: sp ? spotCoord(sp) : null}; });
  var withC = items.filter(function(x){ return x.c; });
  var noC = items.filter(function(x){ return !x.c; }).map(function(x){ return x.id; });
  if(!from || withC.length < 3) return ids.slice();
  var left = withC.slice(), order = [], cur = from;
  while(left.length){
    var best = 0, bestD = Infinity;
    for(var i=0;i<left.length;i++){
      var d = havKm(cur, left[i].c);
      if(d < bestD){ bestD = d; best = i; }
    }
    order.push(left[best]); cur = left[best].c; left.splice(best,1);
  }
  var cost = function(seq){
    var t = 0, prev = from;
    seq.forEach(function(x){ t += havKm(prev, x.c); prev = x.c; });
    return t + havKm(prev, from);
  };
  var improved = true, guard = 0;
  while(improved && guard++ < 60){
    improved = false;
    for(var i=0;i<order.length-1;i++){
      for(var j=i+1;j<order.length;j++){
        var trial = order.slice(0,i).concat(order.slice(i,j+1).reverse(), order.slice(j+1));
        if(cost(trial) < cost(order) - 1e-9){ order = trial; improved = true; }
      }
    }
  }
  return order.map(function(x){ return x.id; }).concat(noC);
}
function renderTrip(){
  var bar = el("tripbar");
  if(!STATE.trip.length){ bar.classList.remove("on"); }
  else { bar.classList.add("on"); el("trip-count").textContent = STATE.trip.length; }
  if(el("trip-panel").classList.contains("open")) renderTripPanel();
  drawTripLine();
}

/* 把行程按顺序在地图上连起来（2026-11-24）。
   为什么是虚线：连线走的是**站与站的直线**，我没有逐段跑过路网车程，
   画成实线会让人以为是真实路线。虚线 + 面板里那句"直线共 N km（不是车程）"是一套说法。
   为什么要连：只看一堆编号看不出来这趟是"一路往西"还是"来回折返"，连起来一眼就明白。 */
var TRIP_LINE = null;
function drawTripLine(){
  window.__dbg = window.__dbg || {};
  if(typeof MAP === "undefined" || !MAP){ window.__dbg.tripLinePts = 0; return; }
  if(TRIP_LINE){ try{ MAP.removeLayer(TRIP_LINE); }catch(e){} TRIP_LINE = null; }
  var pts = [];
  STATE.trip.forEach(function(id){
    var s = findSpot(id);
    if(s && s.gcj) pts.push([s.gcj[1], s.gcj[0]]);
  });
  window.__dbg.tripLinePts = pts.length;
  if(pts.length < 2) return;
  TRIP_LINE = L.polyline(pts, {
    color: "#1f6f43", weight: 3, opacity: .8, dashArray: "7 7", interactive: false
  }).addTo(MAP);
}
function bindLegend(){
  var box = el("legend"); if(!box) return;
  box.addEventListener("click", function(e){
    var b = e.target.closest("[data-kind]"); if(!b) return;
    var k = b.getAttribute("data-kind");
    STATE.kinds[k] = !STATE.kinds[k];
    PLAN.dirty = true;
    syncFilterUI();
    render();
  });
}

/* 打开行程时把地图挪到这趟的范围内（2026-11-24）：
   否则连线多半在视野外——点了"查看"却只看见一堆别的点，等于没看见自己排的路。 */
function fitTrip(){
  if(!mapUsable() || STATE.trip.length < 2) return;
  var pts = [];
  STATE.trip.forEach(function(id){
    var sp = findSpot(id);
    if(sp && sp.gcj) pts.push([sp.gcj[1], sp.gcj[0]]);
  });
  if(pts.length < 2) return;
  var b = L.latLngBounds(pts);
  if(b.getNorthEast().equals(b.getSouthWest())) MAP.setView(pts[0], 11);
  else MAP.fitBounds(b, {padding: [40, 40], maxZoom: 12});
}

function bindTrip(){
  el("trip-open").addEventListener("click", function(){
    renderTripPanel(); el("trip-panel").classList.add("open");
    fitTrip();
  });
  el("trip-close").addEventListener("click", function(){ el("trip-panel").classList.remove("open"); });
  el("trip-panel").addEventListener("click", function(e){
    if(e.target === el("trip-panel")) el("trip-panel").classList.remove("open");
  });
  el("trip-list").addEventListener("click", function(e){
    var opt = e.target.closest("[data-trip-opt]");
    if(opt){
      var before = tripOrderStats(STATE.trip).km;
      var next = optimizeTripOrder(STATE.trip);
      var after = tripOrderStats(next).km;
      STATE.trip = next; saveTrip(); renderTrip(); renderTripPanel();
      if(before - after < 0.5) toast("现在这个顺序已经挺顺了（少跑不到 0.5 km）");
      else toast("已按最省路排好：直线少跑 " + Math.round(before - after) + " km");
      return;
    }
    var td = e.target.closest("[data-tdetail]");
    if(td){
      var tid = td.getAttribute("data-tdetail");
      el("trip-panel").classList.remove("open");
      openDetail(tid);
      return;
    }
    var mv = e.target.closest("[data-tmove]");
    if(mv){
      var from = parseInt(mv.getAttribute("data-ti"), 10);
      var to = mv.getAttribute("data-tmove") === "up" ? from - 1 : from + 1;
      if(from >= 0 && to >= 0 && to < STATE.trip.length){
        var tmp = STATE.trip[from]; STATE.trip[from] = STATE.trip[to]; STATE.trip[to] = tmp;
        saveTrip(); renderTrip(); renderTripPanel();
      }
      return;
    }
    var b = e.target.closest("[data-rm]"); if(!b) return;
    toggleTrip(b.getAttribute("data-rm"));
  });
  el("trip-clear").addEventListener("click", function(){
    STATE.trip = []; saveTrip(); renderTrip(); renderTripPanel();
  });
  el("trip-share").addEventListener("click", shareTrip);
  el("trip-share-panel").addEventListener("click", shareTrip);
}

/* ═════════════════ 本周推荐 ═════════════════
   出行窗口是固定的：**周五晚上出发、周日晚上回**，其他时间没空。
   所以这里不是"在 7 天里挑最好的天"，而是"这个周末去哪最合适"。

   三个输入都是真数据：
   1) 车程 / 犬政策 / 过夜 / 卫生间 —— 取 spots.json 里已核对的字段，有原话的连原话一起给。
   2) 站与站之间的距离 —— **只算直线**，我没有逐段跑过路网车程，写成"直线距离"不冒充车程。
   3) 天气 —— Open-Meteo 7 天预报，周五夜 / 周六 / 周日三天分别打分，原始数字照抄。
      取不到就说取不到。
   4) 排序 —— 周五夜先到能睡的点；周六在附近玩；周日玩完，**最后一站选离上海最近的**，
      免得玩完还要横穿半个省再回家。规则写在面板上。
*/
var WMO = {0:"晴",1:"晴间多云",2:"多云",3:"阴",45:"雾",48:"雾凇",51:"毛毛雨",53:"小雨",
  55:"中雨",56:"冻雨",57:"冻雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",
  71:"小雪",73:"中雪",75:"大雪",77:"米雪",80:"阵雨",81:"阵雨",82:"强阵雨",
  85:"阵雪",86:"强阵雪",95:"雷阵雨",96:"雷阵雨伴冰雹",99:"雷暴"};

var SEASON_WORDS = {
  "春":["樱花","油菜花","桃花","踏青","挖野菜","春笋","野餐"],
  "夏":["玩水","溯溪","游泳","避暑","荷花","桨板","皮划艇","淌水","下水"],
  "秋":["银杏","红叶","秋色","桂花","芦苇","粉黛","落叶","秋日"],
  "冬":["温泉","雪景","雾凇","围炉"]
};

/* ─── 季节档位（2026-11-21 owner：季节必须是推荐的第一优先级）───
   数据来自 script/build-season.py：每个点位带 season.scores（春/夏/秋/冬 各 0~3）。
   3=最佳 2=适合 1=可去 0=这个季节不建议去。
   拿不到 season 字段的老数据一律按 2（中性）处理——"不知道"不能当"不好"。 */
var SEASON_LABEL = {3:"最佳", 2:"适合", 1:"将就", 0:"不建议"};
function seasonTier(s, season){
  var sc = s.season && s.season.scores;
  if(!sc || sc[season] == null) return 2;
  return sc[season];
}
/* 一句话说明依据，避免把"推断"当成事实 */
function seasonNote(s, season){
  var se = s.season;
  if(!se) return "";
  var t = seasonTier(s, season);
  var head = season + "季" + (SEASON_LABEL[t] || "适合");
  return se.src === "原文" ? head + "（" + se.evidence + "）" : head + "（" + se.evidence + "）";
}

/* ─── 一个地方值不值得去：看有多少人在发它 ───
   数据里没有"美不美"这个量，也不该由我编一个。能用的现成信号是热度和天气：
   1) pop   —— 按点名搜小红书，标题确实提到这个点的笔记数 + 累计赞。
               发的人越多、看的人越多，说明这地方越值得去。搜索样本是 20~39 张卡片，
               所以这个数是**下限**，不是全部。
   2) 天气  —— Open-Meteo 实时预报。
   两个信号都只用来排序，不摆在卡片上。 */
function popOf(s){
  var h = s.pop;
  if(!h || typeof h.notes !== "number") return null;
  return h;
}
/* 一个片区的热度取它**最热的那一站**的笔记数。
   不把几站加起来：同一批笔记可能同时提到相邻几个点，加起来就重复计数了。 */
function clusterPop(c){
  var got = c.spots.filter(function(s){ return popOf(s) != null; });
  if(!got.length) return null;
  got.sort(function(a,b){
    var pa = popOf(a), pb = popOf(b);
    if(pb.notes !== pa.notes) return pb.notes - pa.notes;
    return pb.likes - pa.likes;
  });
  return popOf(got[0]);
}

var DEPART_HOUR = 18;

var PLAN = { weekOffset:0, state:"idle", plans:[], err:"", fetchedAt:"", pool:0, window:null, at:0 };
/* 天气是实时数据，不能抓一次用到天荒地老。
   超过这个时长就重抓：预报本身也是每小时更新的。 */
var PLAN_TTL_MS = 5*60*1000;
var PLAN_TIMER = null;

function seasonOf(d){
  var m = d.getMonth()+1;
  return m>=3&&m<=5 ? "春" : m>=6&&m<=8 ? "夏" : m>=9&&m<=11 ? "秋" : "冬";
}

function isoDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* 周末：周五 / 周六 / 周日。offset=0 是这周末，1 下周末，2 再下周末 */
function thisWeekend(offset){
  var now = new Date();
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var add = (5 - d.getDay() + 7) % 7 + (offset||0)*7;
  var fri = new Date(d.getTime() + add*86400000);
  var sat = new Date(fri.getTime() + 86400000);
  var sun = new Date(sat.getTime() + 86400000);
  return { fri:isoDate(fri), sat:isoDate(sat), sun:isoDate(sun) };
}

function haversineKm(a,b){
  var R=6371, toR=Math.PI/180;
  var dLat=(b[1]-a[1])*toR, dLng=(b[0]-a[0])*toR;
  var la1=a[1]*toR, la2=b[1]*toR;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

function spotCoord(s){ var g=s.gcj; return (g&&g.length===2)?g:null; }
function spotH(s){ var d=driveInfo(s)||{}; return typeof d.hours_oneway==="number"?d.hours_oneway:null; }
function sleepKind(s){
  var k = nightKey(s);
  return (k==="allowed_wild"||k==="official_camp"||k==="lodging") ? k : null;
}

function firstQuote(txt){
  var m = String(txt||"").match(/「([^」]{8,70})」/);
  return m ? m[1] : "";
}

function scoreSpot(s, season){
  var sc = 0, why = [];
  var dog = s.dog||{}, on = s.overnight||{}, fac = on.facilities||{};
  if(spotH(s)==null) return null;

  if(dog.policy==="allowed"){ sc+=3; why.push({t:"笔记写明可带狗", s:"犬政策"}); }
  if(dog.policy==="forbidden"){ sc-=20; }

  var ev = on.evidence||[];
  if(ev.length){ sc+=3; why.push({t:"过夜有笔记原话", s:"过夜"}); }
  if(fac.toilet===true){ sc+=1; why.push({t:"写明有卫生间", s:"设施"}); }
  if((s.photos||[]).length){ sc+=1; why.push({t:"有实拍图 "+s.photos.length+" 张", s:"图"}); }

  /* 季节档位：3 加分、1 减分、0 重减 —— 让同一次推荐里优先挑当季的站 */
  var tier = seasonTier(s, season);
  if(tier === 3){ sc += 3; why.push({t:season+"季最佳", s:"季节"}); }
  else if(tier === 1){ sc -= 2; }
  else if(tier === 0){ sc -= 8; }

  var text = String(dog.evidence||"") + " " +
             ev.map(function(e){ return String(e&&e.quote||""); }).join(" ");
  var hit = (SEASON_WORDS[season]||[]).filter(function(w){ return text.indexOf(w)>=0; })[0];
  if(hit){ sc+=2; why.push({t:"原话提到「"+hit+"」，"+season+"季正合适", s:"笔记"}); }

  sc -= Math.max(0, spotH(s)-1.5) * 0.7;
  return { score:sc, why:why };
}

function clusterSpots(list, km){
  var cs = [];
  list.forEach(function(s){
    var c = spotCoord(s); if(!c) return;
    for(var i=0;i<cs.length;i++){
      if(haversineKm(cs[i].centroid, c) <= km){
        var g = cs[i]; g.spots.push(s);
        g.sum[0]+=c[0]; g.sum[1]+=c[1];
        g.centroid=[g.sum[0]/g.spots.length, g.sum[1]/g.spots.length];
        return;
      }
    }
    cs.push({ centroid:[c[0],c[1]], sum:[c[0],c[1]], spots:[s] });
  });
  return cs;
}

/* 只写城市会撞名：两条路线都叫"上海一带"，看不出区别。
   所以用"城市 · 代表点位"——代表点位取这条线里分值最高的那一站。 */
function clusterName(stops){
  var cnt={}, best="", n=0;
  stops.forEach(function(s){
    var k=s.city||s.province||"";
    if(!k) return; cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]>n){ n=cnt[k]; best=k; }
  });
  /* 代表点位：优先"能玩且有评分的"，酒店/营地不当门面；
     名字和分数必须来自同一个点，否则会出现卡片叫 A、分数是 B 的。 */
  var plays = stops.filter(function(x){ return !sleepKind(x) && x.kind!=="lodging" && popOf(x)!=null; });
  var pool = plays.length ? plays : stops.filter(function(x){ return popOf(x)!=null; });
  var top = (pool.length ? pool : stops).slice().sort(function(a,b){
    var pa = popOf(a), pb = popOf(b);
    if(!pb) return -1; if(!pa) return 1;
    return (pb.notes - pa.notes) || (pb.likes - pa.likes);
  })[0];
  var base = best ? best.replace(/市$/,"") : "未命名";
  if(!top) return base + "一带";
  /* "上海 · 上海东滩湿地公园" 这种重复前缀要去掉 */
  var nm = top.name;
  if(base && nm.indexOf(base)===0) nm = nm.slice(base.length);
  return base + " · " + nm.slice(0,10);
}

/* 从起点出发，每次走直线最近的一站 */
function nearestChain(start, pool, max){
  var out=[], cur=start, left=pool.slice();
  while(left.length && out.length<max){
    var cc = spotCoord(cur), bi=0, bd=1e9;
    for(var i=0;i<left.length;i++){
      var pc = spotCoord(left[i]);
      if(!pc || !cc) continue;
      var d = haversineKm(cc, pc);
      if(d<bd){ bd=d; bi=i; }
    }
    cur = left.splice(bi,1)[0];
    out.push(cur);
  }
  return out;
}

/* ───────── 以某点为中心排行程（2026-11-21 owner 需求）─────────
   与「本周推荐」的区别要写清楚：
     · 本周推荐 = 从上海出发，固定周五晚走、周日晚回，靠天气排；
     · 这个     = 把用户搜到的那个点当大本营，在它周边按**方向**分天，不绑日期。
   站间距离一律是**直线距离**：库里没有点与点之间的车程，高德额度也不允许现场算，
   界面上必须写"直线"，不能让它看起来像车程（那会骗人）。 */
var ATRIP_RADIUS_KM = 45;   // 选点上限：再远就不算"周边"了
var ATRIP_DAY_KM = 25;      // 一天之内尽量不超过这个直线距离（山区 25km ≈ 1–1.5h 车程）

function bearingDeg(a, b){
  var toR = Math.PI/180;
  var y = Math.sin((b[0]-a[0])*toR) * Math.cos(b[1]*toR);
  var x = Math.cos(a[1]*toR)*Math.sin(b[1]*toR) - Math.sin(a[1]*toR)*Math.cos(b[1]*toR)*Math.cos((b[0]-a[0])*toR);
  return (Math.atan2(y, x)/toR + 360) % 360;
}

/* 路径长度：大本营 → 各站 → (当晚住宿 || 回大本营)。全程直线，不是车程。 */
function routeLen(center, stops, sleep){
  var pts = [spotCoord(center)];
  stops.forEach(function(x){ pts.push(spotCoord(x.s)); });
  pts.push(spotCoord(sleep ? sleep.s : center));
  var L = 0;
  for(var i=0; i<pts.length-1; i++){ if(pts[i] && pts[i+1]) L += haversineKm(pts[i], pts[i+1]); }
  return L;
}

/* 穷举站序（每天 ≤4 站 → 最多 24 种排列）。
   最近邻是近似解，站数这么少没必要近似；顺手就把"回头路"压到最小。 */
function bestOrder(center, stops, sleep){
  if(stops.length <= 1) return stops.slice();
  var best = null, bestLen = Infinity;
  (function walk(rest, acc){
    if(!rest.length){
      var L = routeLen(center, acc, sleep);
      if(L < bestLen){ bestLen = L; best = acc.slice(); }
      return;
    }
    for(var i=0; i<rest.length; i++){
      acc.push(rest[i]);
      walk(rest.slice(0,i).concat(rest.slice(i+1)), acc);
      acc.pop();
    }
  })(stops.slice(), []);
  return best || stops.slice();
}

/* 绕行下界：大本营→最远站→终点。实际路径越接近它，越不像在兜圈子。 */
function routeLowerBound(center, stops, sleep){
  var c0 = spotCoord(center), farP = null, farKm = 0;
  stops.forEach(function(x){
    var pc = spotCoord(x.s);
    if(!pc || !c0) return;
    var km = haversineKm(c0, pc);
    if(km > farKm){ farKm = km; farP = pc; }
  });
  if(!farP) return 0;
  var end = spotCoord(sleep ? sleep.s : center);
  return farKm + (end ? haversineKm(farP, end) : 0);
}

/* 一天的排法打包成一个可复用的结果 */
function planDayRoute(center, picks, sleep){
  var ordered = bestOrder(center, picks, sleep);
  var len = routeLen(center, ordered, sleep);
  var lb = routeLowerBound(center, ordered, sleep);
  return { ordered: ordered, len: len, lower: lb, detour: lb > 0.5 ? len/lb : 1 };
}

function buildAnchorTrip(center, days, season){
  var c0 = spotCoord(center);
  if(!c0) return null;
  var cand = [];
  DATA.spots.forEach(function(s){
    if(s.id === center.id) return;
    if(dogKey(s) === "forbidden") return;
    var pc = spotCoord(s); if(!pc) return;
    var km = haversineKm(c0, pc);
    if(km > ATRIP_RADIUS_KM) return;
    cand.push({ s:s, km:km, brg:bearingDeg(c0, pc) });
  });

  /* 按方位每 60° 分一桶：同一天只在同一侧活动，避免"上午东边下午西边"来回折返。
     桶内排序 = 当季档位 → 热度（笔记数）→ 距离近。 */
  var buckets = {};
  cand.forEach(function(x){
    var k = Math.floor(((x.brg + 30) % 360) / 60);
    (buckets[k] = buckets[k] || []).push(x);
  });
  var groups = Object.keys(buckets).map(function(k){
    var list = buckets[k].slice().sort(function(a,b){
      var ta = seasonTier(a.s, season), tb = seasonTier(b.s, season);
      if(tb !== ta) return tb - ta;
      var pa = popOf(a.s), pb = popOf(b.s);
      var na = pa ? pa.notes : 0, nb = pb ? pb.notes : 0;
      if(nb !== na) return nb - na;
      return a.km - b.km;
    });
    var top = popOf(list[0].s);
    return { list:list, topNotes: top ? top.notes : 0, dir: compassOf(list[0].brg) };
  });
  groups.sort(function(a,b){ return b.topNotes - a.topNotes; });

  var used = { };
  used[center.id] = 1;
  /* 分天规则（两条约束互相牵制，必须一起满足）：
       ① **同一天只在一个方向上玩**——所以在同一个方位桶里取点，跨桶就换天；
       ② **一天别跑太远**——桶内先拿 ≤25km 的，不够再放宽到 45km。
     第一版先只做了②（全局近距优先），结果一天里塞了"西边 1.3km"和"东边 22km"，
     方向标签成了平均值，等于骗人；反过来先只做①又会排出直线 35km 的站。 */
  var perDayCap = function(day){ return day === 1 ? 2 : 3; };
  var dayPicks = [[]];
  var cap = perDayCap(1);
  groups.forEach(function(g){
    var near = g.list.filter(function(x){ return x.km <= ATRIP_DAY_KM; });
    var far  = g.list.filter(function(x){ return x.km >  ATRIP_DAY_KM; });
    near.concat(far).forEach(function(x){
      if(used[x.s.id]) return;
      /* 只排到用户要的天数为止。原来不设上限，多出来的点也被标成 used，
         于是"住宿候选"里把它们排除了 —— 明明 0.2km 外有民宿，却报只能野营。 */
      if(dayPicks.length > days) return;
      if(dayPicks[dayPicks.length-1].length >= cap){
        if(dayPicks.length >= days) return;
        dayPicks.push([]);
        cap = perDayCap(dayPicks.length);
      }
      used[x.s.id] = 1;
      dayPicks[dayPicks.length-1].push(x);
    });
  });

  /* ── 第二阶段：站序 + 回头路 ──
     路径 = 大本营 → 各站 → (当晚住宿 || 回大本营)，全程直线。
     站序用穷举（每天 ≤4 站，最多 24 种排列）而不是最近邻：站数这么少，没必要近似。
     绕行系数 = 实际路径 / 下界（大本营→最远站→终点）；1.00 = 直去直回，>1.3 才算明显回头。 */
  var dayList = [];
  var pickSleep = function(d, picks){
    if(d >= days) return null;
    var SLEEP_RANK = { lodging:0, official_camp:1, allowed_wild:2, gray:3 };
    var rankOf = function(x){ var r = SLEEP_RANK[sleepKind(x.s)]; return r == null ? 9 : r; };
    /* 住宿优先级：能住店 > 官方营地 > 野外露营 > 存疑。
       "能睡"和"睡得稳"不是一回事：把野营排在民宿前面，等于让人带狗睡山上。 */
    var pool = picks.filter(function(x){ return isNight(x.s) && sleepKind(x.s) != null; }).slice();
    for(var j=0;j<cand.length;j++){
      var x = cand[j];
      if(used[x.s.id] || !isNight(x.s) || sleepKind(x.s)==null) continue;
      pool.push({ s:x.s, km:x.km });
    }
    /* 同类型里取离当天路线最近的：先按距离排，再看类型——顺序反过来会让"0.2km 的民宿"
       输给"30km 外的营地"，那显然是错的。 */
    pool.sort(function(a,b){ return a.km - b.km; });
    pool.sort(function(a,b){ return rankOf(a) - rankOf(b); });
    return pool.length ? { s: pool[0].s, km: pool[0].km } : null;
  };

  for(var d=1; d<=days; d++){
    var picks = dayPicks[d-1] || [];
    var sleep = pickSleep(d, picks);
    if(sleep) used[sleep.s.id] = 1;
    var r = planDayRoute(center, picks, sleep);
    dayList.push({ day:d, picks:r.ordered, sleep:sleep, len:r.len, detour:r.detour, center:center });
  }

  /* 跨天换站：把某天的某站和另一天的某站对调，若两天合计路径变短就换。
     扇区分天保证"方向大体一致"，但每桶最多能出 3 站，边界上的站仍可能被分到不合适的日子。
     这一步就是把那些站挪到更顺的那天去。 */
  var swapRound = 0, moved = true;
  while(moved && swapRound++ < 6){
    moved = false;
    for(var a=0; a<dayList.length; a++){
      for(var b=a+1; b<dayList.length; b++){
        var A = dayList[a], B = dayList[b];
        for(var i=0; i<A.picks.length; i++){
          for(var j=0; j<B.picks.length; j++){
            var pa = A.picks.slice(), pb = B.picks.slice();
            var tmp = pa[i]; pa[i] = pb[j]; pb[j] = tmp;
            var ra = planDayRoute(center, pa, A.sleep);
            var rb = planDayRoute(center, pb, B.sleep);
            if(ra.len + rb.len < (A.len + B.len) - 0.8){
              A.picks = ra.ordered; A.len = ra.len; A.detour = ra.detour;
              B.picks = rb.ordered; B.len = rb.len; B.detour = rb.detour;
              moved = true;
            }
          }
        }
      }
    }
  }

  /* 方向标签按当天最终站点算（换站之后可能变了） */
  dayList.forEach(function(dd){
    var brgs = dd.picks.map(function(x){ return x.brg; });
    dd.dir = "";
    if(brgs.length){
      /* 方位角取平均要按圆处理：算术平均在 0°/360° 附近会得出反方向 */
      var sx = 0, sy = 0;
      brgs.forEach(function(b){ sx += Math.cos(b*Math.PI/180); sy += Math.sin(b*Math.PI/180); });
      dd.dir = compassOf((Math.atan2(sy, sx)*180/Math.PI + 360) % 360);
    }
    dd.stops = [];
    if(dd.day === 1) dd.stops.push({ s:dd.center, km:0, center:true });
    dd.picks.forEach(function(x){ dd.stops.push(x); });
  });

  var totalKm = 0, maxLeg = 0, worstDetour = 1, detourDay = 0;
  dayList.forEach(function(dd){
    totalKm += dd.len;
    dd.stops.forEach(function(x){ if(x.km > maxLeg) maxLeg = x.km; });
    if(dd.detour > worstDetour){ worstDetour = dd.detour; detourDay = dd.day; }
  });
  return { center:center, days:days, season:season, dayList:dayList,
           totalKm:totalKm, maxLeg:maxLeg, worstDetour:worstDetour, detourDay:detourDay,
           pool:cand.length, radius:ATRIP_RADIUS_KM };
}

function compassOf(brg){
  var names = ["北","东北","东","东南","南","西南","西","西北"];
  return names[Math.floor(((brg + 22.5) % 360) / 45)];
}

/* ───────── 以某点为中心排行程：渲染与开合 ───────── */
var ATRIP = { centerId:null, days:2, season:null };   // season=null → 按当月
function ATTRIP_SEASON(){ return ATRIP.season || seasonOf(new Date()); }

function atripWhy(x, season){
  var bits = [];
  var t = seasonTier(x.s, season);
  if(t === 3) bits.push(season + "季最佳");
  else if(t === 2) bits.push(season + "季适合");
  else if(t === 1) bits.push(season + "季将就");
  else bits.push(season + "季不建议");
  var p = popOf(x.s);
  if(p && p.notes) bits.push("笔记 " + p.notes + " 条");
  return bits.join(" · ");
}

function renderAnchor(){
  var c = findSpot(ATRIP.centerId); if(!c) return;
  var season = ATTRIP_SEASON();
  var t = buildAnchorTrip(c, ATRIP.days, season);
  el("a-title").textContent = "以 " + c.name + " 为中心";
  var dh = spotH(c);
  el("a-loc").textContent = [c.city || c.province,
    (dh != null ? "从上海 " + dh.toFixed(1) + "h" : null),
    "周边 " + ATRIP_RADIUS_KM + " km"].filter(Boolean).join(" · ");
  if(!t){ el("a-body").innerHTML = '<div class="sec">这个点没有坐标，排不了。</div>'; return; }

  var h = '<div class="sec"><div class="achips">';
  [1,2,3].forEach(function(d){
    h += '<button class="chip" data-days="' + d + '" aria-pressed="' + (ATRIP.days === d) + '">'
       + d + ' 天' + (d > 1 ? " " + (d-1) + " 晚" : "") + '</button>';
  });
  h += '</div>';

  /* 季节（owner 2026-11-21 定调）：**默认按当月**，不用再选一次"当季"。
     四个季节直接摆出来，当月那个默认选中并标"本月"；想看去别的季节再点。 */
  var monthSeason = seasonOf(new Date());
  var curSeason = ATTRIP_SEASON();
  h += '<div class="achips" style="margin-top:8px">';
  ["春","夏","秋","冬"].forEach(function(sn){
    var on = (sn === curSeason);
    h += '<button class="chip" data-aseason="' + sn + '" aria-pressed="' + on + '">'
       + sn + '季' + (sn === monthSeason ? '<span class="as-tag" style="margin-left:5px">本月</span>' : '') + '</button>';
  });
  h += '</div></div>';

  if(!t.pool){
    h += '<div class="sec">周边 '+ATRIP_RADIUS_KM+' km 内没有别的点，只能单点玩。</div>';
  }

  t.dayList.forEach(function(d){
    h += '<div class="aday"><div class="aday-h">第 ' + d.day + ' 天';
    if(d.day === 1) h += '<span class="adir">大本营</span>';
    else if(d.dir) h += '<span class="adir">往' + d.dir + '方向</span>';
    /* 绕行系数：1.00 = 直去直回；>1.3 才算明显回头，标出来 */
    var dtag = '移动 ' + d.len.toFixed(1) + ' km · 绕行 ×' + d.detour.toFixed(2);
    h += '<span class="adir" style="margin-left:auto;' + (d.detour > 1.3 ? 'color:var(--terra-2);font-weight:700' : '') + '">'
       + dtag + (d.detour > 1.3 ? ' 回头路' : '') + '</span>';
    h += '</div>';
    d.stops.forEach(function(x){
      h += '<div class="astop">'
         + '<div class="as-n">' + esc(x.s.name) + (x.center ? '<span class="as-tag">大本营</span>' : '') + '</div>'
         + '<div class="as-m">' + [ (KIND_LABEL[x.s.kind] || "其他"),
              (x.km ? "直线 " + x.km.toFixed(1) + " km" : null) ].filter(Boolean).join(" · ") + '</div>'
         + '<div class="as-w">' + esc(atripWhy(x, season)) + '</div>'
         + '</div>';
    });
    if(d.sleep){
      h += '<div class="asleep">今晚住：<b>' + esc(d.sleep.s.name) + '</b>'
         + '（' + ((NIGHT_LABEL[sleepKind(d.sleep.s)] || [])[0] || "可过夜") + ' · 直线 ' + d.sleep.km.toFixed(1) + ' km）</div>';
    } else if(d.day < t.days){
      h += '<div class="asleep">这一晚没找到可过夜的点 —— 可能得住民宿或缩短一天。</div>';
    }
    h += '</div>';
  });

  h += '<div class="sec" style="margin-top:14px">'
     + '<button class="tripbtn" data-atrip-add="1">＋ 把这些点都加入行程</button></div>';
  h += '<div class="atrip-foot">'
     + '共 ' + t.totalKm.toFixed(1) + ' km 直线移动，最远一站 ' + t.maxLeg.toFixed(1) + ' km'
     + (t.maxLeg > ATRIP_DAY_KM ? '（超过 ' + ATRIP_DAY_KM + ' km，这一站建议单独安排半天）' : '') + '。<br>'
     + '<b>回头路检查</b>：每天按"实际走的直线总长 ÷ 直去直回的下界"算绕行系数，'
     + '1.00 表示一路直去直回；这次最绕的是第 ' + t.detourDay + ' 天 ×' + t.worstDetour.toFixed(2) + ''
     + (t.worstDetour > 1.3 ? '（周边能去的点就这几个，已经调过站序和换天）' : '（没有明显回头）') + '。<br>'
     + '<b>站与站之间的距离是直线，不是车程</b>；山区实际车程通常是直线的 1.3–1.8 倍，出发前用导航复核。<br>'
     + '季节按 ' + season + '季 排' + (ATRIP.season ? '（手动选的，默认是当月）' : '（默认当月）')
     + '；这个模式不绑日期，也不预测天气。'
     + '</div>';
  el("a-body").innerHTML = h;
}

function openAnchor(id){
  var s = findSpot(id); if(!s || !spotCoord(s)) return;
  ATRIP.centerId = id;
  el("atrip").classList.add("open");
  renderAnchor();
}
function closeAnchor(){ el("atrip").classList.remove("open"); }

function weatherScore(tmax, tmin, pop){
  var mid=(tmax+tmin)/2, s=100;
  s -= Math.min(60, pop*0.9);
  if(mid<0) s-=45; else if(mid<8) s-=25; else if(mid<14) s-=8;
  else if(mid<=24) s+=0; else if(mid<=29) s-=10; else s-=25;
  return Math.round(s);
}

function fetchWeek(c){
  var u = "https://api.open-meteo.com/v1/forecast?latitude="+c[1].toFixed(4)+
          "&longitude="+c[0].toFixed(4)+
          "&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m"+
          "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
          "&timezone=Asia%2FShanghai&forecast_days=16";
  /* 给请求加**硬超时**：Open-Meteo 会周期性劣化（2026-11-10 实测单次 7–14 秒，偶发挂住不返回）。
     没有超时的话，一个挂住的请求会让「本周推荐」永远停在「正在算」——用户看到的是死页面。
     超时后走 catch，把那片区 WeatherOk 置 false，用 0.4 保底系数继续算，页面照常出结果。 */
  var AC = window.AbortController ? new AbortController() : null;
  var timer = AC ? setTimeout(function(){ try{ AC.abort(); }catch(e){} }, 12000) : null;
  return fetch(u, AC ? {signal: AC.signal} : undefined).then(function(r){
    if(timer) clearTimeout(timer);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }, function(e){
    if(timer) clearTimeout(timer);
    throw e;
  });
}

function dayOf(w, iso){
  var d=(w&&w.daily)||{}, times=d.time||[], i=times.indexOf(iso);
  if(i<0) return null;
  var pop = d.precipitation_probability_max[i]; if(pop==null) pop=0;
  return { date:iso, code:d.weather_code[i],
           tmax:d.temperature_2m_max[i], tmin:d.temperature_2m_min[i], pop:pop,
           score:weatherScore(d.temperature_2m_max[i], d.temperature_2m_min[i], pop) };
}

function md(iso){ var p=String(iso||"").split("-"); return p.length===3 ? (parseInt(p[1],10)+"/"+parseInt(p[2],10)) : iso; }
function wd(iso){ return ["日","一","二","三","四","五","六"][new Date(iso+"T00:00:00").getDay()]; }
function clock(hoursFloat){
  var t = DEPART_HOUR*60 + Math.round(hoursFloat*60);
  var hh = Math.floor(t/60)%24, mm = t%60;
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

/* 周日几点能到家（2026-11-24）：
   路线卡一直只写"周日玩完直接回上海"，可回**几点**才是能不能周一起床上班的关键。
   口径写死、写在旁边看得见：**周日 16:00 收工**（再玩下去到家就过九点了），
   加上最后一站回上海的单程车程。这是估算不是承诺，所以字样上写「约」。 */
var SUNDAY_WRAP_HOUR = 16;
function homeByClock(hoursFloat){
  var t = SUNDAY_WRAP_HOUR*60 + Math.round((hoursFloat||0)*60);
  var hh = Math.floor(t/60)%24, mm = t%60;
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

/* ─── 组路线 ───
   排序只看两样：**景色**和**天气**。
   证据（可带狗/有原话/有厕所/有图）只用来当理由展示和选"睡哪"，
   不再参与排序——证据多只说明被记录得多，不说明好看。 */
function clusterScene(c){
  /* 片区好不好，看它**最热的那一站**；全片区都没热度数据就返回 null，
     不当成 0，那样会跟"真的没人发"混为一谈。 */
  var p = clusterPop(c);
  return p ? p.notes : null;
}

function buildPlans(){
  var wk = thisWeekend(PLAN.weekOffset);
  /* 季节跟着**所选的那个周末**走：翻到 12 月的周末就该按冬天排，
     不能一直按"今天是什么季节"。 */
  /* wk.fri 是 "2026-11-27" 这样的字符串，不是 Date —— 直接传给 seasonOf 会炸
     （第一版就是这么挂的：TypeError: d.getMonth is not a function，整条推荐出不来）。 */
  var season = seasonOf(new Date((wk.fri || isoDate(new Date())) + "T12:00:00"));
  PLAN.window = wk;
  var lim = (STATE.hours == null) ? 99 : STATE.hours;   /* 默认不限车程 */

  /* 推荐纳入范围 = 江浙沪皖（owner 已拍板）。
     注意：这条**不能**用车程来兜底——2026-11-10 把默认车程筛掉之后，lim 变成 99，
     福建(27)/山东(25)/江西(4) 一次全进了候选池（727 个），跟"推荐只看江浙沪皖"直接冲突。
     车程是地图的筛选条件，省份才是推荐的边界。 */
  var PLAN_PROV = { "上海":1, "江苏":1, "浙江":1, "安徽":1 };

  var pool = DATA.spots.filter(function(s){
    var h = spotH(s);
    if(!PLAN_PROV[s.province]) return false;
    if(h==null || h>lim) return false;
    if(spotCoord(s)==null) return false;
    if(((s.dog||{}).policy)==="forbidden") return false;
    if(s.kind==="transit") return false;
    if(/码头|停车场|公交|地铁|客运站|收费站|服务区|执法/.test(s.name)) return false;
    /* 坐标可疑的点不进推荐：一个 400km 外的错误图钉，不如本周少给一条路线 */
    if(s.geo_suspect) return false;
    return true;
  });
  /* 季节只做权重，**不做门槛**（owner 2026-11-21：「最佳不是只能去那，你可以推荐但是不要收窄」）。
     第一版在这里把本季 0 分的点直接剔出候选，冬天等于只剩 5 个点可选——那是收窄，不是推荐。
     现在所有候选一律保留，季节只影响排序得分。 */
  /* 去过的不进候选（2026-11-24）：每周都推同一批地方，这个产品就没用了。
     但不是"永久封杀"——PLAN.includeBeen 打开就把它们放回来（不持久化，下次打开回到默认）。 */
  var beenSkipped = 0;
  if(!PLAN.includeBeen){
    pool = pool.filter(function(s){
      if(inBeen(s.id)){ beenSkipped++; return false; }
      return true;
    });
  }
  PLAN.beenSkipped = beenSkipped;

  pool.forEach(function(s){
    s.__p = scoreSpot(s, season) || { score:0, why:[] };
    s.__pop = popOf(s);
  });
  PLAN.pool = pool.length;
  PLAN.hot = pool.filter(function(s){ return popOf(s) != null; }).length;

  var clusters = clusterSpots(pool, 35).filter(function(c){ return c.spots.length>=3; });
  clusters.forEach(function(c){
    /* 睡哪、玩哪都按景色挑：露营地好不好看也是体验的一部分 */
    /* 睡哪、玩哪都按热度挑；没热度数据的排后面，但不剔除 */
    function byRating(a,b){
      var pa = popOf(a), pb = popOf(b);
      if(pa == null && pb == null) return 0;
      if(pa == null) return 1;
      if(pb == null) return -1;
      if(pb.notes !== pa.notes) return pb.notes - pa.notes;
      return pb.likes - pa.likes;
    }
    c.sleeps = c.spots.filter(sleepKind).sort(byRating);
    c.plays  = c.spots.filter(function(s){ return !sleepKind(s) && s.kind!=="lodging"; }).sort(byRating);
    c.maxH = Math.max.apply(null, c.spots.map(spotH));
    c.scene = clusterScene(c);
  });

  /* 先按景色挑出候选片区，天气等查完再一起排 */
  var ov = clusters.filter(function(c){ return c.sleeps.length && c.maxH<=4.5 && c.maxH>=1.0; })
                   .sort(function(a,b){ return b.scene-a.scene; }).slice(0,6);
  var dt = clusters.filter(function(c){ return c.maxH<=2.5 && c.plays.length>=2; })
                   .sort(function(a,b){ return b.scene-a.scene; }).slice(0,6);
  var seen = [];
  ov.concat(dt).forEach(function(c){ if(seen.indexOf(c)<0) seen.push(c); });
  var shortlist = seen.sort(function(a,b){
    if(a.scene == null && b.scene == null) return 0;
    if(a.scene == null) return 1;
    if(b.scene == null) return -1;
    return b.scene - a.scene;
  }).slice(0,8);

  /* 天气**并发**取，不要串行。
     2026-11-10 实测：Open-Meteo 从不到 1 秒变成单次 7–14 秒，而这里是 8 个片区一个接一个取，
     于是「打开就是本周推荐」变成盯着「正在算」一两分钟——串行把延迟乘了 8 倍。
     并发后总耗时≈最慢那一次；单个失败仍然只影响自己那片区（下面的 catch 保持原样）。 */
  return Promise.all(shortlist.map(function(c){
    return fetchWeek(c.centroid).then(function(w){
      c.now = w.current || null;
      c.wFri = dayOf(w, wk.fri); c.wSat = dayOf(w, wk.sat); c.wSun = dayOf(w, wk.sun);
      c.weatherOk = !!c.wSat;
    }).catch(function(e){
      c.now=null; c.wFri=c.wSat=c.wSun=null; c.weatherOk=false;
      c.weatherErr = (e&&e.message)||"取不到";
    });
  })).then(function(){
    /* 综合分 = 景色 × 天气。天气好但景色一般，和景色好但天气一般，会拉平到一起比。
       天气取不到就按 0.4 的保底系数，不让"查不到"变成"直接淘汰"。 */
    shortlist.forEach(function(c){
      var w = c.wSat ? c.wSat.score : null;
      c.weather = w;
      /* 综合 = 这个片区最热那站的笔记数 × 天气/100。两个都是实数，不合成虚分。 */
      var base = c.scene != null ? c.scene : 0;
      c.combo = Math.round(base * (w!=null ? w/100 : 0.4) * 100) / 100;
    });
    shortlist.sort(function(a,b){ return b.combo-a.combo; });

    function kindOf(c){
      return (c.sleeps.length && c.maxH<=4.5 && c.maxH>=1.0) ? "两晚三天" : "周六来回";
    }
    /* 先把每条候选路线真的组出来，再用**这条路线自己的站**算评分——
       用整个片区的最高分会出现"显示 4.6、综合按 4.9 算"的不一致。 */
    var built = shortlist.map(function(c){
      var pl = composePlan(kindOf(c), c, wk, season);
      /* 只用"能玩的站"算评分：酒店 4.9 说明住得好，不说明这趟好玩，
         而且卡片标题本来就是挑能玩的站当门面，两边必须同一个口径。 */
      var ps = pl.stops.map(function(x){ return popOf(x.s); }).filter(function(x){ return x; });
      ps.sort(function(a,b){ return (b.notes-a.notes) || (b.likes-a.likes); });
      pl.pop = ps.length ? ps[0] : null;
      pl.weather = c.weather;
      var base2 = pl.pop ? pl.pop.notes : 0;
      pl.combo = Math.round(base2 * (c.weather!=null ? c.weather/100 : 0.4) * 100) / 100;
      pl.wFri = c.wFri; pl.wSat = c.wSat; pl.wSun = c.wSun; pl.now = c.now;
      pl.weatherOk = c.weatherOk; pl.weatherErr = c.weatherErr;
      return pl;
    });
    /* 季节权重：档位越高系数越大，但**不清零、不剔除**——
       一条"适合"档但热度极高、天气极好的路线，仍然可以压过一条"最佳"档的普通路线。
       系数区间 0.25~1.0，够让季节明显影响排序，又不至于把场子锁死。 */
    var SEASON_WEIGHT = {3:1.0, 2:0.78, 1:0.5, 0:0.25};
    built.forEach(function(pl){
      var t = 0;
      pl.stops.forEach(function(x){
        var st = seasonTier(x.s, season);
        if(st > t) t = st;
      });
      pl.seasonTier = t;
      pl.seasonWeight = SEASON_WEIGHT[t] != null ? SEASON_WEIGHT[t] : 0.78;
      pl.score = pl.combo * pl.seasonWeight;
    });
    built.sort(function(a,b){ return b.score - a.score; });
    /* 换一批（2026-11-23）：以前永远只给排前 3 的路线，不满意就没别的了——
       可候选其实有几十条。现在把整张排序表留着，一次显示 3 条，翻得动。 */
    PLAN.allBuilt = built;
    var per = 3;
    var page = PLAN.page || 0;
    var picks = built.slice(page*per, page*per+per);
    if(!picks.length){ PLAN.page = 0; picks = built.slice(0, per); }
    PLAN.fetchedAt = new Date().toLocaleString("zh-CN", {hour12:false});
    return picks;
  });
}

/* 组一条具体路线 */
function composePlan(kind, c, wk, season){
  var sleep = c.sleeps[0] || null;
  var stops = [], legs = [];

  if(kind==="两晚三天"){
    stops.push({ s:sleep, day:0 });
    var plays = c.plays.filter(function(s){ return s!==sleep; });
    var d1 = nearestChain(sleep, plays.slice(0,5), 2);
    d1.forEach(function(s){ stops.push({ s:s, day:1 }); });
    var rest = plays.filter(function(s){ return d1.indexOf(s)<0; });
    if(rest.length){
      var home = (DATA.meta&&DATA.meta.origin&&DATA.meta.origin.gcj) || [121.473701,31.230416];
      var prevC = spotCoord(stops[stops.length-1].s);
      var last = rest.slice().sort(function(a,b){
        var ca=spotCoord(a), cb=spotCoord(b);
        var da = (prevC&&ca) ? haversineKm(prevC,ca)+haversineKm(ca,home) : spotH(a)*80;
        var db = (prevC&&cb) ? haversineKm(prevC,cb)+haversineKm(cb,home) : spotH(b)*80;
        return da-db;
      })[0];
      var mid = nearestChain(stops[stops.length-1].s, rest.filter(function(s){ return s!==last; }), 1);
      mid.forEach(function(s){ stops.push({ s:s, day:2 }); });
      stops.push({ s:last, day:2 });
    }
  } else {
    var start = c.plays[0] || c.spots[0];
    var chain = [start].concat(nearestChain(start, c.plays.filter(function(s){ return s!==start; }).slice(0,6), 2));
    chain.forEach(function(s){ stops.push({ s:s, day:1 }); });
  }

  for(var i=1;i<stops.length;i++){
    var a=spotCoord(stops[i-1].s), b=spotCoord(stops[i].s);
    legs.push(a&&b ? haversineKm(a,b) : null);
  }

  var maxH = Math.max.apply(null, stops.map(function(x){ return spotH(x.s); }));
  return {
    kind:kind, season:season, stops:stops, legs:legs, maxH:maxH,
    sleepIdx: stops.findIndex(function(x){ return x.day===0; }),
    centroid: c.centroid,
    name: clusterName(stops.map(function(x){ return x.s; }))
  };
}

/* ─── 渲染 ─── */
/* 周日几点到家：最后一站回上海的单程车程 + 16:00 收工。 */
/* 数据里有些证据是一句「来源：『』」——引号里啥也没有。
   印出来对读者毫无用处，还会显得这地方真有一句原话。 */
function tidyEv(t){
  var v = String(t||"").replace(/「\s*」/g, "").replace(/[：:,，]\s*$/, "").trim();
  return v.length >= 6 ? v : "";
}

function homeLineHTML(p){
  var last = p.stops && p.stops[p.stops.length-1];
  if(!last || !last.s) return "";
  var backH = spotH(last.s);
  if(!backH) return "";
  return '<div class="plan-line"><b>周日晚</b>按 <b>' + SUNDAY_WRAP_HOUR + ':00</b> 收工算，' +
    '最后一站回上海约 <b>' + hm(backH) + '</b>，' +
    '大约 <b>' + homeByClock(backH) + '</b> 到家。</div>';
}

function planStopHTML(s, leg, dayLabel){
  var p = s.__p || {why:[]};
  var meta = "单程 " + hm(spotH(s));
  if(leg!=null) meta += " · 与上一站直线 " + leg.toFixed(1) + "km";
  var seT = seasonTier(s, seasonOf(new Date()));
  if(seT === 3) meta += " · " + seasonOf(new Date()) + "季最佳";
  return '<li class="plan-stop" data-id="'+esc(s.id)+'" title="点开看详情">' +
      (dayLabel ? '<div class="plan-daymark">'+esc(dayLabel)+'</div>' : '') +
      '<div class="ps-name">'+esc(s.name)+'</div>' +
      '<div class="ps-meta">'+esc(meta)+'</div>' +
      (p.why.length ? '<div class="ps-why">'+p.why.slice(0,3).map(function(w){
          return '<span>'+esc(w.t)+'<i>· '+esc(w.s)+'</i></span>';
        }).join("")+'</div>' : '') +
      '<div class="ps-foot"><span class="ps-go">详情 ›</span></div>' +
    '</li>';
}

function wdayHTML(d, label){
  if(!d) return '<div class="pw-day pw-bad"><i>'+esc(label)+'</i><b>无</b><s>—</s></div>';
  var cls = d.score>=70 ? "pw-good" : d.score>=45 ? "pw-mid" : "pw-bad";
  return '<div class="pw-day '+cls+'"><i>'+esc(label)+' '+md(d.date)+'</i>'+
    '<b>'+Math.round(d.pop)+'%</b><s>'+Math.round(d.tmin)+'~'+Math.round(d.tmax)+'°</s></div>';
}

/* 挑一张"看得出这是哪儿"的图：小红书首图常是带大字封面或自拍，做缩略图很糟；
   高德商户图通常是地点本身。都没有才退回小红书第 2 张（跳过封面）。
   列表卡片和推荐卡片共用这一套，免得两处各挑一张、说的不是一回事。 */
function pickThumb(s){
  var ph = s && s.photos && s.photos.length ? s.photos : null;
  if(!ph) return null;
  var gd = ph.filter(function(p){ return p.src !== "小红书"; });
  var xh = ph.filter(function(p){ return p.src === "小红书"; });
  return (gd[0] || xh[1] || xh[0] || ph[0]).url;
}

/* 推荐卡加一排站点的实拍图（2026-11-23）：以前三条路线全是文字，
   "无锡窑湖小镇"和"苏州金鸡湖"在字面上没区别，看一眼就得往下读。
   有图的站最多取 3 张，一张都没有就整排不出现，不占位。 */
function planThumbsHTML(p){
  var items = [], seen = {};
  for(var i=0;i<p.stops.length && items.length<3;i++){
    var sp = p.stops[i].s, u = pickThumb(sp);
    if(!u || seen[u]) continue;
    seen[u] = 1;
    items.push({u:u, n:sp.name});
  }
  if(!items.length) return "";
  return '<div class="plan-thumbs">' + items.map(function(it){
    return '<span class="pt"><img src="'+esc(it.u)+'" alt="'+esc(it.n)+' 实拍" '+
      'loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></span>';
  }).join("") + '</div>';
}

function planCardHTML(p, idx, quiet){
  var head = '<div class="plan-head"><span class="plan-tag '+
    (p.kind==="两晚三天"?"pt-2d":"pt-1d")+'">'+esc(p.kind)+'</span>'+
    '<h4>'+(idx+1)+'. '+esc(p.name)+'</h4>'+
    '<span class="plan-maxh">最远单程 '+esc(hm(p.maxH))+'</span></div>';

  var weather;
  if(p.weatherOk){
    var bad = (p.wSat && p.wSat.score<45) || (p.wSun && p.wSun.score<45);
    /* 实时天气：抓取那一刻这个片区实际是多少度、体感多少、有没有在下雨 */
    var nowHTML = '';
    if(p.now && p.now.temperature_2m!=null){
      nowHTML = '<div class="plan-now">现在 '+Math.round(p.now.temperature_2m)+
        '℃（体感 '+Math.round(p.now.apparent_temperature)+'℃）'+
        ' · '+esc(WMO[p.now.weather_code]||"—")+
        ' · 风 '+Math.round(p.now.wind_speed_10m)+'km/h'+
        (p.now.precipitation>0 ? ' · 正在下 '+p.now.precipitation+'mm' : '')+
        '<i>Open-Meteo '+esc(String(p.now.time||"").slice(11,16))+' 实测</i></div>';
    }
    weather = nowHTML + '<div class="plan-week">' +
        wdayHTML(p.wFri, "周五夜") + wdayHTML(p.wSat, "周六") + wdayHTML(p.wSun, "周日") +
      '</div>' +
      (bad && !quiet ? '<div class="plan-warn">这周末的天气不适合出门（上面对比着看）。硬要去就带好雨具，营地注意积水。</div>' : '');
  } else {
    weather = '<div class="plan-warn">天气没取到（'+esc(p.weatherErr||"网络不可用")+
      '）—— 出发前自己看一眼预报，别按这条定日子。</div>';
  }

  /* 「跨度」原来是各段距离求和，语义就错了：两站 1.4km 相加仍是 1.4，
     toFixed(0) 又变成"约 1km"，和下面显示的 1.4km 自相矛盾。
     跨度 = 任意两站之间的最远直线距离，才配叫跨度。 */
  var spanTxt = "";
  if(p.stops.length>1){
    var mx=0, ca, cb;
    for(var si=0;si<p.stops.length;si++){
      for(var sj=si+1;sj<p.stops.length;sj++){
        ca=spotCoord(p.stops[si].s); cb=spotCoord(p.stops[sj].s);
        var d=(ca&&cb)?haversineKm(ca,cb):null;
        if(d!=null&&d>mx) mx=d;
      }
    }
    if(mx>0) spanTxt = "站与站最远直线 " + mx.toFixed(1) + "km（不是车程）";
  }

  var body;
  if(p.kind==="两晚三天" && p.sleepIdx>=0){
    var sp = p.stops[p.sleepIdx].s;
    var q = ((sp.overnight||{}).evidence||[])[0];
    body =
      p.stops.map(function(x,i){
        var label = i===0 ? "周五晚 · "+clock(spotH(x.s))+" 到（"+DEPART_HOUR+":00 出发）"
                  : (x.day===1 ? (p.stops[i-1].day!==1 ? "周六" : "") : (p.stops[i-1].day!==2 ? "周日（玩完直接回上海）" : ""));
        return planStopHTML(x.s, i===0?null:p.legs[i-1], label);
      }).join("") +
      '<div class="plan-line"><b>过夜</b>周五、周六两晚都睡「'+esc(sp.name)+'」'+esc(NIGHT_LABEL[nightKey(sp)][0])+
        (q ? '，原话：「'+esc(String(q.quote||"").slice(0,40))+'」' : '，这一步没有笔记原话，属人工判断')+'。</div>' +
      '<div class="plan-line"><b>怎么走</b>周五夜直接到睡的地方；周六在附近玩；周日玩完，'+
        '最后一站特意挑离上海最近的那个'+(spanTxt?'，'+esc(spanTxt):'')+'。</div>' +
      homeLineHTML(p);
  } else {
    body = p.stops.map(function(x,i){
        return planStopHTML(x.s, i===0?null:p.legs[i-1], i===0 ? "周六早上出发" : "");
      }).join("") +
      '<div class="plan-line"><b>怎么走</b>周六一早出发，一天玩这 '+p.stops.length+' 站，晚上回上海'+
        (spanTxt?'，'+esc(spanTxt):'')+'。</div>' +
      (PLAN.plans.some(function(q){ return q.kind==='两晚三天'; })
        ? '<div class="plan-line"><b>过夜</b>当天来回，不用带帐篷。想住一晚的话看上面那条两晚的。</div>'
        : '<div class="plan-line"><b>过夜</b>当天来回，不用带帐篷。</div>') +
      homeLineHTML(p);
  }

  var anySeason = p.stops.some(function(x){
    return (x.s.__p.why||[]).some(function(w){ return w.s==="笔记"; });
  });

  return '<div class="plan-card">' + head + planThumbsHTML(p) + weather +
    /* 手机上路线默认收起来（省空间），但"展开"之前连"这趟经过哪几个地方"都看不到，
       要判断一条路线合不合胃口只能先展开再收——所以摘要里直接串一条名字链（2026-11-24）。 */
    '<details class="stops-d" open><summary>路线 · '+p.stops.length+' 个点'+
      (spanTxt ? ' · '+esc(spanTxt) : '')+
      '<div class="sd-chain">' + p.stops.slice(0, 6).map(function(st){
        return esc((st.s || {}).name || "");
      }).join(' <span class="arw">→</span> ') +
      (p.stops.length > 6 ? ' <span class="arw">→</span> 还有 ' + (p.stops.length - 6) + ' 个' : '') +
      '</div></summary><div class="sd-body">' +
    '<ol class="plan-stops">' + body + '</ol>' +
    '<div class="plan-line"><b>季节</b>现在是'+p.season+'季，'+
      (anySeason ? '上面有点位的原话提到了当季景象。' : '笔记里没有明确的季节描述，这里不硬编。')+'</div>' +
    '</div></details>' +
    /* 推荐看完想照着走，以前只能回列表一个个点「加入行程」。
       一条路线本身就是一串点，直接整串装进去（2026-11-23）。 */
    '<button class="plan-to-trip" data-plantrip="' + idx + '">把这 ' + p.stops.length + ' 个点装进行程</button>' +
  '</div>';
}

/* 数据多旧了，直接说人话 */
function planAgeText(){
  if(!PLAN.at) return "还没查过";
  var s = Math.round((Date.now()-PLAN.at)/1000);
  if(s < 60) return "刚刚";
  if(s < 3600) return Math.round(s/60)+" 分钟前";
  return Math.round(s/3600)+" 小时前";
}

function weekBarHTML(){
  var names = ["这周末", "下周末", "再下周末"];
  var out = '<div class="plan-weeks">';
  for(var i=0;i<3;i++){
    var w = thisWeekend(i);
    /* 手机上三个按钮要挤在一行：日期只留"月/日–日"，省掉后面重复的月份 */
    var endDay = String(w.sun).slice(-2).replace(/^0/,"");
    var span = md(w.fri) + "–" + endDay;
    out += '<button class="pw'+(PLAN.weekOffset===i?' on':'')+'" data-off="'+i+'">'+
           names[i]+'<i>'+span+'</i></button>';
  }
  return out + '</div>';
}

/* 同一份内容要出现在两个地方：桌面的弹层、手机的首屏。
   所以先算成字符串，再分别塞进去，避免两套逻辑各说各话。 */
function planBodyHTML(){
  if(PLAN.state==="loading" && !PLAN.plans.length)
    return weekBarHTML() + '<div class="plan-loading">正在取天气、算路线…</div>';
  if(PLAN.err)
    return weekBarHTML() + '<div class="plan-loading">没能生成推荐：'+esc(PLAN.err)+'</div>';
  if(!PLAN.plans.length)
    return weekBarHTML() + '<div class="plan-loading">当前范围内凑不出 3 个点以上的片区。' +
      (PLAN.beenSkipped ? '<br>（你已经去过 '+PLAN.beenSkipped+' 个，都跳过了；' +
        '<button class="chip" data-incl-been="1">把去过的也纳进来</button>）' : '') + '</div>';

  var sat = PLAN.plans.map(function(p){ return p.weatherOk&&p.wSat ? p.wSat.score : null; })
                     .filter(function(x){ return x!=null; });
  var allBad = sat.length && Math.max.apply(null, sat) < 50;
  /* 天气一条都没取到：以前这里什么都不说，汇总行照样写"抓取于 xx:xx（刚刚）"，
     等于**在没拿到数据时宣称刚查过**。2026-11-10 用 CDP 拦掉 open-meteo 实测：
     卡片里一个降水数字都没有、页面没有任何提示、时间行却显示"刚刚"。
     取不到就说取不到，并且说清排序退化成只看热度。 */
  var wFail = (sat.length===0 && PLAN.weekOffset===0);
  var wMiss = PLAN.plans.length - sat.length;
  var head = (wFail ? '<div class="plan-warn" style="margin-bottom:12px">'+
      '这次<b>没取到天气</b>（Open-Meteo 请求失败或网络不通）。下面的排序<b>先按季节、再按热度</b>（少了天气这一项），'+
      '出发前请自己再确认一次天气。</div>' : '') +
      ((wMiss>0 && !wFail) ? '<div class="plan-warn" style="margin-bottom:12px">'+
      '有 '+wMiss+' 条路线没取到天气，那几条按热度保底排序，不代表当天天气好。</div>' : '') +
      (allBad ? '<div class="plan-warn" style="margin-bottom:12px">'+
      '周六几个片区降水都在 '+Math.min.apply(null, PLAN.plans.filter(function(p){return p.wSat;})
        .map(function(p){ return Math.round(p.wSat.pop); }))+'% 以上，这周不建议出发。'+
      /* 光说"别去"是句丧气话——总得给个下一步：顺手能翻到下周末（2026-11-24） */
      '<br><button class="chip" data-week-next="1" style="margin-top:8px">看下周末的天气 ›</button></div>' : '') +
      ((!sat.length && PLAN.weekOffset>0)
        ? '<div class="plan-warn" style="margin-bottom:12px">'+
          '这个周末超出了天气预报的范围（Open-Meteo 最多给 16 天），<b>还没出预报</b>。'+
          '所以下面的排序只按"这地方有多热"，天气这一项没有参与。</div>' : '') +
      '<details class="plan-note">' +
      '<summary>窗口 <b>周五 '+DEPART_HOUR+':00 出发 · 周日晚回</b> · 候选 '+PLAN.pool+' 个点 · 排序＝季节 → 热度×天气</summary>' +
      '<div class="pn-body">' +
      '候选点 = '+(STATE.hours == null ? '不限车程' : '单程 ≤'+STATE.hours.toFixed(1)+'h')+'、排除明确禁狗' +
      (PLAN.beenSkipped ? '、跳过 ' + PLAN.beenSkipped + ' 个你去过的' : '') + '，共 '+PLAN.pool+' 个。' +
      /* 去过被跳过了就得说清楚，否则"怎么少了一大截"没法解释；还得留个把纳回来的口子 */
      (PLAN.beenSkipped ? '<br>跳过的 '+PLAN.beenSkipped+' 个是你在详情页标记过「去过」的。' +
         '<button class="chip" data-incl-been="1">把去过的也纳进来</button>'
        : (PLAN.includeBeen && STATE.been.length ? '<br>现在把你去过的 '+STATE.been.length+' 个也纳进来了。' +
           '<button class="chip" data-incl-been="0">还是跳过吧</button>' : '')) +
      (sat.length ? '天气每次打开都重新查（Open-Meteo 实时预报），这次抓取于 '+esc(PLAN.fetchedAt)+
      (PLAN.at ? '（'+planAgeText()+'）' : '')+'。'
        : '天气这次<b>没取到</b>（尝试于 '+esc(PLAN.fetchedAt)+'），所以排序里没有天气这一项。') +
      '车程是真实路网算的；<b>站与站之间只给直线距离，不是车程</b>。<br>' +
      '<b>排序看三样：季节、这地方现在有多热、去的那天天气怎么样</b>。' +
      '<b>季节只影响排序权重，不是门槛</b>——任何季节都能去，只是排位不同；' +
      '同样热度的两个地方，当季的那个排前面。' +
      '季节判断来自笔记原文或类型推断，详情页每条都写明依据。' +
      '<br>"热"是指小红书上这段时间有多少人在发这个地方——发的人越多越值得去；天气取周六的实时预报。' +
      '犬政策、有没有原话、有没有厕所只用来当理由和挑营地，不参与排序。' +
      '</div></details>';

  /* 顶部已经统一说过"这周不建议出发"时，卡片里就不再重复同一句话 */
  return weekBarHTML() + head +
    PLAN.plans.map(function(p, i){
      /* 编号接着往下排（第 4–6 条就该显示 4、5、6），不要每页都从 1 开始 */
      return planCardHTML(p, (PLAN.page||0)*3 + i, allBad);
    }).join("") +
    planMoreHTML() +
    (PLAN.state==="loading" ? '<div class="plan-refreshing">正在重新查天气…（下面是 '+planAgeText()+' 的数据）</div>' : '') +
    '<div class="plan-foot">降水% 越低越好；出行指数 = 100 − 降水概率×0.9 − 体感温度惩罚（&lt;0℃ 扣 45、&lt;8℃ 扣 25、&lt;14℃ 扣 8、&gt;29℃ 扣 25）。权重写在这里，你可以不认同。</div>';
}

/* 「换一批」：候选路线不止 3 条，不满意就往下翻；翻到最后一条再点就回到前三 */
function planMoreHTML(){
  var all = PLAN.allBuilt || [];
  var per = 3, page = PLAN.page || 0;
  if(all.length <= per) return "";
  var from = page*per + 1, to = page*per + PLAN.plans.length;
  var last = (page+1)*per >= all.length;
  return '<div class="plan-more">' +
    '<button class="more-btn" data-plan-page="' + (last ? 0 : page+1) + '">' +
      (last ? '回到前 ' + per + ' 条' : '换 ' + Math.min(per, all.length - from + 1) + ' 条') +
    '</button>' +
    '<span class="more-hint">共 ' + all.length + ' 条候选路线 · 现在看第 ' + from + '–' + to + ' 条</span>' +
  '</div>';
}

function paintPlanBox(box, html){
  if(!box) return;
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll(".plan-week"), scrollFade);
  var wide = window.matchMedia("(min-width:860px)").matches;
  var pn = box.querySelector(".plan-note");
  /* 手机上默认收起：不收起时第一屏全被说明文字占满，看不到路线 */
  if(pn) pn.open = wide;
  Array.prototype.forEach.call(box.querySelectorAll(".stops-d"), function(d){ d.open = wide; });
  box.scrollTop = 0;
}

function renderPlan(){
  var html = planBodyHTML();
  paintPlanBox(el("plan-body"), html);
  paintPlanBox(el("home-body"), html);

  var w = PLAN.window || {};
  var line = (w.fri ? (md(w.fri)+"–"+md(w.sun)+" · ") : "") +
             (PLAN.plans.length ? PLAN.plans.length + " 条路线" : "正在算");
  if(el("plan-sub")) el("plan-sub").textContent = line;
  if(el("home-sub")) el("home-sub").textContent = line;
}

/* 换一批只换显示，不重算：PLAN.allBuilt 已经排好序，翻页是纯前端动作 */
document.addEventListener("click", function(e){
  /* 周末切换（2026-11-24）：这三个按钮（这周末/下周末/再下周末）以前只在
     桌面弹层 #plan-panel 上有处理器，而**手机首屏是另一份 DOM（#home-body）**——
     也就是手机上点了毫无反应，却是手机上最常用的那个界面。改挂到 document 上，
     两份 DOM 都覆盖到。 */
  var wn = e.target.closest && e.target.closest("[data-week-next]");
  if(wn){ e.preventDefault(); setWeek((PLAN.weekOffset || 0) + 1); return; }
  var wb = e.target.closest && e.target.closest(".plan-weeks button");
  if(wb){
    e.preventDefault();
    setWeek(parseInt(wb.getAttribute("data-off"), 10) || 0);
    return;
  }
  /* 同一类问题（2026-11-24）：推荐里的「站点」也只有桌面弹层能点开详情，
     手机首屏那 15 个站点是哑的——点上去什么都不发生，连"详情 ›"的字样都白写了。 */
  var ps = e.target.closest && e.target.closest(".plan-stop");
  if(ps && ps.getAttribute("data-id")){
    STATE.detailFromPlan = true;
    closePlan();
    openDetail(ps.getAttribute("data-id"));
    return;
  }
  var pt = e.target.closest && e.target.closest("[data-plantrip]");
  if(pt){
    /* 卡片上的序号是"全局第几条"（标题按 1./2./3./4.… 连续编号），
       但 PLAN.plans 只存当前这一页。翻到第二页后直接拿全局序号去取会取空，
       按钮点了毫无反应（2026-11-23 由 plan-test 抓到）。这里换算回页内序号。*/
    var gi = parseInt(pt.getAttribute("data-plantrip"), 10) || 0;
    var idx2 = gi - (PLAN.page || 0) * 3;
    var pl = (PLAN.plans || [])[idx2];
    if(!pl) return;
    var added = 0;
    pl.stops.forEach(function(x){
      if(x.s && STATE.trip.indexOf(x.s.id) < 0){ STATE.trip.push(x.s.id); added++; }
    });
    saveTrip(); renderTrip();
    toast(added ? "已把 " + added + " 个点装进行程" + (STATE.trip.length > added ? "（另有 " + (STATE.trip.length - added) + " 个之前就加过）" : "")
                : "这 " + pl.stops.length + " 个点已经在行程里了");
    return;
  }
  var inc = e.target.closest && e.target.closest("[data-incl-been]");
  if(inc){
    /* 把"去过"的纳回来 / 再跳过去：只影响这一次，不落盘——下次打开回到"跳过"的默认 */
    PLAN.includeBeen = inc.getAttribute("data-incl-been") === "1";
    PLAN.dirty = true;
    openPlan();
    return;
  }
  var b = e.target.closest && e.target.closest("[data-plan-page]");
  if(!b) return;
  var all = PLAN.allBuilt || [];
  if(!all.length) return;
  var per = 3, next = parseInt(b.getAttribute("data-plan-page"), 10) || 0;
  if(next*per >= all.length) next = 0;
  PLAN.page = next;
  PLAN.plans = all.slice(next*per, next*per + per);
  renderPlan();
});

function loadPlans(){
  PLAN.dirty = false;
  /* 条件变了（换周末/改车程）就回到第一批，否则会带着上一次的翻页深度看新结果 */
  PLAN.page = 0;
  PLAN.state="loading"; PLAN.err=""; renderPlan();
  buildPlans().then(function(list){
    PLAN.plans = list; PLAN.state="done";
    PLAN.at = Date.now();
    renderPlan();
  }).catch(function(e){
    PLAN.state="error"; PLAN.err=(e&&e.message)||"未知错误"; renderPlan();
  });
}

function planAgeMs(){ return PLAN.at ? (Date.now()-PLAN.at) : Infinity; }
/* 筛选条件变了，旧推荐就不成立了，必须重算——不能说"5 分钟内不算过期" */
function planStale(){ return PLAN.dirty || PLAN.state!=="done" || planAgeMs() > PLAN_TTL_MS; }

function openPlan(){
  el("plan-panel").classList.add("open");
  if(planStale()) loadPlans(); else renderPlan();
  /* 面板开着的时候每 5 分钟自动重查一次，天气变了不用手动点 */
  if(PLAN_TIMER) clearInterval(PLAN_TIMER);
  PLAN_TIMER = setInterval(function(){
    if(el("plan-panel").classList.contains("open")) loadPlans();
  }, PLAN_TTL_MS);
}

function closePlan(){
  el("plan-panel").classList.remove("open");
  if(PLAN_TIMER){ clearInterval(PLAN_TIMER); PLAN_TIMER=null; }
}

function setWeek(off){
  if(PLAN.weekOffset === off) return;
  PLAN.weekOffset = off;
  PLAN.state = "idle"; PLAN.plans = []; PLAN.at = 0;
  loadPlans();
}

/* 手机端两个视图：推荐（首屏）/ 地图。桌面端不受影响。 */
function setView(v){
  STATE.view = v;
  var sh = document.querySelector(".shell");
  if(sh) sh.setAttribute("data-view", v);
  Array.prototype.forEach.call(document.querySelectorAll("#viewtabs button"), function(b){
    b.classList.toggle("on", b.getAttribute("data-view") === v);
  });
  if(v === "map"){
    /* 地图刚从 display:none 出来，尺寸是 0，必须让它重算一次 */
    setTimeout(function(){
      if(!MAP) return;
      MAP.invalidateSize();
      /* 首次真正看到地图时才做自动取景（见上面的 autoFit 说明）。
         注意不能在这一步直接 fit：抽屉/视图切换时容器尺寸有过渡，
         40ms 时可能只有几十像素，fitBounds 会算出 zoom 11 落在大西北——
         实测就是这么把列表变成"地图范围内 0 个"的。等尺寸真的稳定再算。 */
      if(!STATE.autoFit && DATA && DATA.spots && DATA.spots.length) scheduleAutoFit();
      renderNear();     /* 地图有尺寸了才谈得上"视口内有哪些点" */
    }, 40);
  }else{
    if(planStale()) loadPlans(); else renderPlan();
  }
}

function bindPlan(){
  var b = el("plan-open"); if(b) b.addEventListener("click", openPlan);
  var c = el("plan-close"); if(c) c.addEventListener("click", closePlan);
  var vt = el("viewtabs");
  if(vt) vt.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    setView(b.getAttribute("data-view"));
  });
  var hr = el("home-refresh");
  if(hr) hr.addEventListener("click", function(){ loadPlans(); });
  var r = el("plan-refresh");
  if(r) r.addEventListener("click", function(){ loadPlans(); });
  var p = el("plan-panel");
  if(p) p.addEventListener("click", function(e){
    if(e.target===p){ closePlan(); return; }
    var wb = e.target.closest ? e.target.closest(".plan-weeks button") : null;
    if(wb){ setWeek(parseInt(wb.dataset.off,10)||0); return; }
    var li = e.target.closest ? e.target.closest(".plan-stop") : null;
    if(li && li.dataset.id){
      /* 记住"从本周推荐进来的"，详情页据此显示返回按钮（owner 反馈：进去以后出不来） */
      STATE.detailFromPlan = true;
      closePlan(); openDetail(li.dataset.id);
    }
  });
}


/* ───────── 启动 ───────── */
fetch("spots.json", {cache:"no-cache"})
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d;
    initOrigin();
    /* 恢复上次的筛选（要先于第一次 render，否则会先闪一下"全部点位"） */
    var hadSavedFilters = loadFilters();
    if(hadSavedFilters) paintFilterControls();
    buildOriginPanel();
    el("origin-line").onclick = openOriginPanel;
    initMap();
    bind();
    bindTrip();
    renderLegend();
    renderSceneBar();
    renderProvinceBar();
    bindLegend();
    scrollFade(el("filters"));
    scrollFade(el("legend"));
    bindPlan();
    STATE.trip = loadTrip();
    loadBeen();
    loadSharedTrip();        /* 带 ?trip= 的链接优先，且不静默覆盖已有行程 */
    renderTrip();
    /* 恢复的筛选要等所有 chip 都渲染出来之后再刷一次按下态，
       否则 bind()/renderXxxBar() 重建的按钮还是"没按"的样子（2026-11-23） */
    if(hadSavedFilters) syncFilterUI();
    render();
    /* 注册离线缓存（2026-11-23）：营地没信号也能打开，顺带让浏览器给「添加到主屏幕」。
       注册失败不影响任何功能，所以这里吞掉错误，只留一行日志。 */
    if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
      /* 直接注册，不要挂 window.onload —— 这段代码本身就在 load 之后才跑到
         （前面的 spots.json 要等网络回来），挂上去永远不会触发（2026-11-23 实测）。 */
      navigator.serviceWorker.register("sw.js").catch(function(e){
        if(window.console) console.info("离线缓存未启用：" + e.message);
      });
    }
    /* 加到主屏幕（2026-11-23）：这份地图最要紧的用法就是"山里没信号也能打开"，
       而"添加到主屏幕"是唯一能让它真离线可用的开关——可页面以前从来没提过。
       只在浏览器确实能装（Chrome/Edge 给了 beforeinstallprompt）或 iOS Safari
       （得手把手教路径）时才出现，关掉一次就永远不再提。 */
    scheduleInstallHint();
    /* 先要当前位置（静默，失败就停在默认基准，不打断） */
    setTimeout(autoLocate, 400);
    /* 视图选择（2026-11-23）：manifest 里的两个快捷方式写的正是 ?view=plan / ?view=map，
       但页面一直没人认这两个参数——长按图标点进去和直接打开一模一样。
       现在认了：带参数就听参数，没带则手机默认进推荐页。 */
    var viewParam = /[?&]view=(plan|map)/.exec(location.search);
    if(viewParam) setView(viewParam[1]);
    else if(window.matchMedia("(max-width:859px)").matches) setView("plan");
    /* 布局稳定后再算 fitBounds：立刻算会把容器尺寸算小，点位挤到屏幕外 */
    /* 首屏按车程取景（2026-11-21）：原来一进来 fitAll 把 1021 个点全塞进视野，
       打开就是内蒙古/宁夏，左边卡片全是"单程 6 小时 55 分"——
       跟"从上海出发过周末"这个定位完全对不上。默认先看 3 小时内的，全国让用户自己拉。 */
    setTimeout(function(){
      if(!d.spots.length) return;
      /* 地图此刻可能还是 display:none（手机默认停在"推荐"页），
         在 0×0 容器上 fitBounds 会算出一个横跨半个中国的视野。
         所以：能算就算，不能算就等切到地图页再算，只算一次。 */
      /* 只有桌面端此刻地图真的可见（≥860px 默认就在地图页）才在这里取景。
         手机上这里看到的"可用"是假的：容器 display:none 时 fitBounds 会在 0×0 上算，
         结果横跨半个中国——正好是这个 bug 的表现。手机交给 setView("map") 再算。 */
      if(window.matchMedia("(min-width:860px)").matches && mapUsable()){
        fitNear(d.spots);
        STATE.autoFit = true;
      }
    }, 80);
    window.addEventListener("resize", function(){ MAP.invalidateSize(); });
    window.addEventListener("orientationchange", function(){
      setTimeout(function(){ MAP.invalidateSize(); }, 260);
    });
    /* 深链接：#<id> 直接打开那个点，方便从聊天里点进来 */
    var deep = decodeURIComponent(location.hash.slice(1));
    if(deep && findSpot(deep)) openDetail(deep);
    window.addEventListener("hashchange", function(){
      var h = decodeURIComponent(location.hash.slice(1));
      if(h && findSpot(h)) openDetail(h);
    });
  })
  .catch(function(err){
    /* 2026-11-24：原来这里写的是"检查 spots.json 是否在同一目录"——那是给写代码的人看的，
       看页面的人（车上、营地、山里，信号一格）读了不知道该怎么办。改成能照做的一句话 +
       一个能点的按钮：reload 会重开连接，弱网下十次有八次就通了；装到桌面的还能直接用缓存起。 */
    console.error("点位数据没取到：", err);
    el("list").innerHTML =
      '<div class="empty">这会儿没取到点位数据' +
        '<div style="margin-top:6px;font-size:12.5px;opacity:.8">山里信号差很常见，点下面再试一次；' +
        '装到桌面的，断网也能打开。</div>' +
      '</div>' +
      '<div style="text-align:center;padding-bottom:20px">' +
        '<button class="btn ghost" id="retry-load" style="min-height:38px;height:38px">再试一次</button>' +
      '</div>';
    var rb = el("retry-load");
    if(rb) rb.onclick = function(){ location.reload(); };
  });
})();
</script>
</body>
</html>
