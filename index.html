/* ═════════════════ 本周推荐 ═════════════════
   出行窗口是固定的：**周五晚上出发、周日晚上回**，其他时间没空。
   所以这里不是"在 7 天里挑最好的天"，而是"这个周末去哪最合适"。

   三个输入都是真数据：
   1) 车程 / 犬政策 / 过夜 / 卫生间 —— 取 spots.json 里已核对的字段，有原话的连原话一起给。
   2) 站与站之间的距离 —— **只算直线**，我没有逐段跑过路网车程，写成"直线距离"不冒充车程。
   3) 天气 —— Open-Meteo 7 天预报，周五夜 / 周六 / 周日三天分别打分，原始数字照抄。
      取不到就说取不到。
   4) 排序 —— 周五夜先到能睡的点；周六在附近玩；周日玩完，**最后一站选离上海最近的**，
      免得玩完还要横穿半个省再回家。规则写在面板上。
*/
var WMO = {0:"晴",1:"晴间多云",2:"多云",3:"阴",45:"雾",48:"雾凇",51:"毛毛雨",53:"小雨",
  55:"中雨",56:"冻雨",57:"冻雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",
  71:"小雪",73:"中雪",75:"大雪",77:"米雪",80:"阵雨",81:"阵雨",82:"强阵雨",
  85:"阵雪",86:"强阵雪",95:"雷阵雨",96:"雷阵雨伴冰雹",99:"雷暴"};

var SEASON_WORDS = {
  "春":["樱花","油菜花","桃花","踏青","挖野菜","春笋","野餐"],
  "夏":["玩水","溯溪","游泳","避暑","荷花","桨板","皮划艇","淌水","下水"],
  "秋":["银杏","红叶","秋色","桂花","芦苇","粉黛","落叶","秋日"],
  "冬":["温泉","雪景","雾凇","围炉"]
};

/* ─── 一个地方值不值得去：看有多少人在发它 ───
   数据里没有"美不美"这个量，也不该由我编一个。能用的现成信号是热度和天气：
   1) pop   —— 按点名搜小红书，标题确实提到这个点的笔记数 + 累计赞。
               发的人越多、看的人越多，说明这地方越值得去。搜索样本是 20~39 张卡片，
               所以这个数是**下限**，不是全部。
   2) 天气  —— Open-Meteo 实时预报。
   两个信号都只用来排序，不摆在卡片上。 */
function popOf(s){
  var h = s.pop;
  if(!h || typeof h.notes !== "number") return null;
  return h;
}
/* 一个片区的热度取它**最热的那一站**的笔记数。
   不把几站加起来：同一批笔记可能同时提到相邻几个点，加起来就重复计数了。 */
function clusterPop(c){
  var got = c.spots.filter(function(s){ return popOf(s) != null; });
  if(!got.length) return null;
  got.sort(function(a,b){
    var pa = popOf(a), pb = popOf(b);
    if(pb.notes !== pa.notes) return pb.notes - pa.notes;
    return pb.likes - pa.likes;
  });
  return popOf(got[0]);
}

var DEPART_HOUR = 18;

var PLAN = { weekOffset:0, state:"idle", plans:[], err:"", fetchedAt:"", pool:0, window:null, at:0 };
/* 天气是实时数据，不能抓一次用到天荒地老。
   超过这个时长就重抓：预报本身也是每小时更新的。 */
var PLAN_TTL_MS = 5*60*1000;
var PLAN_TIMER = null;

function seasonOf(d){
  var m = d.getMonth()+1;
  return m>=3&&m<=5 ? "春" : m>=6&&m<=8 ? "夏" : m>=9&&m<=11 ? "秋" : "冬";
}

function isoDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* 周末：周五 / 周六 / 周日。offset=0 是这周末，1 下周末，2 再下周末 */
function thisWeekend(offset){
  var now = new Date();
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var add = (5 - d.getDay() + 7) % 7 + (offset||0)*7;
  var fri = new Date(d.getTime() + add*86400000);
  var sat = new Date(fri.getTime() + 86400000);
  var sun = new Date(sat.getTime() + 86400000);
  return { fri:isoDate(fri), sat:isoDate(sat), sun:isoDate(sun) };
}

function haversineKm(a,b){
  var R=6371, toR=Math.PI/180;
  var dLat=(b[1]-a[1])*toR, dLng=(b[0]-a[0])*toR;
  var la1=a[1]*toR, la2=b[1]*toR;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

function spotCoord(s){ var g=s.gcj; return (g&&g.length===2)?g:null; }
function spotH(s){ var d=s.drive||{}; return typeof d.hours_oneway==="number"?d.hours_oneway:null; }
function sleepKind(s){
  var k = nightKey(s);
  return (k==="allowed_wild"||k==="official_camp"||k==="lodging") ? k : null;
}

function firstQuote(txt){
  var m = String(txt||"").match(/「([^」]{8,70})」/);
  return m ? m[1] : "";
}

function scoreSpot(s, season){
  var sc = 0, why = [];
  var dog = s.dog||{}, on = s.overnight||{}, fac = on.facilities||{};
  if(spotH(s)==null) return null;

  if(dog.policy==="allowed"){ sc+=3; why.push({t:"笔记写明可带狗", s:"犬政策"}); }
  if(dog.policy==="forbidden"){ sc-=20; }

  var ev = on.evidence||[];
  if(ev.length){ sc+=3; why.push({t:"过夜有笔记原话", s:"过夜"}); }
  if(fac.toilet===true){ sc+=1; why.push({t:"写明有卫生间", s:"设施"}); }
  if((s.photos||[]).length){ sc+=1; why.push({t:"有实拍图 "+s.photos.length+" 张", s:"图"}); }

  var text = String(dog.evidence||"") + " " +
             ev.map(function(e){ return String(e&&e.quote||""); }).join(" ");
  var hit = (SEASON_WORDS[season]||[]).filter(function(w){ return text.indexOf(w)>=0; })[0];
  if(hit){ sc+=2; why.push({t:"原话提到「"+hit+"」，"+season+"季正合适", s:"笔记"}); }

  sc -= Math.max(0, spotH(s)-1.5) * 0.7;
  return { score:sc, why:why };
}

function clusterSpots(list, km){
  var cs = [];
  list.forEach(function(s){
    var c = spotCoord(s); if(!c) return;
    for(var i=0;i<cs.length;i++){
      if(haversineKm(cs[i].centroid, c) <= km){
        var g = cs[i]; g.spots.push(s);
        g.sum[0]+=c[0]; g.sum[1]+=c[1];
        g.centroid=[g.sum[0]/g.spots.length, g.sum[1]/g.spots.length];
        return;
      }
    }
    cs.push({ centroid:[c[0],c[1]], sum:[c[0],c[1]], spots:[s] });
  });
  return cs;
}

/* 只写城市会撞名：两条路线都叫"上海一带"，看不出区别。
   所以用"城市 · 代表点位"——代表点位取这条线里分值最高的那一站。 */
function clusterName(stops){
  var cnt={}, best="", n=0;
  stops.forEach(function(s){
    var k=s.city||s.province||"";
    if(!k) return; cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]>n){ n=cnt[k]; best=k; }
  });
  /* 代表点位：优先"能玩且有评分的"，酒店/营地不当门面；
     名字和分数必须来自同一个点，否则会出现卡片叫 A、分数是 B 的。 */
  var plays = stops.filter(function(x){ return !sleepKind(x) && x.kind!=="lodging" && popOf(x)!=null; });
  var pool = plays.length ? plays : stops.filter(function(x){ return popOf(x)!=null; });
  var top = (pool.length ? pool : stops).slice().sort(function(a,b){
    var pa = popOf(a), pb = popOf(b);
    if(!pb) return -1; if(!pa) return 1;
    return (pb.notes - pa.notes) || (pb.likes - pa.likes);
  })[0];
  var base = best ? best.replace(/市$/,"") : "未命名";
  if(!top) return base + "一带";
  /* "上海 · 上海东滩湿地公园" 这种重复前缀要去掉 */
  var nm = top.name;
  if(base && nm.indexOf(base)===0) nm = nm.slice(base.length);
  return base + " · " + nm.slice(0,10);
}

/* 从起点出发，每次走直线最近的一站 */
function nearestChain(start, pool, max){
  var out=[], cur=start, left=pool.slice();
  while(left.length && out.length<max){
    var cc = spotCoord(cur), bi=0, bd=1e9;
    for(var i=0;i<left.length;i++){
      var pc = spotCoord(left[i]);
      if(!pc || !cc) continue;
      var d = haversineKm(cc, pc);
      if(d<bd){ bd=d; bi=i; }
    }
    cur = left.splice(bi,1)[0];
    out.push(cur);
  }
  return out;
}

function weatherScore(tmax, tmin, pop){
  var mid=(tmax+tmin)/2, s=100;
  s -= Math.min(60, pop*0.9);
  if(mid<0) s-=45; else if(mid<8) s-=25; else if(mid<14) s-=8;
  else if(mid<=24) s+=0; else if(mid<=29) s-=10; else s-=25;
  return Math.round(s);
}

function fetchWeek(c){
  var u = "https://api.open-meteo.com/v1/forecast?latitude="+c[1].toFixed(4)+
          "&longitude="+c[0].toFixed(4)+
          "&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m"+
          "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
          "&timezone=Asia%2FShanghai&forecast_days=16";
  return fetch(u).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
}

function dayOf(w, iso){
  var d=(w&&w.daily)||{}, times=d.time||[], i=times.indexOf(iso);
  if(i<0) return null;
  var pop = d.precipitation_probability_max[i]; if(pop==null) pop=0;
  return { date:iso, code:d.weather_code[i],
           tmax:d.temperature_2m_max[i], tmin:d.temperature_2m_min[i], pop:pop,
           score:weatherScore(d.temperature_2m_max[i], d.temperature_2m_min[i], pop) };
}

function md(iso){ var p=String(iso||"").split("-"); return p.length===3 ? (parseInt(p[1],10)+"/"+parseInt(p[2],10)) : iso; }
function wd(iso){ return ["日","一","二","三","四","五","六"][new Date(iso+"T00:00:00").getDay()]; }
function clock(hoursFloat){
  var t = DEPART_HOUR*60 + Math.round(hoursFloat*60);
  var hh = Math.floor(t/60)%24, mm = t%60;
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

/* ─── 组路线 ───
   排序只看两样：**景色**和**天气**。
   证据（可带狗/有原话/有厕所/有图）只用来当理由展示和选"睡哪"，
   不再参与排序——证据多只说明被记录得多，不说明好看。 */
function clusterScene(c){
  /* 片区好不好，看它**最热的那一站**；全片区都没热度数据就返回 null，
     不当成 0，那样会跟"真的没人发"混为一谈。 */
  var p = clusterPop(c);
  return p ? p.notes : null;
}

function buildPlans(){
  var season = seasonOf(new Date());
  var wk = thisWeekend(PLAN.weekOffset);
  PLAN.window = wk;
  var lim = STATE.hours;

  var pool = DATA.spots.filter(function(s){
    var h = spotH(s);
    if(h==null || h>lim) return false;
    if(spotCoord(s)==null) return false;
    if(((s.dog||{}).policy)==="forbidden") return false;
    if(s.kind==="transit") return false;
    if(/码头|停车场|公交|地铁|客运站|收费站|服务区|执法/.test(s.name)) return false;
    return true;
  });
  pool.forEach(function(s){
    s.__p = scoreSpot(s, season) || { score:0, why:[] };
    s.__pop = popOf(s);
  });
  PLAN.pool = pool.length;
  PLAN.hot = pool.filter(function(s){ return popOf(s) != null; }).length;

  var clusters = clusterSpots(pool, 35).filter(function(c){ return c.spots.length>=3; });
  clusters.forEach(function(c){
    /* 睡哪、玩哪都按景色挑：露营地好不好看也是体验的一部分 */
    /* 睡哪、玩哪都按热度挑；没热度数据的排后面，但不剔除 */
    function byRating(a,b){
      var pa = popOf(a), pb = popOf(b);
      if(pa == null && pb == null) return 0;
      if(pa == null) return 1;
      if(pb == null) return -1;
      if(pb.notes !== pa.notes) return pb.notes - pa.notes;
      return pb.likes - pa.likes;
    }
    c.sleeps = c.spots.filter(sleepKind).sort(byRating);
    c.plays  = c.spots.filter(function(s){ return !sleepKind(s) && s.kind!=="lodging"; }).sort(byRating);
    c.maxH = Math.max.apply(null, c.spots.map(spotH));
    c.scene = clusterScene(c);
  });

  /* 先按景色挑出候选片区，天气等查完再一起排 */
  var ov = clusters.filter(function(c){ return c.sleeps.length && c.maxH<=4.5 && c.maxH>=1.0; })
                   .sort(function(a,b){ return b.scene-a.scene; }).slice(0,6);
  var dt = clusters.filter(function(c){ return c.maxH<=2.5 && c.plays.length>=2; })
                   .sort(function(a,b){ return b.scene-a.scene; }).slice(0,6);
  var seen = [];
  ov.concat(dt).forEach(function(c){ if(seen.indexOf(c)<0) seen.push(c); });
  var shortlist = seen.sort(function(a,b){
    if(a.scene == null && b.scene == null) return 0;
    if(a.scene == null) return 1;
    if(b.scene == null) return -1;
    return b.scene - a.scene;
  }).slice(0,8);

  var i = 0;
  function next(){
    if(i>=shortlist.length) return Promise.resolve();
    var c = shortlist[i++];
    return fetchWeek(c.centroid).then(function(w){
      c.now = w.current || null;
      c.wFri = dayOf(w, wk.fri); c.wSat = dayOf(w, wk.sat); c.wSun = dayOf(w, wk.sun);
      c.weatherOk = !!c.wSat;
    }).catch(function(e){
      c.now=null; c.wFri=c.wSat=c.wSun=null; c.weatherOk=false;
      c.weatherErr = (e&&e.message)||"取不到";
    }).then(next);
  }

  return next().then(function(){
    /* 综合分 = 景色 × 天气。天气好但景色一般，和景色好但天气一般，会拉平到一起比。
       天气取不到就按 0.4 的保底系数，不让"查不到"变成"直接淘汰"。 */
    shortlist.forEach(function(c){
      var w = c.wSat ? c.wSat.score : null;
      c.weather = w;
      /* 综合 = 这个片区最热那站的笔记数 × 天气/100。两个都是实数，不合成虚分。 */
      var base = c.scene != null ? c.scene : 0;
      c.combo = Math.round(base * (w!=null ? w/100 : 0.4) * 100) / 100;
    });
    shortlist.sort(function(a,b){ return b.combo-a.combo; });

    function kindOf(c){
      return (c.sleeps.length && c.maxH<=4.5 && c.maxH>=1.0) ? "两晚三天" : "周六来回";
    }
    /* 先把每条候选路线真的组出来，再用**这条路线自己的站**算评分——
       用整个片区的最高分会出现"显示 4.6、综合按 4.9 算"的不一致。 */
    var built = shortlist.map(function(c){
      var pl = composePlan(kindOf(c), c, wk, season);
      /* 只用"能玩的站"算评分：酒店 4.9 说明住得好，不说明这趟好玩，
         而且卡片标题本来就是挑能玩的站当门面，两边必须同一个口径。 */
      var ps = pl.stops.map(function(x){ return popOf(x.s); }).filter(function(x){ return x; });
      ps.sort(function(a,b){ return (b.notes-a.notes) || (b.likes-a.likes); });
      pl.pop = ps.length ? ps[0] : null;
      pl.weather = c.weather;
      var base2 = pl.pop ? pl.pop.notes : 0;
      pl.combo = Math.round(base2 * (c.weather!=null ? c.weather/100 : 0.4) * 100) / 100;
      pl.wFri = c.wFri; pl.wSat = c.wSat; pl.wSun = c.wSun; pl.now = c.now;
      pl.weatherOk = c.weatherOk; pl.weatherErr = c.weatherErr;
      return pl;
    });
    built.sort(function(a,b){ return b.combo - a.combo; });
    var picks = built.slice(0,3);
    PLAN.fetchedAt = new Date().toLocaleString("zh-CN", {hour12:false});
    return picks;
  });
}

/* 组一条具体路线 */
function composePlan(kind, c, wk, season){
  var sleep = c.sleeps[0] || null;
  var stops = [], legs = [];

  if(kind==="两晚三天"){
    stops.push({ s:sleep, day:0 });
    var plays = c.plays.filter(function(s){ return s!==sleep; });
    var d1 = nearestChain(sleep, plays.slice(0,5), 2);
    d1.forEach(function(s){ stops.push({ s:s, day:1 }); });
    var rest = plays.filter(function(s){ return d1.indexOf(s)<0; });
    if(rest.length){
      var home = (DATA.meta&&DATA.meta.origin&&DATA.meta.origin.gcj) || [121.473701,31.230416];
      var prevC = spotCoord(stops[stops.length-1].s);
      var last = rest.slice().sort(function(a,b){
        var ca=spotCoord(a), cb=spotCoord(b);
        var da = (prevC&&ca) ? haversineKm(prevC,ca)+haversineKm(ca,home) : spotH(a)*80;
        var db = (prevC&&cb) ? haversineKm(prevC,cb)+haversineKm(cb,home) : spotH(b)*80;
        return da-db;
      })[0];
      var mid = nearestChain(stops[stops.length-1].s, rest.filter(function(s){ return s!==last; }), 1);
      mid.forEach(function(s){ stops.push({ s:s, day:2 }); });
      stops.push({ s:last, day:2 });
    }
  } else {
    var start = c.plays[0] || c.spots[0];
    var chain = [start].concat(nearestChain(start, c.plays.filter(function(s){ return s!==start; }).slice(0,6), 2));
    chain.forEach(function(s){ stops.push({ s:s, day:1 }); });
  }

  for(var i=1;i<stops.length;i++){
    var a=spotCoord(stops[i-1].s), b=spotCoord(stops[i].s);
    legs.push(a&&b ? haversineKm(a,b) : null);
  }

  var maxH = Math.max.apply(null, stops.map(function(x){ return spotH(x.s); }));
  return {
    kind:kind, season:season, stops:stops, legs:legs, maxH:maxH,
    sleepIdx: stops.findIndex(function(x){ return x.day===0; }),
    centroid: c.centroid,
    name: clusterName(stops.map(function(x){ return x.s; }))
  };
}

/* ─── 渲染 ─── */
function planStopHTML(s, leg, dayLabel){
  var p = s.__p || {why:[]};
  var meta = "单程 " + hm(spotH(s));
  if(leg!=null) meta += " · 与上一站直线 " + leg.toFixed(1) + "km";
  return '<li class="plan-stop" data-id="'+esc(s.id)+'">' +
      (dayLabel ? '<div class="plan-daymark">'+esc(dayLabel)+'</div>' : '') +
      '<div class="ps-name">'+esc(s.name)+'</div>' +
      '<div class="ps-meta">'+esc(meta)+'</div>' +
      (p.why.length ? '<div class="ps-why">'+p.why.slice(0,3).map(function(w){
          return '<span>'+esc(w.t)+'<i>· '+esc(w.s)+'</i></span>';
        }).join("")+'</div>' : '') +
    '</li>';
}

function wdayHTML(d, label){
  if(!d) return '<div class="pw-day pw-bad"><i>'+esc(label)+'</i><b>无</b><s>—</s></div>';
  var cls = d.score>=70 ? "pw-good" : d.score>=45 ? "pw-mid" : "pw-bad";
  return '<div class="pw-day '+cls+'"><i>'+esc(label)+' '+md(d.date)+'</i>'+
    '<b>'+Math.round(d.pop)+'%</b><s>'+Math.round(d.tmin)+'~'+Math.round(d.tmax)+'°</s></div>';
}

function planCardHTML(p, idx, quiet){
  var head = '<div class="plan-head"><span class="plan-tag '+
    (p.kind==="两晚三天"?"pt-2d":"pt-1d")+'">'+esc(p.kind)+'</span>'+
    '<h4>'+(idx+1)+'. '+esc(p.name)+'</h4>'+
    '<span class="plan-maxh">最远单程 '+esc(hm(p.maxH))+'</span></div>';

  var weather;
  if(p.weatherOk){
    var bad = (p.wSat && p.wSat.score<45) || (p.wSun && p.wSun.score<45);
    /* 实时天气：抓取那一刻这个片区实际是多少度、体感多少、有没有在下雨 */
    var nowHTML = '';
    if(p.now && p.now.temperature_2m!=null){
      nowHTML = '<div class="plan-now">现在 '+Math.round(p.now.temperature_2m)+
        '℃（体感 '+Math.round(p.now.apparent_temperature)+'℃）'+
        ' · '+esc(WMO[p.now.weather_code]||"—")+
        ' · 风 '+Math.round(p.now.wind_speed_10m)+'km/h'+
        (p.now.precipitation>0 ? ' · 正在下 '+p.now.precipitation+'mm' : '')+
        '<i>Open-Meteo '+esc(String(p.now.time||"").slice(11,16))+' 实测</i></div>';
    }
    weather = nowHTML + '<div class="plan-week">' +
        wdayHTML(p.wFri, "周五夜") + wdayHTML(p.wSat, "周六") + wdayHTML(p.wSun, "周日") +
      '</div>' +
      (bad && !quiet ? '<div class="plan-warn">这周末的天气不适合出门（上面对比着看）。硬要去就带好雨具，营地注意积水。</div>' : '');
  } else {
    weather = '<div class="plan-warn">天气没取到（'+esc(p.weatherErr||"网络不可用")+
      '）—— 出发前自己看一眼预报，别按这条定日子。</div>';
  }

  /* 「跨度」原来是各段距离求和，语义就错了：两站 1.4km 相加仍是 1.4，
     toFixed(0) 又变成"约 1km"，和下面显示的 1.4km 自相矛盾。
     跨度 = 任意两站之间的最远直线距离，才配叫跨度。 */
  var spanTxt = "";
  if(p.stops.length>1){
    var mx=0, ca, cb;
    for(var si=0;si<p.stops.length;si++){
      for(var sj=si+1;sj<p.stops.length;sj++){
        ca=spotCoord(p.stops[si].s); cb=spotCoord(p.stops[sj].s);
        var d=(ca&&cb)?haversineKm(ca,cb):null;
        if(d!=null&&d>mx) mx=d;
      }
    }
    if(mx>0) spanTxt = "站与站最远直线 " + mx.toFixed(1) + "km（不是车程）";
  }

  var body;
  if(p.kind==="两晚三天" && p.sleepIdx>=0){
    var sp = p.stops[p.sleepIdx].s;
    var q = ((sp.overnight||{}).evidence||[])[0];
    body =
      p.stops.map(function(x,i){
        var label = i===0 ? "周五晚 · "+clock(spotH(x.s))+" 到（"+DEPART_HOUR+":00 出发）"
                  : (x.day===1 ? (p.stops[i-1].day!==1 ? "周六" : "") : (p.stops[i-1].day!==2 ? "周日（玩完直接回上海）" : ""));
        return planStopHTML(x.s, i===0?null:p.legs[i-1], label);
      }).join("") +
      '<div class="plan-line"><b>过夜</b>周五、周六两晚都睡「'+esc(sp.name)+'」'+esc(NIGHT_LABEL[nightKey(sp)][0])+
        (q ? '，原话：「'+esc(String(q.quote||"").slice(0,40))+'」' : '，这一步没有笔记原话，属人工判断')+'。</div>' +
      '<div class="plan-line"><b>怎么走</b>周五夜直接到睡的地方；周六在附近玩；周日玩完，'+
        '最后一站特意挑离上海最近的那个'+(spanTxt?'，'+esc(spanTxt):'')+'。</div>';
  } else {
    body = p.stops.map(function(x,i){
        return planStopHTML(x.s, i===0?null:p.legs[i-1], i===0 ? "周六早上出发" : "");
      }).join("") +
      '<div class="plan-line"><b>怎么走</b>周六一早出发，一天玩这 '+p.stops.length+' 站，晚上回上海'+
        (spanTxt?'，'+esc(spanTxt):'')+'。</div>' +
      (PLAN.plans.some(function(q){ return q.kind==='两晚三天'; })
        ? '<div class="plan-line"><b>过夜</b>当天来回，不用带帐篷。想住一晚的话看上面那条两晚的。</div>'
        : '<div class="plan-line"><b>过夜</b>当天来回，不用带帐篷。</div>');
  }

  var anySeason = p.stops.some(function(x){
    return (x.s.__p.why||[]).some(function(w){ return w.s==="笔记"; });
  });

  return '<div class="plan-card">' + head + weather +
    '<details class="stops-d" open><summary>路线 · '+p.stops.length+' 个点'+
      (spanTxt ? ' · '+esc(spanTxt) : '')+'</summary><div class="sd-body">' +
    '<ol class="plan-stops">' + body + '</ol>' +
    '<div class="plan-line"><b>季节</b>现在是'+p.season+'季，'+
      (anySeason ? '上面有点位的原话提到了当季景象。' : '笔记里没有明确的季节描述，这里不硬编。')+'</div>' +
    '</div></details>' +
  '</div>';
}

/* 数据多旧了，直接说人话 */
function planAgeText(){
  if(!PLAN.at) return "还没查过";
  var s = Math.round((Date.now()-PLAN.at)/1000);
  if(s < 60) return "刚刚";
  if(s < 3600) return Math.round(s/60)+" 分钟前";
  return Math.round(s/3600)+" 小时前";
}

function weekBarHTML(){
  var names = ["这周末", "下周末", "再下周末"];
  var out = '<div class="plan-weeks">';
  for(var i=0;i<3;i++){
    var w = thisWeekend(i);
    /* 手机上三个按钮要挤在一行：日期只留"月/日–日"，省掉后面重复的月份 */
    var endDay = String(w.sun).slice(-2).replace(/^0/,"");
    var span = md(w.fri) + "–" + endDay;
    out += '<button class="pw'+(PLAN.weekOffset===i?' on':'')+'" data-off="'+i+'">'+
           names[i]+'<i>'+span+'</i></button>';
  }
  return out + '</div>';
}

/* 同一份内容要出现在两个地方：桌面的弹层、手机的首屏。
   所以先算成字符串，再分别塞进去，避免两套逻辑各说各话。 */
function planBodyHTML(){
  if(PLAN.state==="loading" && !PLAN.plans.length)
    return weekBarHTML() + '<div class="plan-loading">正在取天气、算路线…</div>';
  if(PLAN.err)
    return weekBarHTML() + '<div class="plan-loading">没能生成推荐：'+esc(PLAN.err)+'</div>';
  if(!PLAN.plans.length)
    return weekBarHTML() + '<div class="plan-loading">当前范围内凑不出 3 个点以上的片区。</div>';

  var sat = PLAN.plans.map(function(p){ return p.weatherOk&&p.wSat ? p.wSat.score : null; })
                     .filter(function(x){ return x!=null; });
  var allBad = sat.length && Math.max.apply(null, sat) < 50;
  var head = (allBad ? '<div class="plan-warn" style="margin-bottom:12px">'+
      '周六几个片区降水都在 '+Math.min.apply(null, PLAN.plans.filter(function(p){return p.wSat;})
        .map(function(p){ return Math.round(p.wSat.pop); }))+'% 以上，这周不建议出发。</div>' : '') +
      ((!sat.length && PLAN.weekOffset>0)
        ? '<div class="plan-warn" style="margin-bottom:12px">'+
          '这个周末超出了天气预报的范围（Open-Meteo 最多给 16 天），<b>还没出预报</b>。'+
          '所以下面的排序只按"这地方有多热"，天气这一项没有参与。</div>' : '') +
      '<details class="plan-note">' +
      '<summary>窗口 <b>周五 '+DEPART_HOUR+':00 出发 · 周日晚回</b> · 候选 '+PLAN.pool+' 个点 · 排序＝热度×天气</summary>' +
      '<div class="pn-body">' +
      '候选点 = 单程 ≤'+STATE.hours.toFixed(1)+'h、排除明确禁狗，共 '+PLAN.pool+' 个。' +
      '天气每次打开都重新查（Open-Meteo 实时预报），这次抓取于 '+esc(PLAN.fetchedAt)+
      (PLAN.at ? '（'+planAgeText()+'）' : '')+'。' +
      '车程是真实路网算的；<b>站与站之间只给直线距离，不是车程</b>。<br>' +
      '<b>排序只看两样：这地方现在有多热、去的那天天气怎么样</b>。' +
      '"热"是指小红书上这段时间有多少人在发这个地方——发的人越多、看的人越多，说明越值得去；' +
      '天气取周六的实时预报。犬政策、有没有原话、有没有厕所只用来当理由和挑营地，不参与排序。' +
      '</div></details>';

  /* 顶部已经统一说过"这周不建议出发"时，卡片里就不再重复同一句话 */
  return weekBarHTML() + head + PLAN.plans.map(function(p, i){ return planCardHTML(p, i, allBad); }).join("") +
    (PLAN.state==="loading" ? '<div class="plan-refreshing">正在重新查天气…（下面是 '+planAgeText()+' 的数据）</div>' : '') +
    '<div class="plan-foot">降水% 越低越好；出行指数 = 100 − 降水概率×0.9 − 体感温度惩罚（&lt;0℃ 扣 45、&lt;8℃ 扣 25、&lt;14℃ 扣 8、&gt;29℃ 扣 25）。权重写在这里，你可以不认同。</div>';
}

function paintPlanBox(box, html){
  if(!box) return;
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll(".plan-week"), scrollFade);
  var wide = window.matchMedia("(min-width:860px)").matches;
  var pn = box.querySelector(".plan-note");
  /* 手机上默认收起：不收起时第一屏全被说明文字占满，看不到路线 */
  if(pn) pn.open = wide;
  Array.prototype.forEach.call(box.querySelectorAll(".stops-d"), function(d){ d.open = wide; });
  box.scrollTop = 0;
}

function renderPlan(){
  var html = planBodyHTML();
  paintPlanBox(el("plan-body"), html);
  paintPlanBox(el("home-body"), html);

  var w = PLAN.window || {};
  var line = (w.fri ? (md(w.fri)+"–"+md(w.sun)+" · ") : "") +
             (PLAN.plans.length ? PLAN.plans.length + " 条路线" : "正在算");
  if(el("plan-sub")) el("plan-sub").textContent = line;
  if(el("home-sub")) el("home-sub").textContent = line;
}

function loadPlans(){
  PLAN.dirty = false;
  PLAN.state="loading"; PLAN.err=""; renderPlan();
  buildPlans().then(function(list){
    PLAN.plans = list; PLAN.state="done";
    PLAN.at = Date.now();
    renderPlan();
  }).catch(function(e){
    PLAN.state="error"; PLAN.err=(e&&e.message)||"未知错误"; renderPlan();
  });
}

function planAgeMs(){ return PLAN.at ? (Date.now()-PLAN.at) : Infinity; }
/* 筛选条件变了，旧推荐就不成立了，必须重算——不能说"5 分钟内不算过期" */
function planStale(){ return PLAN.dirty || PLAN.state!=="done" || planAgeMs() > PLAN_TTL_MS; }

function openPlan(){
  el("plan-panel").classList.add("open");
  if(planStale()) loadPlans(); else renderPlan();
  /* 面板开着的时候每 5 分钟自动重查一次，天气变了不用手动点 */
  if(PLAN_TIMER) clearInterval(PLAN_TIMER);
  PLAN_TIMER = setInterval(function(){
    if(el("plan-panel").classList.contains("open")) loadPlans();
  }, PLAN_TTL_MS);
}

function closePlan(){
  el("plan-panel").classList.remove("open");
  if(PLAN_TIMER){ clearInterval(PLAN_TIMER); PLAN_TIMER=null; }
}

function setWeek(off){
  if(PLAN.weekOffset === off) return;
  PLAN.weekOffset = off;
  PLAN.state = "idle"; PLAN.plans = []; PLAN.at = 0;
  loadPlans();
}

/* 手机端两个视图：推荐（首屏）/ 地图。桌面端不受影响。 */
function setView(v){
  STATE.view = v;
  var sh = document.querySelector(".shell");
  if(sh) sh.setAttribute("data-view", v);
  Array.prototype.forEach.call(document.querySelectorAll("#viewtabs button"), function(b){
    b.classList.toggle("on", b.getAttribute("data-view") === v);
  });
  if(v === "map"){
    /* 地图刚从 display:none 出来，尺寸是 0，必须让它重算一次 */
    setTimeout(function(){ if(MAP) MAP.invalidateSize(); }, 40);
  }else{
    if(planStale()) loadPlans(); else renderPlan();
  }
}

function bindPlan(){
  var b = el("plan-open"); if(b) b.addEventListener("click", openPlan);
  var c = el("plan-close"); if(c) c.addEventListener("click", closePlan);
  var vt = el("viewtabs");
  if(vt) vt.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    setView(b.getAttribute("data-view"));
  });
  var hr = el("home-refresh");
  if(hr) hr.addEventListener("click", function(){ loadPlans(); });
  var r = el("plan-refresh");
  if(r) r.addEventListener("click", function(){ loadPlans(); });
  var p = el("plan-panel");
  if(p) p.addEventListener("click", function(e){
    if(e.target===p){ closePlan(); return; }
    var wb = e.target.closest ? e.target.closest(".plan-weeks button") : null;
    if(wb){ setWeek(parseInt(wb.dataset.off,10)||0); return; }
    var li = e.target.closest ? e.target.closest(".plan-stop") : null;
    if(li && li.dataset.id){ closePlan(); openDetail(li.dataset.id); }
  });
}


/* ───────── 启动 ───────── */
fetch("spots.json", {cache:"no-cache"})
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d;
    el("origin-line").textContent = "从" + d.meta.origin.name + "出发 · 单程上限可调";
    initMap();
    bind();
    bindTrip();
    renderLegend();
    renderSceneBar();
    bindLegend();
    scrollFade(el("filters"));
    scrollFade(el("legend"));
    bindPlan();
    STATE.trip = loadTrip();
    renderTrip();
    render();
    /* 手机打开就是推荐页，不用点"本周推荐" */
    if(window.matchMedia("(max-width:859px)").matches) setView("plan");
    /* 布局稳定后再算 fitBounds：立刻算会把容器尺寸算小，点位挤到屏幕外 */
    setTimeout(function(){ if(d.spots.length) fitAll(d.spots); }, 80);
    window.addEventListener("resize", function(){ MAP.invalidateSize(); });
    window.addEventListener("orientationchange", function(){
      setTimeout(function(){ MAP.invalidateSize(); }, 260);
    });
    /* 深链接：#<id> 直接打开那个点，方便从聊天里点进来 */
    var deep = decodeURIComponent(location.hash.slice(1));
    if(deep && findSpot(deep)) openDetail(deep);
    window.addEventListener("hashchange", function(){
      var h = decodeURIComponent(location.hash.slice(1));
      if(h && findSpot(h)) openDetail(h);
    });
  })
  .catch(function(err){
    el("list").innerHTML = '<div class="empty">数据加载失败：'+esc(err.message)+
      '<br>检查 spots.json 是否在同一目录。</div>';
  });
})();
</script>
</body>
</html>
