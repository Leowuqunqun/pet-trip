<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="带狗去哪儿">
<meta name="theme-color" content="#FBF6EF">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<title>带狗去哪儿 · 江浙沪皖</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --paper:#FBF6EF; --paper-2:#FFFDF9; --card:#FFFFFF;
  --ink:#2A2018; --ink-2:#6A5949; --ink-3:#9C8A76;
  --line:#EFE5D7; --line-2:#E0D2BF;
  --terra:#B85C38; --terra-2:#9A482A; --terra-soft:#F8E8DF;
  --amber:#D99127; --amber-soft:#FBEED3; --amber-ink:#8A5A06;
  --green:#2E7D53; --green-soft:#E3F1E7;
  --slate:#57687A; --slate-soft:#E9EEF4;
  --rose:#B4646B; --rose-soft:#F7E6E7;
  --r-s:12px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(74,50,28,.05);
  --sh-2:0 2px 10px rgba(74,50,28,.06),0 1px 2px rgba(74,50,28,.04);
  --sh-3:0 16px 34px -14px rgba(74,50,28,.26),0 2px 8px rgba(74,50,28,.06);
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
    "Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --font-display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",
    Georgia,-apple-system,serif;
  --ease:cubic-bezier(.2,.7,.3,1);
  --pad-l:calc(16px + env(safe-area-inset-left,0px));
  --pad-r:calc(16px + env(safe-area-inset-right,0px));
  --topbar-h:0px;
}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
a{color:var(--terra);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.005em}

/* ══════════ 顶栏 ══════════ */
.topbar{
  position:relative;z-index:900;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad-r) 0 var(--pad-l);
  border-bottom:1px solid var(--line);
}
.brandrow{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
  color:var(--terra);background:linear-gradient(155deg,#FCE6CE,#F6D2AC);
  border:1px solid #F1DDC3;box-shadow:var(--sh-1);
}
.brand-mark svg{width:18px;height:18px;fill:currentColor}
.brand-txt{flex:1;min-width:0}
.brand-name{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:1px}
.count-pill{
  flex:none;font-size:12px;font-variant-numeric:tabular-nums;
  padding:4px 10px;border-radius:999px;background:var(--terra-soft);
  color:var(--terra-2);font-weight:600;border:1px solid #F1DDC3;
}

/* ══════════ 筛选条 ══════════ */
.filters{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:10px 0 11px;margin:0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l));
  padding-left:var(--pad-l);padding-right:var(--pad-r);
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 13px;border-radius:999px;
  background:var(--paper-2);border:1px solid var(--line-2);
  font-size:13.5px;color:var(--ink-2);white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease);
}
.chip:active{transform:scale(.97)}
.more-note{padding:16px 14px 22px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.7;border-top:1px dashed var(--line);}
.chip[aria-pressed="true"]{
  background:var(--ink);border-color:var(--ink);color:#FFF9F2;font-weight:500;
}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip-wrap{
  flex:none;display:flex;align-items:center;height:34px;padding:0 12px;
  border-radius:999px;background:var(--paper-2);border:1px solid var(--line-2);
  font-size:13.5px;color:var(--ink-2);gap:8px;white-space:nowrap;
}
.chip-wrap input[type=range]{
  -webkit-appearance:none;appearance:none;width:96px;height:3px;border-radius:2px;
  background:var(--line-2);outline:none;
}
.chip-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--terra);border:2px solid #FFF;box-shadow:var(--sh-2);cursor:pointer;
}
.chip-wrap b{color:var(--terra-2);font-variant-numeric:tabular-nums;font-weight:600}

/* ══════════ 主体：地图 + 列表 ══════════ */
.stage{position:absolute;inset:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:#EDE6DA;z-index:1}
.leaflet-container{font:inherit;background:#EDE6DA}
.leaflet-control-attribution{font-size:9px!important;background:rgba(251,246,239,.88)!important;
  padding:1px 5px!important;border-radius:6px 0 0 0}
.leaflet-bar a{background:var(--card)!important;color:var(--ink-2)!important;border-color:var(--line-2)!important}
.leaflet-bar a:hover{background:var(--paper-2)!important;color:var(--terra)!important}
.leaflet-popup-content-wrapper{
  border-radius:var(--r-m);box-shadow:var(--sh-3);background:var(--card);
  border:1px solid var(--line);
}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.55}
.leaflet-popup-tip{background:var(--card);border:1px solid var(--line)}
/* 聚合气泡 —— 覆盖 markercluster 默认蓝色 */
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(184,92,56,.18)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
  background:var(--terra)!important;color:#FFF9F2!important;
  font-family:var(--font-sans)!important;font-weight:700!important;
  box-shadow:0 2px 9px rgba(50,34,20,.3)!important;
}
.pop-t{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0 0 5px}
.pop-row{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12.5px}
.pop-row+.pop-row{margin-top:3px}

/* 地图标记 */
.pin{
  display:grid;place-items:center;width:100%;height:100%;
  border-radius:50%;border:2px solid #FFF;
  box-shadow:0 2px 8px rgba(50,34,20,.28);
}
.pin svg{width:14px;height:14px;display:block}
.pin-lg{box-shadow:0 3px 12px rgba(46,125,83,.45)}
.pin-lg svg{width:17px;height:17px}

/* ══════════ 底部列表（移动端抽屉式） ══════════ */
.sheet{
  position:relative;z-index:400;flex:none;
  background:var(--paper);border-top:1px solid var(--line);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -8px 28px -18px rgba(74,50,28,.4);
  max-height:38vh;display:flex;flex-direction:column;
  transition:max-height .3s var(--ease);
}
.sheet.expanded{max-height:82vh}
.grab{flex:none;padding:8px 0 4px;display:grid;place-items:center;cursor:pointer}
.grab i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2)}
.sheet-head{
  flex:none;display:flex;align-items:baseline;justify-content:space-between;
  padding:0 var(--pad-r) 8px var(--pad-l);gap:12px;
}
.sheet-head h2{font-size:14.5px;font-weight:600}
.sheet-head .hint{font-size:11.5px;color:var(--ink-3);text-align:right}
.list{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:0 var(--pad-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--pad-l);
  display:flex;flex-direction:column;gap:9px;
}
.card{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  padding:11px 13px;box-shadow:var(--sh-1);flex:none;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease);
}
.card:active{transform:scale(.994)}
.card.active{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft),var(--sh-2)}
.card-badge{
  flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:#FFF;letter-spacing:-.02em;
}
.card-thumb{
  flex:none;width:66px;height:66px;border-radius:13px;position:relative;overflow:hidden;
  background-color:var(--line);
  box-shadow:inset 0 0 0 1px rgba(74,50,28,.07);
}
.card-thumb img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
}
.card-thumb .fb{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:#FFF;letter-spacing:-.02em;
}
.card-thumb .cnt{
  position:absolute;right:3px;bottom:3px;font-size:9.5px;line-height:1.4;
  padding:1px 5px;border-radius:6px;color:#FFF;
  background:rgba(32,24,16,.66);backdrop-filter:blur(3px);
  font-variant-numeric:tabular-nums;
}
.card-body{flex:1;min-width:0}
.card-name{
  font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink);
  display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
}
.card-meta{
  margin-top:3px;font-size:11.5px;color:var(--ink-3);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.card-meta .sep{color:var(--line-2)}
.tag{
  display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:999px;
  border:1px solid;line-height:1.6;font-weight:500;
}
.tag.g{background:var(--green-soft);border-color:#CBE4D4;color:var(--green)}
.tag.a{background:var(--amber-soft);border-color:#F0DDB4;color:var(--amber-ink)}
.tag.r{background:var(--rose-soft);border-color:#EFD2D3;color:var(--rose)}
.tag.s{background:var(--slate-soft);border-color:#D5DFE9;color:var(--slate)}
.tag.n{background:#F4EFE7;border-color:var(--line-2);color:var(--ink-3)}
.empty{
  text-align:center;color:var(--ink-3);font-size:13.5px;
  padding:26px 12px;line-height:1.7;
}

/* ══════════ 详情面板 ══════════ */
.detail{
  position:fixed;inset:0;z-index:1200;display:flex;align-items:flex-end;
  background:rgba(42,32,24,.34);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease);
}
.detail.open{opacity:1;pointer-events:auto}
.detail-inner{
  width:100%;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--paper);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:0 var(--pad-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--pad-l);
  transform:translateY(14px);transition:transform .26s var(--ease);
  box-shadow:0 -12px 40px -20px rgba(42,32,24,.5);
}
.detail.open .detail-inner{transform:translateY(0)}
.d-top{
  position:sticky;top:0;background:linear-gradient(var(--paper) 78%,rgba(251,246,239,0));
  padding:10px 0 12px;display:flex;align-items:flex-start;gap:12px;z-index:2;
}
.d-top .grabwrap{flex:none;padding-top:8px}
.d-head{flex:1;min-width:0}
.d-title{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.3;margin:2px 0 4px}
.d-loc{font-size:12.5px;color:var(--ink-3)}
.close{
  flex:none;width:32px;height:32px;border-radius:50%;background:var(--card);
  border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2);
  box-shadow:var(--sh-1);margin-top:2px;
}
.close svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.sec{margin-top:16px}
.sec-t{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px;
}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 14px;box-shadow:var(--sh-1);
}
.kv{display:flex;gap:10px;font-size:13.5px;line-height:1.7}
.kv+.kv{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.kv .k{flex:none;width:62px;color:var(--ink-3);font-size:12.5px}
.kv .v{flex:1;min-width:0;color:var(--ink)}
.quote{
  margin-top:9px;padding:9px 11px;background:var(--paper-2);border-radius:var(--r-s);
  border-left:2.5px solid var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.65;
}
.quote.warn{border-left-color:var(--amber);background:#FDF7EA}
.quote.cite{border-left-color:var(--slate);background:var(--slate-soft)}
.note-txt{font-size:13px;color:var(--ink-2);line-height:1.7}
.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{
  flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:46px;border-radius:var(--r-m);font-size:14.5px;font-weight:600;
  border:1px solid var(--ink);background:var(--ink);color:#FFF9F2;
  box-shadow:var(--sh-2);transition:transform .12s var(--ease);
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2);box-shadow:var(--sh-1)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subpoi{
  display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);line-height:1.6;
  padding:7px 0;
}
.subpoi+.subpoi{border-top:1px solid var(--line)}
.subpoi i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--terra);margin-top:8px}

/* ══════════ 照片 ══════════ */
.gallery{
  display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l));
  padding:0 var(--pad-r) 6px var(--pad-l);
}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{margin:0;flex:none;scroll-snap-align:start;width:min(74vw,300px);position:relative}
.src-tag{
  position:absolute;left:7px;top:7px;font-size:9.5px;line-height:1.5;padding:2px 7px;
  border-radius:7px;color:#FFF;background:rgba(32,24,16,.62);
  backdrop-filter:blur(4px);letter-spacing:.02em;pointer-events:none;
}
.src-tag.xhs{background:rgba(226,40,64,.86)}
.gallery img{
  display:block;width:100%;height:172px;object-fit:cover;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--line);cursor:zoom-in;
}
.gallery img.broken{
  border-style:dashed;border-color:var(--line-2);cursor:default;
  background:repeating-linear-gradient(135deg,#F6F1E9,#F6F1E9 9px,#EFE7DB 9px,#EFE7DB 18px);
}
.gallery figcaption{
  font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gallery figcaption b{color:var(--ink-2);font-weight:500}
.nophoto{
  font-size:12.5px;color:var(--ink-3);line-height:1.6;
  padding:14px;background:#F6F1E9;border:1px dashed var(--line-2);
  border-radius:var(--r-m);text-align:center;
}
.lightbox{
  position:fixed;inset:0;z-index:2000;display:none;
  align-items:center;justify-content:center;background:rgba(20,14,8,.95);
  padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px);
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .lb-close{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);
  display:grid;place-items:center;color:#FFF;backdrop-filter:blur(6px);
}
.lightbox .lb-close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* ══════════ 桌面端 ══════════ */
@media (min-width:860px){
  .stage{flex-direction:row;position:static;height:100%}
  body{overflow:hidden}
  .shell{display:flex;flex-direction:column;height:100%}
  .topbar{position:relative}
  .main-row{flex:1;min-height:0;display:flex}
  #map{flex:1;min-height:0;order:2}
  .sheet{
    order:1;max-height:none;height:auto;width:392px;flex:none;
    border-top:0;border-right:1px solid var(--line);border-radius:0;
    box-shadow:none;
  }
  .grab{display:none}
  .sheet-head{padding-top:14px}
  .detail{align-items:center;justify-content:center;padding:24px}
  .detail-inner{
    max-width:620px;border-radius:var(--r-xl);max-height:86vh;
    padding:0 26px 26px;box-shadow:var(--sh-3);
  }
  .d-top{border-radius:var(--r-xl) var(--r-xl) 0 0}
}
@media (max-width:859px){
  .shell{display:flex;flex-direction:column;height:100%}
  .main-row{flex:1;min-height:0;display:flex;flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ── 图例：图标和类型的对应关系，横排小字 ── */
.legend{display:flex;gap:10px;margin:0 12px 8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.legend::-webkit-scrollbar{display:none}
.legend span{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.legend i{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;flex:none}
.legend i svg{width:9px;height:9px}
/* ── 行程条 ── */
.tripbar{display:none;align-items:center;gap:8px;margin:0 12px 8px;padding:9px 12px;background:var(--ink);color:#fff;border-radius:12px;font-size:13px}
.tripbar.on{display:flex}
.tripbar .tb-btn{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.tripbtn{width:100%;border:1px dashed var(--line-2);background:var(--paper-2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:11px 0;border-radius:12px;cursor:pointer}
.tripbtn.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green)}
/* ── 行程面板 ── */
.trip-panel{position:fixed;inset:0;display:none;z-index:1300;background:rgba(42,32,24,.35)}
.trip-panel.open{display:block}
.trip-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--paper);border-radius:var(--r-l);padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.trip-sheet h3{margin:0 0 4px;font-size:16px}
.trip-sub{color:var(--ink-3);font-size:12px;margin-bottom:10px}
.trip-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.trip-item:last-child{border-bottom:0}
.trip-item .ti-n{flex:1;min-width:0}
.trip-item .ti-t{font-weight:600;font-size:14px}
.trip-item .ti-m{color:var(--ink-2);font-size:12px;margin-top:3px}

<body>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
"use strict";

/* ───────── 词表 ───────── */
var KIND_LABEL = {
  campground:"营地", lodging:"住宿", park:"公园", water:"水域",
  village:"古村", scenic:"景区", transit:"交通", food:"餐饮", other:"其他"
};
var KIND_COLOR = {
  campground:"#2E7D53", lodging:"#57687A", park:"#D99127", water:"#4A7FA5",
  village:"#B4646B", scenic:"#8A6FA8", transit:"#8A8578", food:"#C4763F", other:"#9C8A76"
};
var KIND_ICON = {
  campground:"营", lodging:"宿", park:"园", water:"水",
  village:"村", scenic:"景", transit:"交", food:"食", other:"·"
};
var NIGHT_LABEL = {
  official_camp:["可扎营","g"], lodging:["可住店","s"], allowed_wild:["可野营","g"],
  gray:["灰色地带","a"], forbidden:["禁过夜","r"], unknown:["过夜未核实","n"]
};
var DOG_LABEL = {
  allowed:["可带狗","g"], leash:["需牵绳","a"], fee:["收费","a"],
  forbidden:["禁入","r"], unknown:["犬政策未核实","n"]
};

var DATA=null, MAP=null, CLUSTER=null, STATE={hours:5, night:false, dog:false, kinds:{}, active:null, trip:[]};

/* ───────── 工具 ───────── */
function el(id){return document.getElementById(id);}
/* 在线图挂了不显示破图图标，改成"图没加载出来"的虚线占位 */
window.__imgFail = function(img){
  img.classList.add("broken");
  img.removeAttribute("src");
  var fig = img.parentNode.querySelector("figcaption");
  if(fig && !fig.dataset.warn){
    fig.dataset.warn = "1";
    fig.innerHTML += ' · <span style="color:var(--ink-3)">图未加载</span>';
  }
};

function srcLabel(s){
  // 车程来自哪家服务商是**技术细节**，看的人不需要知道，更不该看到「高德」。
  // 底图版权那一行保留高德是图源 ToS 要求，与数据来源无关。
  if(!s) return '';
  return /真实路网/.test(s) ? '真实路网驾车路径规划' : s;
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function hm(h){var t=Math.round(h*60);return Math.floor(t/60)+"h"+(t%60?String(t%60).padStart(2,"0"):"");}
function tag(txt,cls){return '<span class="tag '+cls+'">'+esc(txt)+'</span>';}
/* 数据里的值必须落在词表内，否则 NIGHT_LABEL[k] 是 undefined，
   [0] 取标签时整页渲染直接抛异常、列表变成"数据加载失败"（实测踩过）。
   这里兜一层：认不出来的值退化成"未核实"，不让一个数据笔误毁掉整个页面。 */
function nightKey(s){
  var k = (s.overnight && s.overnight.status) || "unknown";
  return NIGHT_LABEL[k] ? k : "unknown";
}
function dogKey(s){
  var k = (s.dog && s.dog.policy) || "unknown";
  return DOG_LABEL[k] ? k : "unknown";
}
function isNight(s){var k=nightKey(s);return k==="official_camp"||k==="lodging"||k==="allowed_wild"||k==="gray";}

/* ───────── 筛选 ───────── */
function match(s){
  if(s.drive && s.drive.hours_oneway > STATE.hours) return false;
  if(!s.drive) return false;
  if(STATE.night && !isNight(s)) return false;
  if(STATE.dog && dogKey(s)!=="allowed") return false;
  var kinds=Object.keys(STATE.kinds).filter(function(k){return STATE.kinds[k];});
  if(kinds.length){
    var bucket = s.kind;
    var ok = kinds.some(function(k){
      if(k==="camp") return bucket==="campground";
      if(k==="park") return bucket==="park"||bucket==="water";
      if(k==="village") return bucket==="village"||bucket==="scenic";
      if(k==="lodging") return bucket==="lodging";
      return false;
    });
    if(!ok) return false;
  }
  return true;
}

/* ───────── 渲染列表 ───────── */
function render(){
  var list = DATA.spots.filter(match);
  /* 一律按单程车程由近到远 */
  list = list.slice().sort(function(a,b){
    return (a.drive.hours_oneway||99)-(b.drive.hours_oneway||99);
  });
  el("count").textContent = list.length + " 个点";
  var hint = el("list-hint");
  hint.textContent = "单程 " + STATE.hours.toFixed(1) + "h 内";

  var box = el("list");
  if(!list.length){
    box.innerHTML = '<div class="empty">这个条件下没有点。<br>试试把单程时长拉长，或取消筛选。</div>';
    syncMarkers(list);
    return;
  }
  var TOTAL = list.length, PAGE = 120;
  var pageList = list.slice(0, PAGE);
  box.innerHTML = pageList.map(function(s){
    var k = s.kind, col = KIND_COLOR[k]||"#9C8A76";
    var nk = nightKey(s), dk = dogKey(s);
    /* 未知值不挂徽章：新增的 1300 多个点全是"未核实"，
       每张卡都挂两个一样的灰标等于没传递任何信息。
       详情页仍完整显示"未核实"，筛选器「已确认可带狗」是唯一的确认口径。 */
    /* 厕所直接上卡片：到了地方没厕所比没水更劝退，浏览时就该看得见。
       只有笔记里写明了才显示，没查到的不挂灰标——一排「未核实」等于没信息。 */
    var tf = (s.overnight && s.overnight.facilities) || {};
    var tBadge = tf.toilet === true ? tag("有厕所","g")
               : tf.toilet === false ? tag("无厕所","r") : "";
    var badges = (nk==="unknown" ? "" : tag(NIGHT_LABEL[nk][0], NIGHT_LABEL[nk][1])) +
                 (dk==="unknown" ? "" : tag(DOG_LABEL[dk][0], DOG_LABEL[dk][1])) + tBadge;
    var ph = s.photos && s.photos.length ? s.photos : null;
    /* 列表缩略图挑"看得出这是哪儿"的那张：
       小红书首图常是带大字封面的拼图或自拍，做缩略图很糟；
       高德商户图通常是地点本身。都没有才退回小红书第 2 张（跳过封面）。 */
    var thumbSrc = null;
    if(ph){
      var gd = ph.filter(function(p){ return p.src !== "小红书"; });
      var xh = ph.filter(function(p){ return p.src === "小红书"; });
      thumbSrc = (gd[0] || xh[1] || xh[0] || ph[0]).url;
    }
    var thumb = '<span class="card-thumb">' +
        '<span class="fb" style="background:'+col+'">'+(KIND_ICON[k]||"·")+'</span>' +
        (thumbSrc ? '<img src="'+esc(thumbSrc)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' +
              (ph.length>1 ? '<span class="cnt">'+ph.length+'</span>' : '') : '') +
      '</span>';
    return '<button class="card'+(STATE.active===s.id?" active":"")+'" data-id="'+esc(s.id)+'">' +
      thumb +
      '<span class="card-body">' +
        '<span class="card-name">'+esc(s.name)+'</span>' +
        '<span class="card-meta">' +
          '<span style="color:'+(col)+';font-weight:600">单程 '+hm(s.drive.hours_oneway)+'</span>' +
          '<span class="sep">·</span><span>'+Math.round(s.drive.km)+' km</span>' +
          '<span class="sep">·</span><span>'+esc(s.city||"")+'</span>' +
        '</span>' +
        '<span class="card-meta" style="margin-top:6px;gap:5px">'+badges+'</span>' +
      '</span></button>';
  }).join("") + (TOTAL > PAGE
      ? '<div class="more-note">还有 ' + (TOTAL - PAGE) + ' 个点没列出来。<br>' +
        '缩小范围看，或点上方「全部」。</div>'
      : "");
  syncMarkers(list);
}

/* ───────── 地图 ───────── */
function initMap(){
  MAP = L.map("map", {zoomControl:true, attributionControl:true, preferCanvas:false})
        .setView(DATA.meta.origin.gcj.slice().reverse(), 7);
  L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
    subdomains:["1","2","3","4"], maxZoom:18, minZoom:5,
    attribution:'底图 &copy; 高德地图 · 数据自建'
  }).addTo(MAP);

  var o = DATA.meta.origin;
  L.circleMarker([o.gcj[1], o.gcj[0]], {
    radius:7, color:"#B85C38", weight:2.5, fillColor:"#FFF9F2", fillOpacity:1
  }).addTo(MAP).bindPopup('<div class="pop-t">出发点</div><div class="pop-row">'+esc(o.name)+'</div>');

  /* 不做聚合：聚合出来的数字气泡会把"类型"信息整个吃掉，
     而这张图的核心就是靠图标形状分类型。点之间靠缩放自己让开。 */
  CLUSTER = L.markerClusterGroup({
    showCoverageOnHover:false, spiderfyOnMaxZoom:true, zoomToBoundsOnClick:true,
    maxClusterRadius:0, disableClusteringAtZoom:1, chunkedLoading:true,
    spiderfyDistanceMultiplier:1.5
  });
  MAP.addLayer(CLUSTER);
}

/* 一张地图上放所有点，靠**形状**分类型——光靠颜色在缩略图上分不出来。
   帐篷=能睡的营地，树=公园，水波=水域，房子=古村，山=景区，床=住宿。 */
var KIND_GLYPH = {
  campground:'<path d="M12 4.5 20.5 20H3.5z"/><path d="M12 20v-6"/>',
  lodging:'<path d="M3 19v-8h18v8"/><path d="M3 11V6.5"/><path d="M7 11V8.5h5V11"/>',
  park:'<path d="M12 20v-5"/><path d="M12 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/>',
  water:'<path d="M3 9.5c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M3 15.5c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/>',
  village:'<path d="M4 11 12 5l8 6"/><path d="M6 11v9h12v-9"/>',
  scenic:'<path d="M3 19l6-9 4 6 2-3 6 6z"/><circle cx="17.5" cy="6.5" r="2"/>',
  transit:'<rect x="5" y="4" width="14" height="11" rx="2.5"/><path d="M5 15v3M19 15v3M5 9.5h14"/>',
  food:'<path d="M7 4v7M5 4v6.5a2 2 0 0 0 4 0V4"/><path d="M15 4c2 0 3 1.6 3 4.2s-1 4.2-3 4.2V20"/>',
  other:'<circle cx="12" cy="12" r="3.2"/>'
};
function glyphOf(kind){
  return KIND_GLYPH[kind] || KIND_GLYPH.other;
}
function svgFor(kind){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" '+
         'stroke-linecap="round" stroke-linejoin="round">'+glyphOf(kind)+'</svg>';
}
function pinIcon(s){
  var col = KIND_COLOR[s.kind]||"#9C8A76";
  /* 营地放大一圈：它是"今晚睡哪"的答案，不该和普通点一样大 */
  var lg = s.kind === "campground";
  var sz = lg ? 32 : 26;
  return L.divIcon({
    className:"", iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-sz/2],
    html:'<div class="pin'+(lg?' pin-lg':'')+'" style="background:'+col+'">'+svgFor(s.kind)+'</div>'
  });
}

/* 图例从同一套字形生成，保证"图上看到的"和"图例写的"永远一致 */
function renderLegend(){
  var box = el("legend"); if(!box) return;
  box.innerHTML = Object.keys(KIND_LABEL).filter(function(k){
    return k !== "other" && k !== "food";
  }).map(function(k){
    return '<span><i style="background:'+(KIND_COLOR[k]||"#9C8A76")+'">'+svgFor(k)+'</i>'+
           esc(KIND_LABEL[k])+'</span>';
  }).join("");
}

function syncMarkers(list){
  CLUSTER.clearLayers();
  var layers = list.map(function(s){
    var mk = L.marker([s.gcj[1], s.gcj[0]], {icon:pinIcon(s), riseOnHover:true});
    var nk=nightKey(s), dk=dogKey(s);
    var ph0 = (s.photos && s.photos[0])
      ? '<img src="'+esc(s.photos[0].url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" ' +
        'style="width:100%;height:92px;object-fit:cover;border-radius:8px;margin-bottom:7px;display:block">'
      : '';
    mk.bindPopup(
      ph0 +
      '<div class="pop-t">'+esc(s.name)+'</div>' +
      '<div class="pop-row">单程 '+hm(s.drive.hours_oneway)+' · '+Math.round(s.drive.km)+' km · '+esc(KIND_LABEL[s.kind]||"其他")+'</div>' +
      '<div class="pop-row">'+esc(NIGHT_LABEL[nk][0])+' · '+esc(DOG_LABEL[dk][0])+'</div>'
    );
    mk.on("click", function(){ openDetail(s.id); });
    return mk;
  });
  CLUSTER.addLayers(layers);
  if(list.length && !STATE.active) fitAll(list);
}

function fitAll(list){
  if(!MAP || !list.length) return;
  MAP.invalidateSize();                       /* 容器尺寸刚定下来时 fitBounds 会算偏，先刷一次 */
  var pts = list.map(function(s){return [s.gcj[1], s.gcj[0]];});
  pts.push(DATA.meta.origin.gcj.slice().reverse());
  MAP.fitBounds(pts, {padding:[30,30], maxZoom:11});
}

/* ───────── 详情 ───────── */
function findSpot(id){ return DATA.spots.filter(function(s){return s.id===id;})[0]; }

function openDetail(id){
  var s = findSpot(id); if(!s) return;
  STATE.active = id;
  var boxes = document.querySelectorAll(".card");
  for(var i=0;i<boxes.length;i++)
    boxes[i].classList.toggle("active", boxes[i].getAttribute("data-id")===id);

  el("d-title").textContent = s.name;
  el("d-loc").textContent = [s.province, s.city, KIND_LABEL[s.kind]||"其他"].filter(Boolean).join(" · ");

  var nk=nightKey(s), dk=dogKey(s), d=s.drive;
  var o = s.overnight||{}, dg = s.dog||{};

  var html = "";

  /* 加入行程放在最上面：先决定"去不去"，再看细节 */
  var inT = inTrip(s.id);
  html += '<div class="sec" style="margin-top:2px"><button class="tripbtn' + (inT ? " on" : "") +
          '" data-trip="' + esc(s.id) + '">' + (inT ? "✓ 已在行程 · 点击移除" : "＋ 加入行程") + '</button></div>';

  /* 照片：先看图，再看结论——"长啥样"比指标更直觉 */
  if(s.photos && s.photos.length){
    html += '<div class="sec" style="margin-top:4px"><div class="gallery">' +
      s.photos.map(function(p){
        var isXhs = p.src === "小红书";
        var line = isXhs
          ? '<b>@'+esc(p.author || "小红书作者")+'</b>' +
            (p.title ? ' · '+esc(p.title.slice(0, 16)) : '')
          : esc(p.poi_name || s.name);
        return '<figure>' +
               '<img src="'+esc(p.url)+'" alt="'+esc(s.name)+'" loading="lazy" ' +
               'referrerpolicy="no-referrer" onerror="__imgFail(this)">' +
               '<span class="src-tag'+(isXhs ? " xhs" : "")+'">' +
                 (isXhs ? "小红书实拍" : "实拍") + '</span>' +
               '<figcaption>'+line+'</figcaption></figure>';
      }).join("") + '</div></div>';
  } else {
    html += '<div class="sec" style="margin-top:4px"><div class="nophoto">' +
      '这个点还没有实拍图 —— 不是加载失败，是确实没找到。<br>' +
      '<span style="color:var(--ink-2)">去之前建议先搜一眼实拍，别只信名字。</span></div></div>';
  }

  /* 核心答案条：这地方能不能今晚睡 */
  html += '<div class="sec"><div class="panel" style="border-left:3px solid '+
    (isNight(s)?"var(--green)":"var(--rose)")+'">' +
    '<div class="kv"><div class="k">今晚睡哪</div><div class="v"><b>'+esc(NIGHT_LABEL[nk][0])+'</b>'+
    (o.modes&&o.modes.length?' · '+o.modes.map(function(m){return {tent:"帐篷",car:"车中泊",cabin:"住店"}[m]||m;}).join("/"):"")+
    '</div></div>' +
    (function(){
      var f0 = o.facilities||{};
      /* 卫生间单独拎出来问：到了地方发现没厕所，比没水更劝退 */
      var t = f0.toilet;
      var lbl = t===true ? '<b style="color:var(--green)">有</b>'
              : t===false ? '<b style="color:var(--rose)">没有</b>'
              : '<span style="color:var(--ink-3)">未核实</span>';
      return '<div class="kv" style="margin-top:8px"><div class="k">卫生间</div><div class="v">'+lbl+'</div></div>';
    })() +
    (o.note?'<div class="note-txt" style="margin-top:6px">'+esc(o.note)+'</div>':'') +
    (function(){
      var ev = o.evidence||[];
      if(!ev.length) return "";
      /* 结论下面是原话：别人到底怎么说的，读的人自己判断。
         没有原话的结论等于二手转述，这个项目不这么干。 */
      return '<div style="margin-top:8px">' + ev.slice(0,3).map(function(e){
        return '<div class="quote cite" style="margin-top:6px">'+esc(e.quote||"")+
               '<span style="color:var(--ink-3)"> —— @'+esc(e.author||"小红书")+'</span></div>';
      }).join("") + '</div>';
    })() +
    '</div></div>';

  /* 车程 */
  html += '<div class="sec"><div class="sec-t">从出发点</div><div class="panel">' +
    '<div class="kv"><div class="k">单程</div><div class="v">'+hm(d.hours_oneway)+' · '+Math.round(d.km)+' km</div></div>' +
    '<div class="kv"><div class="k">来回</div><div class="v">约 '+hm(d.hours_oneway*2)+'</div></div>' +
    '<div class="kv"><div class="k">依据</div><div class="v" style="color:var(--ink-3);font-size:12px">'+esc(srcLabel(d.source))+'</div></div>' +
    '</div></div>';

  /* 犬政策 */
  html += '<div class="sec"><div class="sec-t">带狗政策</div><div class="panel">' +
    '<div class="kv"><div class="k">结论</div><div class="v">'+tag(DOG_LABEL[dk][0],DOG_LABEL[dk][1])+'</div></div>' +
    (dg.evidence ? '<div class="quote cite">'+esc(dg.evidence)+'</div>' : '') +
    (dg.risk_hint ? '<div class="quote warn">⚠ '+esc(dg.risk_hint)+'</div>' : '') +
    '</div></div>';

  /* 设施 */
  var f = o.facilities||{};
  var fmap = {toilet:"厕所",water:"水源",power:"电",signal:"信号"};
  var fparts = Object.keys(fmap).filter(function(k){return f[k]!=null;})
    .map(function(k){return fmap[k]+(f[k]?"✓":"✗");});
  if(fparts.length){
    html += '<div class="sec"><div class="sec-t">设施</div><div class="panel"><div class="note-txt">'+
      esc(fparts.join(" · "))+'</div></div></div>';
  }

  /* 子点位 */
  if(s.sub_pois && s.sub_pois.length>1){
    html += '<div class="sec"><div class="sec-t">这一片包含 '+s.sub_pois.length+' 个点</div><div class="panel">' +
      s.sub_pois.map(function(p){
        return '<div class="subpoi"><i></i><div>'+esc(p.name)+'</div></div>';
      }).join("") + '</div></div>';
  }

  /* 出处 */
  /* 出处只说「这条线索从哪来」。查看的人不关心底图/坐标是哪家，
     所以这里只显示渠道（小红书带狗笔记 / 抖音带狗行程），不出现地图厂商。 */
  var src = [];
  if(s.origin) src.push(s.origin);
  var tripNames = (s.trips || []).filter(function(t){
    return t.indexOf("高德POI") !== 0 && t.indexOf("小红书-") !== 0; });
  if(tripNames.length) src.push("出自：" + tripNames.join("、"));
  if(s.raw_note) src.push("说明：" + s.raw_note);
  if(src.length){
    html += '<div class="sec"><div class="sec-t">出处</div><div class="panel"><div class="note-txt" style="font-size:12.5px;color:var(--ink-2)">'+
      src.map(esc).join("<br>")+'</div></div></div>';
  }

  /* 动作 */
  var nav = "https://uri.amap.com/marker?position=" + s.gcj[0] + "," + s.gcj[1] +
            "&name=" + encodeURIComponent(s.name) + "&src=pet-trip&coordinate=gaode&callnative=1";
  html += '<div class="actions">' +
    '<a class="btn" href="'+nav+'" target="_blank" rel="noopener">' +
      '<svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>导航</a>' +
    '<button class="btn ghost" id="d-fly">在地图上定位</button>' +
    '</div>' +
    '<div class="actions" style="margin-top:9px">' +
    '<button class="btn ghost" id="d-copy" style="min-height:40px;height:40px;font-size:13.5px;font-weight:500">复制链接</button>' +
    '<a class="btn ghost" href="trips.html" style="min-height:40px;height:40px;font-size:13.5px;font-weight:500">行程攻略</a>' +
    '</div>';

  el("d-body").innerHTML = html;
  el("detail").classList.add("open");
  if(decodeURIComponent(location.hash.slice(1)) !== id)
    history.replaceState(null, "", "#" + encodeURIComponent(id));

  el("d-fly").addEventListener("click", function(){
    el("detail").classList.remove("open");
    MAP.flyTo([s.gcj[1], s.gcj[0]], 13, {duration:.6});
  });
  var cp = el("d-copy");
  if(cp) cp.addEventListener("click", function(){
    var url = location.origin + location.pathname + "#" + encodeURIComponent(s.id);
    var done = function(){ cp.textContent = "已复制"; setTimeout(function(){ cp.textContent = "复制链接"; }, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ window.prompt("复制这个链接：", url); });
    } else { window.prompt("复制这个链接：", url); }
  });
}

/* ───────── 事件 ───────── */
function bind(){
  el("range").addEventListener("input", function(e){
    STATE.hours = parseFloat(e.target.value);
    el("range-out").textContent = STATE.hours.toFixed(1);
    render();
  });
  el("filters").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    var f = b.getAttribute("data-f");
    var on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", on ? "false" : "true");
    if(f==="night") STATE.night = !on;
    else if(f==="dog") STATE.dog = !on;
else STATE.kinds[f] = !on;
    render();
  });
  el("list").addEventListener("click", function(e){
    var c = e.target.closest(".card"); if(!c) return;
    openDetail(c.getAttribute("data-id"));
  });
  el("detail-close").addEventListener("click", function(){
    el("detail").classList.remove("open");
    history.replaceState(null, "", location.pathname + location.search);
  });
  el("detail").addEventListener("click", function(e){
    if(e.target === el("detail")){
      el("detail").classList.remove("open");
      history.replaceState(null, "", location.pathname + location.search);
    }
  });
  el("grab").addEventListener("click", function(){
    el("sheet").classList.toggle("expanded");
  });
  /* 画廊点图 → 大图 */
  el("d-body").addEventListener("click", function(e){
    var tb = e.target.closest("[data-trip]");
    if(tb){ e.preventDefault(); toggleTrip(tb.getAttribute("data-trip")); return; }
    var img = e.target.closest(".gallery img");
    if(!img || img.classList.contains("broken") || !img.getAttribute("src")) return;
    el("lb-img").src = img.src;
    el("lightbox").classList.add("open");
  });
  el("lb-close").addEventListener("click", function(){
    el("lightbox").classList.remove("open");
  });
  el("lightbox").addEventListener("click", function(e){
    if(e.target === el("lightbox")) el("lightbox").classList.remove("open");
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      el("lightbox").classList.remove("open");
      el("detail").classList.remove("open");
      history.replaceState(null, "", location.pathname + location.search);
    }
  });
}

/* ───────── 行程 ───────── */
var TRIP_KEY = "pp-trip-v1";
function loadTrip(){
  try{
    var a = JSON.parse(localStorage.getItem(TRIP_KEY) || "[]");
    if(!Array.isArray(a)) return [];
    // 点位会随数据更新出现/消失，加载时把已经不存在的 id 滤掉
    return a.filter(function(id){ return !!findSpot(id); });
  }catch(e){ return []; }
}
function saveTrip(){ try{ localStorage.setItem(TRIP_KEY, JSON.stringify(STATE.trip)); }catch(e){} }
function inTrip(id){ return STATE.trip.indexOf(id) >= 0; }
function toggleTrip(id){
  var i = STATE.trip.indexOf(id);
  if(i >= 0) STATE.trip.splice(i, 1); else STATE.trip.push(id);
  saveTrip(); renderTrip();
  if(STATE.active) openDetail(STATE.active);
}
function fallbackCopy(t){
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
function tripText(){
  var lines = ["带狗出行 · " + STATE.trip.length + " 个点"];
  STATE.trip.forEach(function(id, i){
    var s = findSpot(id); if(!s) return;
    var f = (s.overnight || {}).facilities || {};
    var bits = ["单程 " + hm(s.drive.hours_oneway)];
    bits.push(NIGHT_LABEL[nightKey(s)][0]);
    if(f.toilet === true) bits.push("有厕所");
    else if(f.toilet === false) bits.push("无厕所");
    if(dogKey(s) === "allowed") bits.push("可带狗");
    lines.push((i + 1) + ". " + s.name + "（" + bits.join(" · ") + "）");
  });
  return lines.join("\n");
}
function renderTripPanel(){
  var box = el("trip-list"), sub = el("trip-sub");
  if(!STATE.trip.length){
    sub.textContent = "";
    box.innerHTML = '<div style="padding:26px 0;text-align:center;color:var(--ink-3);font-size:13px">还没选地方。<br>点开任意一个点，按「＋ 加入行程」。</div>';
    return;
  }
  /* 只报"最远单程"：把每个点的单程加起来不是真实路线，
     报一个假的总时长不如不报。 */
  var maxH = 0;
  box.innerHTML = STATE.trip.map(function(id, i){
    var sp = findSpot(id); if(!sp) return "";
    var d = sp.drive, f = (sp.overnight || {}).facilities || {};
    if(d.hours_oneway > maxH) maxH = d.hours_oneway;
    return '<div class="trip-item"><div class="ti-n">' +
      '<div class="ti-t">' + (i + 1) + '. ' + esc(sp.name) + '</div>' +
      '<div class="ti-m">单程 ' + hm(d.hours_oneway) + ' · ' + Math.round(d.km) + ' km · ' +
      esc(NIGHT_LABEL[nightKey(sp)][0]) +
      (f.toilet === true ? ' · 有厕所' : (f.toilet === false ? ' · 无厕所' : '')) +
      '</div></div><button class="ti-x" data-rm="' + esc(id) + '" aria-label="移除">×</button></div>';
  }).join("");
  sub.textContent = "最远单程 " + hm(maxH) + " · 点之间怎么串由你定";
}
function renderTrip(){
  var bar = el("tripbar");
  if(!STATE.trip.length){ bar.classList.remove("on"); }
  else { bar.classList.add("on"); el("trip-count").textContent = STATE.trip.length; }
  if(el("trip-panel").classList.contains("open")) renderTripPanel();
}
function bindTrip(){
  el("trip-open").addEventListener("click", function(){
    renderTripPanel(); el("trip-panel").classList.add("open");
  });
  el("trip-close").addEventListener("click", function(){ el("trip-panel").classList.remove("open"); });
  el("trip-panel").addEventListener("click", function(e){
    if(e.target === el("trip-panel")) el("trip-panel").classList.remove("open");
  });
  el("trip-list").addEventListener("click", function(e){
    var b = e.target.closest("[data-rm]"); if(!b) return;
    toggleTrip(b.getAttribute("data-rm"));
  });
  el("trip-clear").addEventListener("click", function(){
    STATE.trip = []; saveTrip(); renderTrip(); renderTripPanel();
  });
  el("trip-copy").addEventListener("click", function(){
    var btn = el("trip-copy"), t = tripText();
    var done = function(){
      btn.textContent = "已复制 ✓";
      setTimeout(function(){ btn.textContent = "复制行程"; }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done).catch(function(){ fallbackCopy(t); done(); });
    } else { fallbackCopy(t); done(); }
  });
}

/* ───────── 启动 ───────── */
fetch("spots.json", {cache:"no-cache"})
  .then(function(r){ return r.json(); })
  .then(function(d){
    DATA = d;
    el("origin-line").textContent = "从" + d.meta.origin.name + "出发 · 单程上限可调";
    initMap();
    bind();
    bindTrip();
    renderLegend();
    STATE.trip = loadTrip();
    renderTrip();
    render();
    /* 布局稳定后再算 fitBounds：立刻算会把容器尺寸算小，点位挤到屏幕外 */
    setTimeout(function(){ if(d.spots.length) fitAll(d.spots); }, 80);
    window.addEventListener("resize", function(){ MAP.invalidateSize(); });
    window.addEventListener("orientationchange", function(){
      setTimeout(function(){ MAP.invalidateSize(); }, 260);
    });
    /* 深链接：#<id> 直接打开那个点，方便从聊天里点进来 */
    var deep = decodeURIComponent(location.hash.slice(1));
    if(deep && findSpot(deep)) openDetail(deep);
    window.addEventListener("hashchange", function(){
      var h = decodeURIComponent(location.hash.slice(1));
      if(h && findSpot(h)) openDetail(h);
    });
  })
  .catch(function(err){
    el("list").innerHTML = '<div class="empty">数据加载失败：'+esc(err.message)+
      '<br>检查 spots.json 是否在同一目录。</div>';
  });
})();
</script>
