<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="带狗去哪儿">
<meta name="theme-color" content="#F4F3EF">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<!-- 弱网下这两家都不在首屏关键路径上，但建连要 300~600ms；
     提前握手，等真正要用（地图瓦片/天气）时就不用从零开始（2026-11-24）。 -->
<link rel="preconnect" href="https://webrd01.is.autonavi.com" crossorigin>
<link rel="dns-prefetch" href="https://webrd01.is.autonavi.com">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="dns-prefetch" href="https://api.open-meteo.com">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<title>带狗去哪儿 · 从上海出发</title>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:light;
  /* 2026-11-20 配色重做（owner：整体算不上好看）。
     诊断：原来 9 个类别各给一个饱和色 + 奶油底 + 砖红主色，一屏里同时出现
     橙/绿/蓝/紫/棕/红，颜色互相抢，底色又偏黄，整体显脏；正文 3 级灰太浅（#9C8A76）读着发虚。
     方向：按"户外地形图"来做 —— 冷调石灰底 + 深松针主色 + 少量陶土强调，
     类别色全部降到同一明度带、去饱和，靠色相区分而不是靠刺眼。 */
  --paper:#F6F4EE; --paper-2:#FCFBF7; --card:#FFFFFF;
  --ink:#161B1F; --ink-2:#4E5860; --ink-3:#889199;
  --line:#E6E3DA; --line-2:#D4D0C5;
  /* 主色定名 --brand（2026-11-20 选定"墨蓝+米白"）。
     上一版叫 --pine（松针）是因为当时用绿，配色换过之后名字会误导后来的人。 */
  --brand:#1F3A4D; --brand-2:#152A38; --brand-soft:#E7EDF1;
  --terra:#A9552F; --terra-2:#8C4426; --terra-soft:#F6E7DE;
  --amber:#B5811F; --amber-soft:#F7EDD6; --amber-ink:#7A5406;
  --green:#1D7A4F; --green-soft:#E2F0E7;
  --slate:#5A6B75; --slate-soft:#E8EDF0;
  --rose:#9E5359; --rose-soft:#F6E6E7;
  /* 字号只留五档。之前页面里并存 19 种字号（12/12.5/11.5/13/11/13.5…），
     差半号的字号看不出层级，只会显得乱。 */
  --t-xs:11px; --t-s:12px; --t-m:14px; --t-l:17px; --t-xl:22px;
  --r-s:12px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(74,50,28,.05);
  --sh-2:0 2px 10px rgba(74,50,28,.06),0 1px 2px rgba(74,50,28,.04);
  --sh-3:0 16px 34px -14px rgba(74,50,28,.26),0 2px 8px rgba(74,50,28,.06);
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
    "Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --font-display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",
    Georgia,-apple-system,serif;
  --ease:cubic-bezier(.2,.7,.3,1);
  --pad-l:calc(16px + env(safe-area-inset-left,0px));
  --pad-r:calc(16px + env(safe-area-inset-right,0px));
  --topbar-h:0px;
}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.005em}

/* ══════════ 顶栏 ══════════ */
.topbar{
  position:relative;z-index:900;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad-r) 0 var(--pad-l);
  border-bottom:1px solid var(--line);
}
.brandrow{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
  color:#E8EEF2;background:linear-gradient(155deg,#254659,#18303F);
  border:1px solid #142834;box-shadow:var(--sh-1);
}
.brand-mark svg{width:18px;height:18px;fill:currentColor}
.brand-txt{flex:1;min-width:0}
.brand-name{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:1px}
.count-pill{
  flex:none;font-size:12px;font-variant-numeric:tabular-nums;
  padding:4px 10px;border-radius:999px;background:var(--brand-soft);
  color:var(--brand-2);font-weight:600;border:1px solid var(--line-2);
}

/* ══════════ 筛选条 ══════════ */
.filters{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:4px 0 6px;margin:0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l));
  padding-left:var(--pad-l);padding-right:var(--pad-r);
}
.filters::-webkit-scrollbar{display:none}
/* 筛选面板默认收起。三排胶囊并排列在屏幕上不是"精细"，是"乱"——
   而且场景和类型大面积重复（草坪遛弯≈公园、古村古镇≈古村），
   摆两排只会让人以为是两个维度。要点才展开。 */
/* 筛选抽屉（2026-11-21）：原来展开在 header 里，把地图压掉一大截。
   现在固定贴底、最高 62vh，上半屏地图始终露着；点遮罩或「完成」收起。 */
.fscrim{position:fixed;inset:0;z-index:1150;background:rgba(22,26,24,.22);
  opacity:0;pointer-events:none;transition:opacity .18s}
.fscrim.open{opacity:1;pointer-events:auto}
.fpanel{position:fixed;left:0;right:0;bottom:0;z-index:1200;
  background:var(--paper-2);border-radius:18px 18px 0 0;
  box-shadow:0 -18px 44px rgba(16,30,40,.22);
  max-height:62vh;display:flex;flex-direction:column;
  transform:translateY(102%);visibility:hidden;
  transition:transform .22s ease, visibility .22s}
.fpanel.open{transform:none;visibility:visible}
.fp-bar{flex:none;display:flex;align-items:center;gap:8px;
  padding:14px 16px 8px;border-bottom:1px solid var(--line);position:relative}
.fp-grab{position:absolute;left:50%;top:6px;transform:translateX(-50%);
  width:38px;height:4px;border-radius:2px;background:var(--line-2)}
.fp-name{font-size:13px;font-weight:700;color:var(--ink)}
.fp-done{margin-left:auto;border:0;background:var(--brand);color:#F4F7F4;
  font:inherit;font-size:12.5px;font-weight:600;padding:6px 15px;border-radius:999px;cursor:pointer}
.fp-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:7px;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
/* 抽屉里的 chip 必须有边界：外面那条筛选行可以"没选就没底色"，
   但抽屉是一张可点清单，没有边界就看不出哪些能点。 */
.fp-body .chip{border:1px solid var(--line-2);background:var(--card)}
.fp-body .chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2);font-weight:600}
/* 桌面：做成右下浮层，别把整条底边糊住 */
@media (min-width:900px){
  .fpanel{left:auto;right:16px;bottom:16px;width:392px;border-radius:16px;
    max-height:min(62vh,540px);transform:translateY(calc(100% + 24px))}
}
/* 搜索条 */
.searchbar{display:none;padding:0 0 10px}
.searchbar.open{display:flex;align-items:center;gap:7px}
#q{flex:1;min-width:0;height:37px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--paper-2);padding:0 12px;font:inherit;font-size:14px;color:var(--ink);outline:none}
#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
#q::placeholder{color:var(--ink-3)}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sb-x{border:0;background:transparent;color:var(--ink-3);font-size:15px;
  cursor:pointer;padding:6px 4px;line-height:1}
.fpanel .fp-title{
  width:100%;font-size:11px;color:var(--ink-3);letter-spacing:.04em;
  margin:6px 0 -1px;
}
.fsum{
  display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;
  border-radius:999px;border:1px solid var(--brand);background:var(--brand-soft);
  color:var(--brand-2);font-size:12.5px;font-weight:600;cursor:pointer;flex:none;
}
.fsum .x{opacity:.55;font-size:14px;line-height:1}
/* 常驻筛选不做成一排白胶囊：只有"选了"才有底色，没选就是一句话 */
.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 11px;border-radius:9px;
  background:transparent;border:0;
  font-size:var(--t-s);color:var(--ink-2);white-space:nowrap;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.chip:active{transform:scale(.97)}
.plan-more{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:14px 0 4px;padding:12px 14px;border-radius:14px;
  background:var(--card,#fffdf8);border:1px dashed var(--line,#e6ddcb);
}
.plan-to-trip{
  display:block;width:100%;margin:10px 0 2px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-1);
  font-size:13.5px;font-weight:600;cursor:pointer;
}
.plan-to-trip:active{transform:scale(.99)}
.plan-thumbs{display:flex;gap:8px;margin:10px 0 6px}
.plan-thumbs .pt{flex:1;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--line)}
.plan-thumbs .pt img{width:100%;height:100%;object-fit:cover;display:block}
.ti-n[data-tdetail]{cursor:pointer}
.ti-go{float:right;font-weight:400;font-size:12px;color:var(--ink-3)}
.ti-ops{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.ti-mv{border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font:inherit;font-size:13px;
  width:26px;height:26px;line-height:1;border-radius:8px;cursor:pointer;padding:0}
.ti-mv:active{background:var(--paper-2)}
.trip-warn{margin:0 0 10px;padding:10px 12px;border-radius:10px;line-height:1.55;
  background:rgba(190,60,50,.07);border:1px solid rgba(190,60,50,.22);color:var(--ink-2);font-size:12.5px}
.trip-warn.soft{background:rgba(150,110,40,.07);border-color:rgba(150,110,40,.22)}
.trip-order{
  margin:14px 0 4px;padding:12px 14px;border-radius:14px;
  background:var(--card);border:1px dashed var(--line);
}
.to-line{font-size:13px;line-height:1.7;color:var(--ink-2);margin-bottom:10px}
.to-line b{color:var(--ink-1)}
.to-note{color:var(--ink-3);font-size:11.5px}
.more-btn{
  margin-top:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--brand);
  background:var(--brand-soft);color:var(--brand-ink);font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.more-btn:active{transform:scale(.97)}
.more-hint{font-size:11.5px;color:var(--ink-3)}
.more-note{padding:16px 14px 22px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.7;border-top:1px dashed var(--line);}
.chip[aria-pressed="true"]{
  background:var(--ink);color:#F4F7F4;font-weight:500;
}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip-wrap{
  flex:none;display:flex;align-items:center;height:34px;padding:0 2px;
  border-radius:9px;background:transparent;border:0;
  font-size:var(--t-s);color:var(--ink-2);gap:8px;white-space:nowrap;
}
.chip-wrap input[type=range]{
  -webkit-appearance:none;appearance:none;width:96px;height:3px;border-radius:2px;
  background:var(--line-2);outline:none;
}
.chip-wrap input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--brand);border:2px solid #FFF;box-shadow:var(--sh-2);cursor:pointer;
}
.chip-wrap b{color:var(--brand-2);font-variant-numeric:tabular-nums;font-weight:600}

/* ══════════ 主体：地图 + 列表 ══════════ */
.stage{position:absolute;inset:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:#EDE6DA;z-index:1}
/* 底图瓦片失败时的提示：贴在容器左上，不挡地图操作 */
.tile-warn{position:absolute;left:12px;top:12px;max-width:min(420px,72vw);z-index:900;font-size:12.5px;line-height:1.6;color:#7A3B2E;background:#FBEFE6;border:1px solid #E3C3AE;border-radius:10px;padding:9px 11px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tile-warn b{color:#B85C38}
.leaflet-container{font:inherit;background:#EDE6DA}
.leaflet-control-attribution{font-size:9px!important;background:rgba(251,246,239,.88)!important;
  padding:1px 5px!important;border-radius:6px 0 0 0}
.leaflet-bar a{background:var(--card)!important;color:var(--ink-2)!important;border-color:var(--line-2)!important}
.leaflet-bar a:hover{background:var(--paper-2)!important;color:var(--brand)!important}
.leaflet-popup-content-wrapper{
  border-radius:var(--r-m);box-shadow:var(--sh-3);background:var(--card);
  border:1px solid var(--line);
}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.55}
.leaflet-popup-tip{background:var(--card);border:1px solid var(--line)}
/* 聚合气泡 —— 覆盖 markercluster 默认蓝色 */
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(31,58,77,.16)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{
  background:var(--brand)!important;color:#F4F7F4!important;
  font-family:var(--font-sans)!important;font-weight:700!important;
  box-shadow:0 2px 9px rgba(16,30,40,.28)!important;
}
.pop-t{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0 0 5px}
.pop-row{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12.5px}
.pop-row+.pop-row{margin-top:3px}

/* 地图标记 */
.pin{
  display:grid;place-items:center;width:100%;height:100%;
  border-radius:50%;border:2px solid #FFF;
  box-shadow:0 2px 8px rgba(50,34,20,.28);
}
.pin svg{width:14px;height:14px;display:block}
.pin-lg{box-shadow:0 3px 12px rgba(31,58,77,.42)}
.pin-lg svg{width:17px;height:17px}

/* ══════════ 底部列表（移动端抽屉式） ══════════ */
.sheet{
  position:relative;z-index:400;flex:none;
  background:var(--paper);border-top:1px solid var(--line);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -8px 28px -18px rgba(74,50,28,.4);
  max-height:38vh;display:flex;flex-direction:column;
  transition:max-height .3s var(--ease);
}
.sheet.expanded{max-height:82vh}
.grab{flex:none;padding:8px 0 4px;display:grid;place-items:center;cursor:pointer}
.grab i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2)}
.sheet-head{
  flex:none;display:flex;align-items:baseline;justify-content:space-between;
  padding:0 var(--pad-r) 8px var(--pad-l);gap:12px;
}
.sheet-head h2{font-size:14.5px;font-weight:600}
.sheet-head .hint{font-size:11.5px;color:var(--ink-3);text-align:right}
.list{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:0 var(--pad-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--pad-l);
  display:flex;flex-direction:column;gap:9px;
}
/* 卡片不再是一张"框"：去掉描边和投影，靠留白与分隔线分组。
   一屏里 20 张带框的卡片，框线本身就成了噪音。 */
.card{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  font:inherit;color:inherit;cursor:pointer;position:relative;
  background:transparent;border:0;border-radius:0;
  padding:13px 34px 13px 2px;flex:none;
  border-bottom:1px solid var(--line);
  transition:background .14s var(--ease);
}
.card:last-child{border-bottom:0}
.card:active{background:var(--paper-2)}
.card.active{background:var(--brand-soft)}
.card:active{transform:scale(.994)}
.card.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft),var(--sh-2)}
.card-badge{
  flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:#FFF;letter-spacing:-.02em;
}
.card-thumb{
  flex:none;width:78px;height:78px;border-radius:12px;position:relative;overflow:hidden;
  background-color:var(--line);
}
.card-thumb img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
}
.card-thumb .fb{
  position:absolute;inset:0;display:grid;place-items:center;
}
.card-thumb .fb svg{width:52%;height:52%;opacity:.92}
.card-thumb .cnt{
  position:absolute;right:3px;bottom:3px;font-size:9.5px;line-height:1.4;
  padding:1px 5px;border-radius:6px;color:#FFF;
  background:rgba(32,24,16,.66);backdrop-filter:blur(3px);
  font-variant-numeric:tabular-nums;
}
.card-body{flex:1;min-width:0}
/* 出发地可点：真实路网车程只对上海存在，换地方就只能按直线估 */
.origin-btn{
  display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;
  font-family:inherit;font-weight:inherit;color:inherit;text-align:left;cursor:pointer;
  max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.origin-btn::after{content:"⌄";font-size:11px;opacity:.55;transform:translateY(-1px)}
.origin-panel{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(110%);
  width:100%;max-width:460px;background:var(--paper);border-radius:18px 18px 0 0;
  box-shadow:0 -12px 40px -16px rgba(74,50,28,.4);padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
  z-index:1500;transition:transform .26s var(--ease);
}
.origin-panel.open{transform:translateX(-50%) translateY(0)}
.origin-panel h4{
  margin:0 0 12px;font-size:var(--t-l);font-weight:600;font-family:var(--font-display);
}
.origin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.origin-grid button{
  padding:10px 6px;border-radius:10px;border:1px solid var(--line-2);background:var(--paper-2);
  font:inherit;font-size:var(--t-s);color:var(--ink-2);cursor:pointer;
}
.origin-grid button[aria-pressed="true"]{background:var(--ink);color:#F4F7F4;border-color:var(--ink);font-weight:600}
.origin-note{margin-top:12px;font-size:var(--t-xs);color:var(--ink-3);line-height:1.7}
.origin-close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:20px;color:var(--ink-3);cursor:pointer}
/* 车程是这一屏里唯一该被"读出大小"的数字 */
.card-meta .drive{color:var(--terra-2);font-size:var(--t-m);font-weight:700}
/* 第三行：犬政策·过夜·场景，用间隔点串起来，不做胶囊。
   胶囊一多，一屏十几个框，眼睛找不到重点。 */
.card-facts{
  display:flex;align-items:center;flex-wrap:wrap;margin-top:7px;
  font-size:var(--t-xs);color:var(--ink-2);line-height:1.7;
}
.card-facts .fact + .fact::before{content:"·";margin:0 7px;color:var(--ink-3)}
.card-anchor{
  display:inline-flex;align-items:center;gap:3px;margin-top:6px;padding:4px 9px;
  border-radius:999px;border:1px solid var(--brand-soft);background:transparent;
  color:var(--brand-2);font:inherit;font-size:var(--t-xs);font-weight:600;
  cursor:pointer;line-height:1.2;
}
.card-anchor:active{transform:scale(.97)}
.card-anchor::before{content:"◎";font-size:11px;opacity:.8}

.fact.dog{display:inline-flex;align-items:center;font-weight:600}
.fact.dog::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px}
.fact.dog.g{color:var(--green)}
.fact.dog.a{color:var(--amber-ink)}
.fact.dog.r{color:var(--rose)}
.fact.dog.n{color:var(--ink-3)}
/* 2026-11-20：从「本周推荐」点进详情后的返回入口 */
.d-back{
  display:inline-flex;align-items:center;gap:6px;
  margin:0 0 10px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;
}
.d-back span{font-size:16px;line-height:1;margin-top:-1px}
.d-back:active{transform:scale(.97)}
/* 行程按钮：小、靠右，点一下就进去，不用打开详情 */
/* ＋ 浮在缩略图右上角：塞进文字行会被长事实挤走，且和第二行的车程抢位置 */
.card-trip{
  position:absolute;right:2px;top:calc(50% - 12px);z-index:2;
  width:24px;height:24px;padding:0;border-radius:999px;
  border:0;background:rgba(255,255,255,.88);color:var(--ink-2);
  font-size:15px;font-weight:500;cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(74,50,28,.18);
  transition:background .14s,color .14s;
}
.card-trip:active{transform:scale(.94)}
.card-trip.on{background:var(--brand);color:#F4F7F4}
.src-link{color:var(--brand-2);text-decoration:none;border-bottom:1px solid var(--brand-soft)}
/* 地名用宋体：这是一份"周末去哪儿"的清单，纸感比无衬线更贴题 */
.card-name{
  font-family:var(--font-display);
  font-size:var(--t-l);font-weight:600;line-height:1.3;color:var(--ink);
  display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
}
.card-meta{
  margin-top:5px;font-size:var(--t-s);color:var(--ink-3);
  display:flex;gap:0;flex-wrap:wrap;align-items:baseline;line-height:1.5;
}
.card-meta > * + *::before{content:"·";margin:0 6px;color:var(--ink-3)}
.card-meta .sep{color:var(--line-2)}
.tag{
  display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:999px;
  border:1px solid;line-height:1.6;font-weight:500;
}
.tag.g{background:var(--green-soft);border-color:#CBE4D4;color:var(--green)}
.tag.a{background:var(--amber-soft);border-color:#F0DDB4;color:var(--amber-ink)}
.tag.r{background:var(--rose-soft);border-color:#EFD2D3;color:var(--rose)}
.tag.s{background:var(--slate-soft);border-color:#D5DFE9;color:var(--slate)}
.tag.n{background:#F4EFE7;border-color:var(--line-2);color:var(--ink-3)}
.empty{
  text-align:center;color:var(--ink-3);font-size:13.5px;
  padding:26px 12px;line-height:1.7;
}

/* ══════════ 详情面板 ══════════ */
.detail{
  position:fixed;inset:0;z-index:1200;display:flex;align-items:flex-end;
  background:rgba(22,26,24,.34);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease);
}
.detail.open{opacity:1;pointer-events:auto}
.detail-inner{
  width:100%;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--paper);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:0 var(--pad-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--pad-l);
  transform:translateY(14px);transition:transform .26s var(--ease);
  box-shadow:0 -12px 40px -20px rgba(22,26,24,.5);
}
.detail.open .detail-inner{transform:translateY(0)}
.d-top{
  position:sticky;top:0;background:linear-gradient(var(--paper) 78%,rgba(251,246,239,0));
  padding:10px 0 12px;display:flex;align-items:flex-start;gap:12px;z-index:2;
}
.d-top .grabwrap{flex:none;padding-top:8px}
.d-head{flex:1;min-width:0}
.d-title{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.3;margin:2px 0 4px}
.d-loc{font-size:12.5px;color:var(--ink-3)}
.close{
  flex:none;width:32px;height:32px;border-radius:50%;background:var(--card);
  border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2);
  box-shadow:var(--sh-1);margin-top:2px;
}
.close svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.sec{margin-top:16px}
.sec-t{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px;
}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 14px;box-shadow:var(--sh-1);
}
.kv{display:flex;gap:10px;font-size:13.5px;line-height:1.7}
.kv+.kv{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.kv .k{flex:none;width:62px;color:var(--ink-3);font-size:12.5px}
.kv .v{flex:1;min-width:0;color:var(--ink)}
.quote{
  margin-top:9px;padding:9px 11px;background:var(--paper-2);border-radius:var(--r-s);
  border-left:2.5px solid var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.65;
}
.quote.warn{border-left-color:var(--amber);background:#FDF7EA}
.quote.cite{border-left-color:var(--slate);background:var(--slate-soft)}
.note-txt{font-size:13px;color:var(--ink-2);line-height:1.7}
.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{
  flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:46px;border-radius:var(--r-m);font-size:14.5px;font-weight:600;
  border:1px solid var(--ink);background:var(--ink);color:#F4F7F4;
  box-shadow:var(--sh-2);transition:transform .12s var(--ease);
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2);box-shadow:var(--sh-1)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subpoi{
  display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);line-height:1.6;
  padding:7px 0;
}
.subpoi+.subpoi{border-top:1px solid var(--line)}
.subpoi i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--brand);margin-top:8px}

/* ══════════ 照片 ══════════ */
.gallery{
  display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l));
  padding:0 var(--pad-r) 6px var(--pad-l);
}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{margin:0;flex:none;scroll-snap-align:start;width:min(74vw,300px);position:relative}
.src-tag{
  position:absolute;left:7px;top:7px;font-size:9.5px;line-height:1.5;padding:2px 7px;
  border-radius:7px;color:#FFF;background:rgba(32,24,16,.62);
  backdrop-filter:blur(4px);letter-spacing:.02em;pointer-events:none;
}
.src-tag.xhs{background:rgba(226,40,64,.86)}
.gallery img{
  display:block;width:100%;height:172px;object-fit:cover;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--line);cursor:zoom-in;
}
.gallery img.broken{
  border-style:dashed;border-color:var(--line-2);cursor:default;
  background:repeating-linear-gradient(135deg,#F6F1E9,#F6F1E9 9px,#EFE7DB 9px,#EFE7DB 18px);
}
.gallery figcaption{
  font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gallery figcaption b{color:var(--ink-2);font-weight:500}
.nophoto{
  font-size:12.5px;color:var(--ink-3);line-height:1.6;
  padding:14px;background:#F6F1E9;border:1px dashed var(--line-2);
  border-radius:var(--r-m);text-align:center;
}
.lightbox{
  position:fixed;inset:0;z-index:2000;display:none;
  align-items:center;justify-content:center;background:rgba(20,14,8,.95);
  padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px);
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .lb-close{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);
  display:grid;place-items:center;color:#FFF;backdrop-filter:blur(6px);
}
.lightbox .lb-close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* ══════════ 桌面端 ══════════ */
@media (min-width:860px){
  .stage{flex-direction:row;position:static;height:100%}
  body{overflow:hidden}
  .shell{display:flex;flex-direction:column;height:100%}
  .topbar{position:relative}
  .main-row{flex:1;min-height:0;display:flex}
  #map{flex:1;min-height:0;order:2}
  .sheet{
    order:1;max-height:none;height:auto;width:392px;flex:none;
    border-top:0;border-right:1px solid var(--line);border-radius:0;
    box-shadow:none;
  }
  .grab{display:none}
  .sheet-head{padding-top:14px}
  /* 卡片高度对齐（2026-11-24）：桌面端是单列长列表，标签多一行就高 19px，
     一列里 130/149 交替看着像错位。统一按最高的那个留够，信息一个字都不砍。 */
  .card{min-height:150px}
  .card-body{justify-content:center}
  .detail{align-items:center;justify-content:center;padding:24px}
  .detail-inner{
    max-width:620px;border-radius:var(--r-xl);max-height:86vh;
    padding:0 26px 26px;box-shadow:var(--sh-3);
  }
  .d-top{border-radius:var(--r-xl) var(--r-xl) 0 0}
}
/* 横滑行的提示：右边留一道渐隐，滑到头自动消失。
   之前这两行能滑但看不出来右边还有东西（实测筛选条宽 727、可视 390）。 */
.scrollfade{
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
}
.scrollfade.at-end{-webkit-mask-image:none;mask-image:none}


@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ── 图例：图标和类型的对应关系，横排小字 ── */
.legend{display:flex;gap:12px;margin:0 12px 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.legend::-webkit-scrollbar{display:none}
.legend .lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);white-space:nowrap;cursor:pointer;padding:3px 7px;border-radius:999px;border:1px solid transparent;user-select:none}
.legend .lg[aria-pressed="true"]{background:transparent;border-color:transparent;color:var(--ink-2)}
.legend .lg[aria-pressed="false"]{opacity:.42}
.legend i{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;flex:none}
.legend i svg{width:9px;height:9px}
/* ── 行程条 ── */
.tripbar{display:none;align-items:center;gap:8px;margin:0 12px 8px;padding:9px 12px;background:var(--ink);color:#fff;border-radius:12px;font-size:13px}
.tripbar.on{display:flex}
.tripbar .tb-btn{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.install-bar{position:fixed;left:12px;right:12px;bottom:16px;z-index:9000;
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);
  opacity:0;transform:translateY(12px);transition:opacity .22s,transform .22s}
.install-bar.on{opacity:1;transform:translateY(0)}
/* 桌面端手机条不该拉满 1280px 横在路上：挪到下面居中、限宽，跟内容一样宽 */
@media (min-width:860px){
  .install-bar{left:50%;right:auto;width:520px;margin-left:-260px}
  .install-bar.on{transform:translateY(0)}
}
.install-bar .ib-t{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.install-bar .ib-t b{display:block;font-size:14px;color:var(--ink-1);margin-bottom:2px}
.install-bar .ib-go,.install-bar .ib-x{flex:none;border:0;border-radius:10px;font:inherit;
  font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer}
.install-bar .ib-go{background:var(--ink);color:#fff}
.install-bar .ib-x{background:var(--paper-2);color:var(--ink-3);padding:9px 12px}
.has-install-bar #list{padding-bottom:96px}
.has-install-bar #plan-body{padding-bottom:96px}
.has-install-bar #home-body{padding-bottom:96px}
.skel-tip{padding:4px 2px 12px;font-size:13px;color:var(--ink-3)}
.skel-card{height:118px;border-radius:12px;margin:0 0 10px;
  background:linear-gradient(100deg,var(--paper-2) 20%,rgba(0,0,0,.045) 40%,var(--paper-2) 60%);
  background-size:220% 100%;animation:skel 1.1s linear infinite}
@keyframes skel{0%{background-position:120% 0}100%{background-position:-20% 0}}
@media (prefers-reduced-motion:reduce){.skel-card{animation:none}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;
  display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:9999;max-width:calc(100vw - 40px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{flex:none;background:rgba(255,255,255,.22);border:0;color:#fff;font:inherit;
  font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer}
.been-chip{display:inline-flex;align-items:center;gap:4px;margin:0 6px 6px 0;padding:5px 4px 5px 10px;
  border:1px solid var(--line);border-radius:999px;background:var(--paper-2);font-size:12.5px;color:var(--ink-2)}
.been-chip .bc-x{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:15px;
  line-height:1;padding:2px 6px;border-radius:999px;cursor:pointer}
.been-chip .bc-x:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.fp-note{padding:2px 0 10px;font-size:12.5px;color:var(--ink-3)}
.beenbtn{width:100%;border:1px solid var(--line-2);background:transparent;color:var(--ink-3);
  font:inherit;font-size:13px;padding:9px 0;border-radius:10px;cursor:pointer}
.beenbtn.on{border-color:var(--line-2);background:var(--paper-2);color:var(--ink-2)}
.tripbtn{width:100%;border:1px dashed var(--line-2);background:var(--paper-2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:11px 0;border-radius:12px;cursor:pointer}
.tripbtn.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green)}
/* ── 行程面板 ── */
.trip-panel{position:fixed;inset:0;display:none;z-index:1300;background:rgba(22,26,24,.35)}
.trip-panel.open{display:block}
.trip-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:82vh;overflow:auto;background:var(--paper);border-radius:var(--r-l);padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.trip-sheet h3{margin:0 0 4px;font-size:16px}
.trip-sub{color:var(--ink-3);font-size:12px;margin-bottom:10px}
.trip-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.trip-item:last-child{border-bottom:0}
.trip-item .ti-n{flex:1;min-width:0}
.trip-item .ti-t{font-weight:600;font-size:14px}
.trip-item .ti-m{color:var(--ink-2);font-size:12px;margin-top:3px}
.trip-item .ti-x{border:0;background:transparent;color:var(--ink-3);font-size:19px;line-height:1;cursor:pointer;padding:0 6px;height:26px}
.trip-actions{display:flex;gap:8px;margin-top:16px}
.trip-actions button{flex:1;border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:10px 0;border-radius:10px;cursor:pointer}
.trip-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ─── 本周推荐 ─── */
.plan-panel{position:fixed;inset:0;display:none;z-index:1400;background:rgba(22,26,24,.38)}
.plan-panel.open{display:block}
.plan-sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(680px,94vw);max-height:88vh;background:var(--paper);border-radius:var(--r-l);
  box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.plan-top{flex:none;padding:20px 20px 0}
.plan-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:0 20px}
.plan-sheet h3{margin:0 0 4px;font-size:17px;font-family:var(--font-display)}
.plan-sub{color:var(--ink-3);font-size:12px;margin-bottom:12px}
.plan-note{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:12px;color:var(--ink-2);line-height:1.7;margin-bottom:14px}
.plan-note summary{cursor:pointer;list-style:none;outline:none}
.plan-note summary::-webkit-details-marker{display:none}
.plan-note summary::after{content:"展开说明 ›";float:right;color:var(--brand-2);font-weight:600;margin-left:8px}
.plan-note[open] summary::after{content:"收起 ⌄"}
.plan-note .pn-body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.plan-card{border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:14px;margin-bottom:14px;box-shadow:var(--sh-1)}
.plan-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan-head h4{margin:0;font-size:15px}
.plan-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pt-2d{background:var(--terra-soft);color:var(--terra-2)}
.pt-1d{background:var(--green-soft);color:var(--green)}
.pt-hd{background:var(--slate-soft);color:var(--slate)}
.plan-maxh{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.pw-note{font-size:11px;color:var(--amber-ink);opacity:.9}
.plan-week{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;padding-bottom:2px}
.pw-day{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 8px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);font-size:10.5px;line-height:1.35;color:var(--ink-2)}
.pw-day i{font-style:normal;color:var(--ink-3)}
.pw-day b{font-size:12px}
.pw-day s{text-decoration:none;color:var(--ink-3)}
.pw-good b{color:var(--green)}
.pw-mid b{color:var(--amber-ink)}
.pw-bad b{color:var(--rose)}
.pw-pick{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.plan-refreshing{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);border-radius:9px;padding:6px 10px;margin:10px 0 4px}
.plan-weeks{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.plan-weeks button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-2)}
.plan-weeks button i{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:4px}
.plan-weeks button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.plan-weeks button.on i{color:rgba(255,255,255,.8)}
.plan-score{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.plan-score span{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.plan-score b{font-size:14px;color:var(--ink)}
.plan-score .ps-combo{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-2)}
.plan-score i{font-style:normal;font-size:11px;color:var(--ink-3)}
.plan-why{font-size:11.5px;color:var(--ink-3);line-height:1.65;margin-bottom:10px}
.plan-now{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:8px}
.plan-now i{font-style:normal;color:var(--ink-3);margin-left:auto;font-size:11px}
.plan-warn{font-size:12px;color:var(--rose);background:var(--rose-soft);border-radius:9px;padding:8px 10px;margin-bottom:10px;line-height:1.6}
.plan-weather{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);background:var(--amber-soft);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.plan-weather b{color:var(--amber-ink)}
.pw-score{margin-left:auto;font-weight:700;color:var(--amber-ink)}
.pw-fail{background:var(--rose-soft);color:var(--rose)}
.plan-stops{list-style:none;margin:0;padding:0}
/* 2026-11-20（第二版）：第一版只加了淡箭头和 hover 底色，owner 说"还是不明显"。
   现在每个站点就是一个**带边框的白卡**，右下角挂一枚「详情 ›」药丸 ——
   形状、边界、文字三重提示，手机上也一眼能看出能点。 */
.plan-stop{position:relative;margin:9px 0;padding:11px 14px;
  border:1px solid var(--line);border-radius:13px;background:var(--card);
  box-shadow:var(--sh-1);cursor:pointer;
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease),transform .1s var(--ease)}
.plan-stop:hover{border-color:var(--brand);box-shadow:var(--sh-2)}
.plan-stop:hover .ps-name{color:var(--brand-2)}
.plan-stop:active{transform:scale(.995)}
.ps-foot{display:flex;justify-content:flex-end;margin-top:7px}
.ps-go{
  padding:3px 9px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-2);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.02em;
  transition:background .14s,color .14s}
.plan-stop:hover .ps-go{background:var(--brand);color:#F3F8F4}
.plan-daymark{list-style:none;margin:10px 0 2px;padding:3px 0;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;border-top:1px solid var(--line-2)}
.plan-stop:hover .ps-name{color:var(--brand)}
.ps-name{font-weight:600;font-size:14px}
.ps-meta{color:var(--ink-3);font-size:12px;margin-top:2px}
.ps-why{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ps-why span{font-size:11.5px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink-2)}
.ps-why i{font-style:normal;color:var(--ink-3);margin-left:4px}
.plan-line{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.65}
.plan-line b{color:var(--ink);margin-right:4px}
.plan-foot{font-size:11.5px;color:var(--ink-3);line-height:1.7;padding:6px 2px 0}
.plan-loading{text-align:center;color:var(--ink-3);font-size:13px;padding:40px 0}
.plan-btn{border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand-2);font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
/* 手机端：打开就是本周推荐，地图是第二层 */
.home{display:none}
.viewtabs{display:none}

@media (max-width:859px){
  .shell{display:flex;flex-direction:column;height:100%}
  .viewtabs{display:inline-flex;flex:none;background:var(--paper-2);
    border:1px solid var(--line-2);border-radius:999px;padding:2px;margin-left:auto}
  .viewtabs button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;
    color:var(--ink-2);padding:7px 12px;border-radius:999px;cursor:pointer}
  .viewtabs button.on{background:var(--ink);color:#F4F7F4}
  .topbar .plan-btn{display:none}

  .shell[data-view="plan"] .main-row{display:none}
  /* 筛选条和图例只服务于"浏览地图"，推荐页上它们是噪音，占 90px */
  .shell[data-view="plan"] .filters,
  .shell[data-view="plan"] .searchbar,
  .shell[data-view="plan"] .fpanel,
  .shell[data-view="plan"] .fscrim,
  .shell[data-view="plan"] .legend,
  .shell[data-view="plan"] .tripbar{display:none}
  .shell[data-view="plan"] .topbar{padding-bottom:8px}
  .shell[data-view="plan"] .home{display:flex}
  .home{flex:1;min-height:0;flex-direction:column;background:var(--paper)}
  .home-top{flex:none;display:flex;align-items:center;gap:8px;
    padding:10px var(--pad-r) 6px var(--pad-l)}
  .home-sub{font-size:12.5px;color:var(--ink-3)}
  .home-refresh{margin-left:auto;font:inherit;font-size:12px;font-weight:600;
    color:var(--brand-2);background:var(--brand-soft);border:1px solid var(--line-2);
    border-radius:999px;padding:8px 12px;cursor:pointer}
  .home-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:0 var(--pad-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--pad-l)}

  /* 拆盒：卡片套小盒、小盒再套边框，一屏里十几层描边，看着就累。
     手机上改成"通栏 + 分隔线"，靠字重和留白分层。 */
  .plan-card{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;
    box-shadow:none;padding:16px 0;margin-bottom:0}
  .plan-card:first-of-type{border-top:0;padding-top:10px}
  .plan-now{background:transparent;border:0;border-radius:0;padding:0 0 2px;margin-bottom:10px}
  .pw-day{background:transparent;border:0;border-radius:0;padding:2px 0;align-items:flex-start;
    min-width:74px}
  .plan-week{margin:0 0 12px;gap:10px;padding-bottom:0}
  .plan-note{background:transparent;border:0;border-radius:0;padding:0 0 6px;margin-bottom:6px;
    border-bottom:1px solid var(--line)}
  .plan-note .pn-body{border-top:0;padding-top:6px}
  /* 字号整体抬一档：原来正文 11.5px、标签 10.5px，手机上读着累 */
  .plan-card h4{font-size:17px}
  .plan-card h4{font-size:17px}
  .plan-note{font-size:13px;line-height:1.6}
  /* float 会让"展开说明"插进正文中间，手机上让它单独占一行 */
  .plan-note summary::after{float:none;display:block;text-align:right;margin:2px 0 0;font-size:12px}
  .pw-day{font-size:11.5px;padding:7px 9px}
  .pw-day b{font-size:13.5px}
  .ps-name{font-size:15px}
  .ps-meta{font-size:12.5px}
  .ps-why{font-size:12px}
  .plan-foot{font-size:12px}
  .card-name{font-size:16px}
  .card-meta{font-size:13px}
  /* 手机上是地图在上、列表在下（原来是列表在上、地图被压到屏幕底部，
     圆角也朝上——不像地图应用）。column-reverse 只改视觉顺序，不动 DOM。 */
  .main-row{flex:1;min-height:0;display:flex;flex-direction:column-reverse}

  /* 标题行：副标题原本会折成两行，白占一行高度 */
  .brand-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-name{font-size:15.5px}
  .topbar{padding-top:calc(8px + env(safe-area-inset-top,0px))}

  /* 触控目标：34px 偏小，抬到 40px（配 8px 间隔） */
  .chip,.chip-wrap{height:40px;font-size:13px}
  .chip{padding:0 12px}
  .plan-btn{height:40px;padding:0 14px;font-size:13px}
  .count-pill{padding:5px 9px}
  .filters{padding-top:8px;padding-bottom:9px;gap:6px}
  .filters .chip-wrap input[type=range]{width:72px}
  .legend{margin:0 12px 6px}
  .legend .lg{padding:6px 8px;font-size:11.5px}
  .legend i{width:17px;height:17px}
  .legend i svg{width:10px;height:10px}
  /* 行程条浮在地图上方，不再占标题栏的高度（有行程时白占 56px） */
  .tripbar{position:absolute;left:12px;right:12px;bottom:-60px;margin:0;padding:9px 12px;
    box-shadow:0 10px 24px -12px rgba(22,26,24,.55)}
  .tripbar .tb-btn{padding:8px 14px}

  /* 缩略图放大，点得准也看得清 */
  .card-thumb{width:72px;height:72px;border-radius:14px}
  .card-name{font-size:15px}

  /* 缩放按钮挪到地图左下角：原来在左上，正好压着聚合圆点 */
  .leaflet-top.leaflet-left{top:auto;bottom:16px}
  .leaflet-top .leaflet-control{margin-left:10px;margin-top:0}
  .leaflet-control-zoom a{width:38px;height:38px;line-height:38px;font-size:19px}

  /* 推荐面板全屏，头部固定、内容自己滚、按钮钉在底部 */
  .plan-panel{background:var(--paper)}
  .plan-sheet{left:0;top:0;transform:none;width:100%;height:100%;max-height:100%;
    border-radius:0;box-shadow:none}
  .plan-top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
  .plan-top h3{font-size:18px}
  .plan-weeks{gap:6px}
  .plan-weeks button{flex:1;min-width:0;padding:6px 4px;font-size:12px;line-height:1.35}
  .plan-weeks button i{display:block;margin-left:0;font-size:10.5px}
  .plan-scroll{padding:0 16px}
  .plan-sheet .trip-actions{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);background:var(--paper)}
  .plan-sheet .trip-actions button{min-height:46px}
}
/* 站点明细：桌面展开，手机收起，不然一条路线比一屏还长 */
.stops-d summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--brand-2);
  padding:8px 0 6px 0;border-top:1px solid var(--line);display:block;position:relative;padding-right:58px}
.stops-d summary::-webkit-details-marker{display:none}
/* 「展开/收起」钉在右上角：摘要里现在还要放一行名字链，
   用 flex 的话链子会被挤到标题右边、跟它抢同一行（2026-11-24）。 */
.stops-d summary::after{content:"展开 ›";position:absolute;right:0;top:8px;
  font-weight:600;color:var(--ink-3);white-space:nowrap}
.stops-d[open] summary::after{content:"收起 ⌄"}
.stops-d summary{border-bottom:0}
.stops-d[open] summary{border-bottom:0}
.stops-d .sd-body{padding-top:2px}
.sd-chain{margin-top:5px;font-weight:400;font-size:12px;line-height:1.6;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sd-chain .arw{color:var(--ink-3);margin:0 1px}


/* 以某点为中心排行程（2026-11-21）：入口按钮 + 分天版面 */
.anchorbtn{
  width:100%;margin-top:8px;padding:11px 14px;border-radius:12px;cursor:pointer;
  border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand-2);
  font:inherit;font-size:13.5px;font-weight:600;text-align:left;
}
.achips{display:flex;gap:7px;flex-wrap:wrap}
.aday{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.aday:first-child{border-top:0;padding-top:0}
.aday-h{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.aday-h .adir{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.astop{padding:9px 0 0;display:flex;flex-direction:column;gap:2px}
.as-n{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.as-tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;
  background:var(--brand);color:#F4F7F4;letter-spacing:.02em}
.as-m{font-size:12px;color:var(--ink-2)}
.as-w{font-size:11.5px;color:var(--ink-3)}
.asleep{margin-top:9px;padding:8px 10px;border-radius:10px;background:var(--brand-soft);
  font-size:12.5px;color:var(--brand-2)}
.atrip-foot{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line-2);
  font-size:11.5px;line-height:1.65;color:var(--ink-3)}

/* 筛选体验（2026-11-21）：已启用状态、清空、折叠、组内说明 */
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.fsum-clear{color:var(--terra-2);border-style:dashed;font-weight:600}
.chip-more{border-style:dashed;color:var(--ink-2)}
.fp-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fp-hint{font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:0}

.chip-locate::before{content:"◎";margin-right:4px;font-size:12px;opacity:.75}
.chip-locate.busy{opacity:.6;pointer-events:none}
.origin-back{margin:6px 0 0;padding:8px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.12);background:transparent;color:var(--ink-2);font-size:12.5px;cursor:pointer}
.origin-back[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.origin-grid{display:flex;flex-direction:column;gap:2px}
.origin-here{margin:2px 0 0;padding:9px 12px;border-radius:10px;border:1px dashed var(--brand);background:transparent;color:var(--brand-2);font-size:13px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brandrow">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 12.6c-1.7 0-3.3 1-4.2 2.4-.5.8-.3 1.8.4 2.3.6.4 1.3.4 1.9.1.6-.3 1.2-.5 1.9-.5s1.3.2 1.9.5c.6.3 1.3.3 1.9-.1.7-.5.9-1.5.4-2.3-.9-1.4-2.5-2.4-4.2-2.4zM6.5 12.2c1.1 0 2-1.1 2-2.5s-.9-2.5-2-2.5-2 1.1-2 2.5.9 2.5 2 2.5zm11 0c1.1 0 2-1.1 2-2.5s-.9-2.5-2-2.5-2 1.1-2 2.5.9 2.5 2 2.5zM9.2 8.1c1 0 1.8-1.1 1.8-2.4S10.2 3.3 9.2 3.3 7.4 4.4 7.4 5.7s.8 2.4 1.8 2.4zm5.6 0c1 0 1.8-1.1 1.8-2.4s-.8-2.4-1.8-2.4-1.8 1.1-1.8 2.4.8 2.4 1.8 2.4z"/></svg></div>
      <div class="brand-txt">
        <div class="brand-name">带狗去哪儿</div>
        <button class="brand-sub origin-btn" id="origin-line" aria-haspopup="dialog">从上海出发 · 加载中</button>
      </div>
      <div class="count-pill" id="count">—</div>
      <div class="viewtabs" id="viewtabs" role="tablist">
        <button data-view="plan" class="on" role="tab">推荐</button>
        <button data-view="map" role="tab">地图</button>
      </div>
      <button class="plan-btn" id="plan-open">本周推荐</button>
    </div>
    <div class="filters" id="filters">
      <label class="chip-wrap" title="默认不限，自己拖才生效">单程 <b id="range-out">不限</b>
        <input type="range" id="range" min="1" max="13" step="0.5" value="13">
      </label>
      <button class="chip chip-locate" id="locate" aria-pressed="false" title="用当前位置当出发点">定位</button>
      <button class="chip" id="fpanel-toggle" aria-pressed="false" aria-expanded="false">筛选 <b id="fpanel-n"></b></button>
      <button class="chip" id="search-toggle" aria-pressed="false">搜索</button>
      <span id="fsum"></span>
    </div>
    <div class="searchbar" id="searchbar">
      <input id="q" type="search" placeholder="搜地点或城市，如 莫干山 / 湖州" autocomplete="off" enterkeyhint="search">
      <button class="sb-x" id="q-clear" aria-label="清空搜索">✕</button>
    </div>
    <!-- 面板里的两组：想干什么（场景）+ 带不带狗（政策分档）。
         犬政策拆两档是因为风险不同：「明确友好」是笔记/园区明说可以带，
         「默认允许」只是现场没有禁止标识，去之前得自己确认。 -->
  <!-- 筛选做成底部抽屉（2026-11-21）：原来它展开在 header 里，会把地图压掉一大截，
       手机上基本等于没地图可看。抽屉最高 62vh，上半屏地图始终可见，点遮罩或「完成」收起。 -->
  <div class="fscrim" id="fscrim"></div>
  <div class="fpanel" id="fpanel" role="dialog" aria-label="筛选">
    <div class="fp-bar">
      <span class="fp-grab"></span>
      <span class="fp-name">筛选</span>
      <button class="fp-done" id="fpanel-done">完成</button>
    </div>
    <div class="fp-body">

  <div class="fp-title">排序<small class="fp-hint">列表先按什么排</small></div>
  <button class="chip" data-sort="drive" aria-pressed="true">先看近的</button>
  <button class="chip" data-sort="heat" aria-pressed="false">先看火的</button>
  <button class="chip" data-sort="dog" aria-pressed="false">先看犬友好</button>

  <div class="fp-title">想干什么<small class="fp-hint">可多选 · 任一项对上就算</small></div>
  <div id="fpanel-derived" style="display:contents"></div>
  <div id="fpanel-scenes" style="display:contents"></div>
  <div class="fp-title">带狗<small class="fp-hint">只勾一档就够</small></div>
  <button class="chip" data-dog="explicit" aria-pressed="false">明确友好</button>
  <button class="chip" data-dog="default" aria-pressed="false">默认允许</button>
  <!-- 「去哪儿」：福建/山东/江西的点位已经入库，但筛选条上原来没有任何入口，
       只能在图上放大缩小去找——对"扩到全国"等于没做。按省不设门槛（江西只有 4 个
       也照样列），因为这里的目的正是让人**看见**新省份。 -->
  <div class="fp-title">什么季节</div>
  <button class="chip" data-season="当季最佳" aria-pressed="false">当季最佳</button>
  <button class="chip" data-season="春" aria-pressed="false">春</button>
  <button class="chip" data-season="夏" aria-pressed="false">夏</button>
  <button class="chip" data-season="秋" aria-pressed="false">秋</button>
  <button class="chip" data-season="冬" aria-pressed="false">冬</button>
  <div class="fp-title">去哪儿<small class="fp-hint">可多选 · 省份之间是"或"</small></div>
  <div id="fpanel-provinces" style="display:contents"></div>
  <!-- 去过的（2026-11-24）：标了就得能看见、能改，否则标错了只能靠回忆去详情页找回来 -->
  <div id="fpanel-been" style="display:contents"></div>
    </div>
  </div>
    <!-- 一张图上全都有，靠图标分类型：帐篷=能睡的营地，树=公园… -->
    <div class="legend" id="legend"></div>
    <div class="tripbar" id="tripbar">
      <span>行程 <b id="trip-count">0</b> 个点</span>
      <button class="tb-btn" id="trip-share">分享</button>
      <button class="tb-btn" id="trip-open">查看</button>
    </div>
  </header>

  <div class="home" id="home">
    <div class="home-top">
      <div class="home-sub" id="home-sub">本周带狗去哪</div>
      <button class="home-refresh" id="home-refresh">重查天气</button>
    </div>
    <div class="home-body" id="home-body"></div>
  </div>

  <div class="main-row">
    <div class="sheet" id="sheet">
      <div class="grab" id="grab"><i></i></div>
      <div class="sheet-head">
        <h2 id="sheet-title">按车程排序</h2>
        <div class="hint" id="list-hint"></div>
      </div>
      <div class="list" id="list">
        <!-- 骨架（2026-11-24）：spots.json 是 3.4MB（gzip 457KB），手机上要好几百毫秒到几秒。
